<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:Arial,sans-serif;background:linear-gradient(160deg,#071c0d,#0d3d1a,#0a2e12);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
.card{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:20px;padding:28px 24px;width:100%;max-width:380px;}
img{height:180px;width:auto;display:block;margin:0 auto 8px;mix-blend-mode:screen;border-radius:16px;}
.sub{text-align:center;font-size:11px;color:rgba(255,255,255,.35);margin-bottom:24px;letter-spacing:.05em;}
.label{font-size:11px;font-weight:700;color:rgba(255,255,255,.5);text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px;}
select,input{width:100%;padding:13px;border:1.5px solid rgba(255,255,255,.15);border-radius:12px;background:rgba(255,255,255,.08);color:#fff;font-family:Arial;font-size:15px;margin-bottom:14px;outline:none;}
select option{background:#0d3d1a;color:#fff;}
button{width:100%;padding:14px;background:linear-gradient(135deg,#f47820,#e06010);color:#fff;border:none;border-radius:12px;font-size:15px;font-weight:800;cursor:pointer;font-family:Arial;}
button:disabled{opacity:.5;}
.err{color:#fca5a5;font-size:12px;text-align:center;margin-top:10px;display:none;}
.dots{display:flex;gap:10px;justify-content:center;margin:12px 0;}
.dot{width:10px;height:10px;background:rgba(255,255,255,.3);border-radius:50%;transition:background .2s;}
.dot.active{background:#f47820;}
</style>

  <div class="sub">Gestion Grossiste Légumes</div>

  <div id="step1">
    <div class="label">Sélectionnez votre compte</div>
    <select id="selUser"><option value="">Chargement...</option></select>
    <div class="label">Code PIN</div>
    <div class="dots">
      <div class="dot" id="d1"></div>
      <div class="dot" id="d2"></div>
      <div class="dot" id="d3"></div>
      <div class="dot" id="d4"></div>
    </div>
    <input type="password" id="pin" maxlength="8" inputmode="numeric"
      placeholder="••••" oninput="updateDots(this.value)" autocomplete="off"/>
    <button onclick="connexion()" id="btnConnect">Connexion →</button>
    <div class="err" id="errMsg"></div>
  </div>
</div>

<script>
const SB_URL = "https://rhlrlnmoitfrzqdcvuoq.supabase.co";
const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJobHJsbm1vaXRmcnpxZGN2dW9xIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA1Mjk0NTAsImV4cCI6MjA5NjEwNTQ1MH0.fIFPK8DbmY5bpaTel4_nv5eMF61MmvMUUNkXCdgrZlk";
const HDR = {"apikey":SB_KEY,"Authorization":"Bearer "+SB_KEY,"Content-Type":"application/json"};

let users = [];

function updateDots(v){
  for(let i=1;i<=4;i++){
    document.getElementById("d"+i).className = "dot"+(v.length>=i?" active":"");
  }
}

async function chargerUsers(){
  try{
    const r = await fetch(SB_URL+"/rest/v1/utilisateurs?order=nom.asc",{headers:HDR});
    if(!r.ok) throw new Error("HTTP "+r.status);
    users = await r.json();
    const sel = document.getElementById("selUser");
    sel.innerHTML = '<option value="">— Choisir —</option>';
    users.filter(u=>u.actif!==false).forEach(u=>{
      const opt = document.createElement("option");
      opt.value = u.id;
      opt.textContent = u.nom + (u.role==="admin"?" (Admin)":u.role==="admin_second"?" (Admin)":"");
      sel.appendChild(opt);
    });
  }catch(e){
    document.getElementById("errMsg").textContent = "Erreur connexion : "+e.message;
    document.getElementById("errMsg").style.display = "block";
  }
}

async function hashPin(pin) {
  const enc = new TextEncoder().encode(pin + atob("dmVyZGFwcF9zYWx0X2NpXzIwMjY="));
  const buf = await crypto.subtle.digest("SHA-256", enc);
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("");
}

async function connexion(){
  const uid = document.getElementById("selUser").value;
  const pin = document.getElementById("pin").value;
  const btn = document.getElementById("btnConnect");
  const err = document.getElementById("errMsg");

  if(!uid){ err.textContent="Sélectionnez un utilisateur."; err.style.display="block"; return; }
  if(!pin){ err.textContent="Saisissez votre PIN."; err.style.display="block"; return; }

  btn.disabled = true; btn.textContent = "Connexion...";
  err.style.display = "none";

  const user = users.find(u=>u.id===uid);
  if(!user){ err.textContent="Utilisateur introuvable."; err.style.display="block"; btn.disabled=false; btn.textContent="Connexion →"; return; }

  try{
    const h = await hashPin(pin);
    const storedPin = user.pin_hash || user.pin;
    const ok = storedPin.length===64 ? h===storedPin : pin===storedPin;

    if(!ok){ err.textContent="Code PIN incorrect."; err.style.display="block"; btn.disabled=false; btn.textContent="Connexion →"; return; }

    // Sauvegarder la session
    localStorage.setItem("va_session", JSON.stringify({...user, ts:Date.now()}));

    // Rediriger selon le rôle
    if(user.role==="admin"){
      window.location.href = "../bo/";
    } else {
      // Charger l'app front complète
      window.location.href = "app.html";
    }
  }catch(e){
    err.textContent = "Erreur : "+e.message;
    err.style.display = "block";
    btn.disabled=false; btn.textContent="Connexion →";
  }
}

// Permettre Entrée pour se connecter
document.addEventListener("keydown", e=>{ if(e.key==="Enter") connexion(); });

// Charger les utilisateurs au démarrage
chargerUsers();
</script>
