<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');

:root{
  --green-900:#0d2e15;--green-800:#1a5c2a;--green-700:#2d8c3e;
  --green-600:#2d8c3e;--green-500:#3aad50;--green-400:#5cc96e;
  --orange:#f47820;--orange-light:#f9a45c;--orange-dark:#c45e10;
  --green-100:#e8f8f0;--green-50:#f2fbf6;
  --amber:#f47820;--red:#e74c3c;--blue:#2980b9;
  --gray-900:#1a1a2e;--gray-800:#16213e;
  --white:#ffffff;--gray-50:#f8fafb;--gray-100:#f0f5f1;
  --gray-200:#e2ece7;--gray-300:#c8ddd1;--gray-500:#3d5c48;
  --gray-600:#2a3d32;--text:#0f1f16;
  --shadow:0 2px 12px rgba(20,90,50,.10);
  --shadow-md:0 4px 24px rgba(20,90,50,.14);
  --sidebar-w:220px;
  --topbar-h:96px;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0;}
body{font-family:'Inter',sans-serif;background:var(--gray-100);color:var(--text);overscroll-behavior:none;min-height:100vh;}

/* ── INPUTS ── */
input,select,textarea{
  background:var(--white);border:1.5px solid var(--gray-200);color:var(--text);
  border-radius:10px;padding:9px 12px;font-size:13px;width:100%;
  outline:none;font-family:inherit;-webkit-appearance:none;
  box-shadow:0 1px 3px rgba(0,0,0,.04);transition:border .2s;
}
input:focus,select:focus,textarea:focus{border-color:#2d8c3e;box-shadow:0 0 0 3px rgba(45,140,62,.12);}
select option{background:var(--white);color:var(--text);}

/* ── TOPBAR (mobile + desktop) ── */
#topbar{
  background:linear-gradient(135deg,#0d3d1a 0%,#1a4a22 50%,#0d3d1a 100%);
  border-bottom:2px solid rgba(244,120,32,.3);
  position:fixed;top:0;left:0;right:0;z-index:50;
  height:var(--topbar-h);
  display:flex;align-items:center;
  padding:0 16px;
  box-shadow:0 3px 20px rgba(0,0,0,.35);
}
#topbar-inner{display:flex;align-items:center;justify-content:space-between;width:100%;max-width:1400px;margin:0 auto;}

/* ── SIDEBAR (desktop only) ── */
#sidebar{
  display:none;
  position:fixed;top:var(--topbar-h);left:0;bottom:0;width:var(--sidebar-w);
  background:linear-gradient(180deg,#0a2e12 0%,#061a0b 100%);
  border-right:1px solid rgba(244,120,32,.15);
  z-index:40;overflow-y:auto;padding:16px 0;
}
.nav-item{
  display:flex;align-items:center;gap:10px;
  padding:11px 20px;cursor:pointer;
  font-size:13px;font-weight:600;color:rgba(255,255,255,.55);
  transition:all .2s;border-left:3px solid transparent;
  border:none;background:none;width:100%;font-family:inherit;text-align:left;
}
.nav-item:hover{background:rgba(255,255,255,.06);color:rgba(255,255,255,.85);}
.nav-item.active{background:rgba(244,120,32,.15);color:#f4a050;border-left:3px solid #f47820;font-weight:700;}
.nav-icon{font-size:16px;width:20px;text-align:center;flex-shrink:0;}

/* ── BOTTOM NAV (mobile only) ── */
#bottomnav{
  position:fixed;bottom:0;left:0;right:0;z-index:50;
  background:linear-gradient(135deg,#0d2e15,#1a1a2e);
  border-top:1px solid rgba(255,255,255,.08);
  display:flex;height:56px;
  box-shadow:0 -2px 16px rgba(0,0,0,.2);
}
.bnav-item{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:2px;cursor:pointer;border:none;background:none;font-family:inherit;
  color:rgba(255,255,255,.4);font-size:9px;font-weight:600;transition:all .2s;
  padding:4px 0;
}
.bnav-item.active{color:#f47820;}
.bnav-item .bnav-icon{font-size:18px;line-height:1;}

/* ── MAIN CONTENT ── */
#main{
  margin-top:var(--topbar-h);
  padding:20px 16px 72px;
  max-width:700px;margin-left:auto;margin-right:auto;
}

/* ── DESKTOP LAYOUT ── */
@media(min-width:768px){
  #sidebar{display:block;}
  #bottomnav{display:none;}
  #main{
    margin-left:var(--sidebar-w);
    max-width:none;
    padding:28px 32px 40px;
    margin-top:var(--topbar-h);
    margin-right:0;
  }
  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  .grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;}
  .grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;}
  .dash-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px;}
  .dash-row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;margin-bottom:16px;}
  .form-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}
  #topbar-inner{padding-left:calc(var(--sidebar-w) + 16px);}
}
@media(max-width:767px){
  .grid-2,.grid-3,.grid-4{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .dash-row,.dash-row-3{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;}
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
}

/* ── CARDS ── */
.card{background:var(--white);border:1.5px solid var(--gray-200);border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:var(--shadow);}
@media(min-width:768px){.card{padding:20px;border-radius:18px;}}

/* ── KPI CARDS ── */
.kpi-card{border-radius:16px;padding:16px;box-shadow:0 3px 16px rgba(0,0,0,.15);margin-bottom:0;}
@media(min-width:768px){.kpi-card{padding:20px;border-radius:18px;}}

/* ── BADGES ── */
.badge{border-radius:999px;padding:3px 9px;font-size:10px;font-weight:700;white-space:nowrap;}
.b-lime{background:#e8f5ea;color:#1a5c2a;border:1px solid #a8d5b0;}
.b-amber{background:#fef9c3;color:#a16207;border:1px solid #fde68a;}
.b-sky{background:#e0f2fe;color:#0369a1;border:1px solid #bae6fd;}
.b-stone{background:var(--gray-100);color:var(--gray-600);border:1px solid var(--gray-200);}
.b-red{background:#fee2e2;color:#dc2626;border:1px solid #fecaca;}
.b-orange{background:#fff7ed;color:#c2410c;border:1px solid #fed7aa;}
.b-purple{background:#f3e8ff;color:#7c3aed;border:1px solid #ddd6fe;}

/* ── LABELS ── */
.label{font-size:10px;font-weight:700;color:#2a3d32;text-transform:uppercase;letter-spacing:.08em;display:block;margin-bottom:5px;}

/* ── SECTION TITLE ── */
.section-title{font-size:16px;font-weight:800;color:#0d2e15;margin-bottom:14px;display:flex;align-items:center;gap:8px;}
@media(min-width:768px){.section-title{font-size:18px;margin-bottom:18px;}}

/* ── TOAST ── */
.toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);z-index:999;padding:12px 24px;border-radius:12px;font-weight:700;font-size:13px;text-align:center;display:none;box-shadow:0 8px 32px rgba(0,0,0,.15);white-space:nowrap;}

/* ── SPINNER ── */
.spinner{width:15px;height:15px;border:2px solid rgba(255,255,255,.2);border-top:2px solid #f47820;border-radius:50%;animation:spin .7s linear infinite;display:inline-block;flex-shrink:0;}
@keyframes spin{to{transform:rotate(360deg);}}

/* ── BUTTONS ── */
.btn{padding:11px 16px;border-radius:12px;border:none;cursor:pointer;font-family:inherit;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;transition:all .2s;}
.btn-green{background:linear-gradient(135deg,#1a5c2a,#2d8c3e);color:#fff;box-shadow:0 3px 12px rgba(45,140,62,.3);}
.btn-green:hover{box-shadow:0 4px 16px rgba(46,204,113,.4);}
.btn-green:active{transform:translateY(1px);}
.btn-ghost{background:#f0f5f1;color:#0d2e15;border:1.5px solid var(--gray-200);}
.btn-ghost:hover{background:var(--gray-200);}
.btn-red{background:#fef2f2;color:#dc2626;border:1.5px solid #fecaca;}
.btn-red:hover{background:#fee2e2;}
.btn:disabled{opacity:.5;cursor:not-allowed;}

/* ── FILTERS ── */
.filter-btn{padding:6px 14px;border-radius:999px;font-size:11px;font-weight:700;border:none;cursor:pointer;font-family:inherit;transition:all .2s;}
.f-active{background:#f47820;color:#fff;box-shadow:0 2px 8px rgba(244,120,32,.3);}
.f-inactive{background:var(--gray-100);color:#2a3d32;border:1px solid var(--gray-200);}

/* ── ICON BUTTONS ── */
.icon-btn{background:var(--gray-100);border:1.5px solid var(--gray-200);color:#2a3d32;padding:7px 10px;border-radius:8px;cursor:pointer;font-size:13px;line-height:1;transition:all .2s;}
.icon-btn:hover{background:var(--gray-200);}
.icon-btn-green{background:#dcfce7;border:1.5px solid #bbf7d0;color:#15803d;padding:7px 10px;border-radius:8px;cursor:pointer;font-size:13px;line-height:1;}
.icon-btn-orange{background:#fff7ed;border:1.5px solid #fed7aa;color:#c2410c;padding:7px 10px;border-radius:8px;cursor:pointer;font-size:13px;line-height:1;}

/* ── MODAL ── */
.modal-overlay{position:fixed;inset:0;background:rgba(13,51,32,.55);backdrop-filter:blur(4px);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px;}
.modal{background:var(--white);border:1.5px solid var(--gray-200);border-radius:20px;padding:22px;width:100%;max-width:520px;max-height:90vh;overflow-y:auto;box-shadow:var(--shadow-md);}

/* ── TABLE ── */
.data-table{width:100%;border-collapse:collapse;font-size:13px;}
.data-table th{background:var(--gray-100);color:#1a2e22;font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.06em;padding:10px 12px;text-align:left;border-bottom:1.5px solid var(--gray-200);}
.data-table td{padding:10px 12px;border-bottom:1px solid var(--gray-100);vertical-align:middle;}
.data-table tr:last-child td{border-bottom:none;}
.data-table tr:hover td{background:var(--gray-50);}

/* ── NOTIF DOT ── */
.notif-dot{width:7px;height:7px;background:#ef4444;border-radius:50%;display:inline-block;margin-left:3px;vertical-align:middle;}

/* ── SCROLLBAR ── */
::-webkit-scrollbar{width:4px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--gray-300);border-radius:4px;}
</style>
</head>

    localStorage.removeItem("va_sec_locked");
    localStorage.setItem("va_sec_attempts","0");
  }
  return false;
}

  return false;
}

// ── HASHAGE PIN (SHA-256 via Web Crypto API) ─────────────────────────────────
async function hashPin(pin){
  const enc = new TextEncoder().encode(pin + "verdapp_salt_ci_2026");
  const buf = await crypto.subtle.digest("SHA-256", enc);
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("");
}

async function verifyPin(saisie, stocke){
  // stocke peut être hash SHA-256 ou PIN brut (rétrocompatibilité)
  if(stocke.length === 64){ // c'est un hash
    const h = await hashPin(saisie);
    return h === stocke;
  }
  return saisie === stocke; // fallback PIN brut
}

async function migrerPinVersHash(){
  const pinBrut = localStorage.getItem("va_admin_pin");
  if(pinBrut && pinBrut.length < 64){
    const h = await hashPin(pinBrut);
    localStorage.setItem("va_admin_pin", h);
  }
}

// ─── SÉCURITÉ : Sanitization XSS ────────────────────────────────────────────
function sanitize(str){
  if(str===null||str===undefined) return "";
  const s=String(str);
  const map={"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#x27;"};
  return s.replace(/[&<>"']/g,function(ch){return map[ch]||ch;});
}

// Sanitize objet entier (shallow)
function sanitizeObj(obj){
  if(!obj||typeof obj!=="object") return obj;
  const r={};
  for(const k in obj){
    r[k]=typeof obj[k]==="string"?sanitize(obj[k]):obj[k];
  }
  return r;
}

// MOTEUR DE MARGE FIFO
// Calcule la marge en suivant quel lot a été consommé pour chaque vente
// ════════════════════════════════════════════════════════════════════════════

/**
 * Calcule le coût FIFO d'une quantité vendue d'un produit
 * à une date donnée, en simulant la consommation des lots.
 *
 * @param {string} produit
 * @param {number} qteVendue
 * @param {string} dateVente
 * @param {Array}  ventesAvant - ventes déjà passées (pour calculer ce qui reste)
 * @returns {number} coût total FIFO de cette vente
 */
/**
 * Retourne le coût FIFO d'une vente, décomposé en :
 *  - coutMarchandise : prix d'achat pur (sans frais)
 *  - coutAvecFrais   : prix d'achat + frais terrain proportionnels
 */
function coutFIFOVente(produit, qteVendue, dateVente, ventesAvant) {
  const lots = achats
    .filter(a => a.produit === produit && a.statut === "recu"
              && (a.date_reception||a.date) <= dateVente)
    .sort((a,b) => new Date(a.date_reception||a.date) - new Date(b.date_reception||b.date));

  if(!lots.length) return 0;

  const qteDejaVendue = (ventesAvant||[])
    .filter(v => v.produit === produit)
    .reduce((s,v) => s+v.quantite, 0);

  let aConsommer = qteDejaVendue;
  const lotsRestants = lots.map(lot => {
    const consomme = Math.min(aConsommer, lot.quantite);
    aConsommer = Math.max(0, aConsommer - lot.quantite);
    const fraisTotaux = (lot.droit_terre||0)+(lot.transport||0)+(lot.droit_vente||0)+(lot.charrette||0);
    return {
      ...lot,
      qteRestante: lot.quantite - consomme,
      prixAchatUnitaire: lot.prix_unitaire,                          // prix pur
      fraisUnitaires: lot.quantite ? fraisTotaux/lot.quantite : 0,   // frais ramenés à l'unité
      coutRevientUnitaire: lot.quantite
        ? (lot.quantite*lot.prix_unitaire + fraisTotaux) / lot.quantite
        : lot.prix_unitaire
    };
  }).filter(l => l.qteRestante > 0);

  let coutMarchandise = 0; // prix d'achat pur (pour marge BRUTE)
  let coutAvecFrais   = 0; // prix + frais (pour marge NETTE)
  let aVendre = qteVendue;

  for(const lot of lotsRestants) {
    if(aVendre <= 0) break;
    const pris = Math.min(aVendre, lot.qteRestante);
    coutMarchandise += pris * lot.prixAchatUnitaire;
    coutAvecFrais   += pris * lot.coutRevientUnitaire;
    aVendre -= pris;
  }

  // Fallback si stock insuffisant
  if(aVendre > 0 && lotsRestants.length) {
    const dernier = lotsRestants[lotsRestants.length-1];
    coutMarchandise += aVendre * dernier.prixAchatUnitaire;
    coutAvecFrais   += aVendre * dernier.coutRevientUnitaire;
  }

  return coutAvecFrais; // retourne le coût complet (prix + frais)
}

/**
 * Version décomposée : retourne séparément coût marchandise et frais.
 * Utilisée pour afficher marge brute ET marge nette distinctement.
 */
function coutFIFOVenteDetail(produit, qteVendue, dateVente, ventesAvant) {
  const lots = achats
    .filter(a => a.produit === produit && a.statut === "recu"
              && (a.date_reception||a.date) <= dateVente)
    .sort((a,b) => new Date(a.date_reception||a.date) - new Date(b.date_reception||b.date));

  if(!lots.length) return {coutMarchandise:0, coutFrais:0, coutTotal:0};

  const qteDejaVendue = (ventesAvant||[])
    .filter(v => v.produit === produit)
    .reduce((s,v) => s+v.quantite, 0);

  let aConsommer = qteDejaVendue;
  const lotsRestants = lots.map(lot => {
    const consomme = Math.min(aConsommer, lot.quantite);
    aConsommer = Math.max(0, aConsommer - lot.quantite);
    const fraisTotaux = (lot.droit_terre||0)+(lot.transport||0)+(lot.droit_vente||0)+(lot.charrette||0);
    return {
      ...lot,
      qteRestante: lot.quantite - consomme,
      prixAchatUnitaire: lot.prix_unitaire,
      fraisUnitaires: lot.quantite ? fraisTotaux/lot.quantite : 0
    };
  }).filter(l => l.qteRestante > 0);

  let coutMarchandise = 0;
  let coutFrais = 0;
  let aVendre = qteVendue;

  for(const lot of lotsRestants) {
    if(aVendre <= 0) break;
    const pris = Math.min(aVendre, lot.qteRestante);
    coutMarchandise += pris * lot.prixAchatUnitaire;
    coutFrais       += pris * lot.fraisUnitaires;
    aVendre -= pris;
  }

  if(aVendre > 0 && lotsRestants.length) {
    const dernier = lotsRestants[lotsRestants.length-1];
    coutMarchandise += aVendre * dernier.prixAchatUnitaire;
    coutFrais       += aVendre * dernier.fraisUnitaires;
  }

  return {coutMarchandise, coutFrais, coutTotal: coutMarchandise+coutFrais};
}

/**
 * Calcule la marge brute FIFO d'un tableau de ventes.
 * Trie les ventes par date pour respecter la séquence FIFO.
 * @param {Array} ventesArr - tableau de ventes (défaut: global ventes)
 * @returns {number} marge brute FIFO
 */
/**
 * MARGE BRUTE FIFO = CA − Coût d'achat marchandise pur (sans frais terrain)
 * Mesure la marge sur le négoce pur.
 */
function margebrute(ventesArr) {
  const arr = (ventesArr || ventes).slice().sort((a,b)=>new Date(a.date)-new Date(b.date));
  let margeTotal = 0;
  const ventesPassees = {};
  arr.forEach(v => {
    if(!ventesPassees[v.produit]) ventesPassees[v.produit] = [];
    const {coutMarchandise} = coutFIFOVenteDetail(v.produit, v.quantite, v.date, ventesPassees[v.produit]);
    margeTotal += v.quantite*v.prix_vente - coutMarchandise;
    ventesPassees[v.produit].push(v);
  });
  return margeTotal;
}

/**
 * MARGE NETTE FIFO = CA − Coût total (marchandise + frais terrain)
 * Ce qu'il reste après TOUS les coûts d'achat.
 */
function margenette(ventesArr) {
  const arr = (ventesArr || ventes).slice().sort((a,b)=>new Date(a.date)-new Date(b.date));
  let margeTotal = 0;
  const ventesPassees = {};
  arr.forEach(v => {
    if(!ventesPassees[v.produit]) ventesPassees[v.produit] = [];
    const {coutTotal} = coutFIFOVenteDetail(v.produit, v.quantite, v.date, ventesPassees[v.produit]);
    margeTotal += v.quantite*v.prix_vente - coutTotal;
    ventesPassees[v.produit].push(v);
  });
  return margeTotal;
}

/**
 * Marge brute FIFO par vente individuelle (pour l'affichage dans la liste ventes).
 * @param {object} vente
 * @param {Array} ventesAvant - ventes précédentes du même produit
 * @returns {{ca, cout, marge, taux}}
 */
function margeVenteFIFO(vente, ventesAvant) {
  const ca = vente.quantite * vente.prix_vente;
  const {coutMarchandise, coutFrais, coutTotal} = coutFIFOVenteDetail(
    vente.produit, vente.quantite, vente.date, ventesAvant||[]
  );
  const margeB = ca - coutMarchandise;           // marge BRUTE (sans frais)
  const margeN = ca - coutTotal;                 // marge NETTE (avec frais)
  const tauxB  = ca ? Math.round(margeB/ca*100) : 0;
  const tauxN  = ca ? Math.round(margeN/ca*100) : 0;
  return {
    ca, coutMarchandise, coutFrais, coutTotal,
    marge: margeN,   // compatibilité avec le code existant → utilise nette
    margeB, margeN, tauxB, tauxN,
    taux: tauxN
  };
}

// margenette() est définie dans le bloc FIFO ci-dessus

/**
 * Version filtrée : marge FIFO sur une période (jour/mois/année).
 * @param {Array} ventesF - ventes filtrées sur la période
 * @param {Array} achatsF - achats filtrés (pour les frais)
 */
function calculerMargeFIFO(ventesF, achatsF) {
  const ca     = ventesF.reduce((s,v)=>s+v.quantite*v.prix_vente, 0);
  const margeB = margebrute(ventesF);   // CA − coût marchandise pur
  const margeN = margenette(ventesF);   // CA − (marchandise + frais terrain)
  const frais  = margeB - margeN;       // frais terrain imputés aux ventes
  const tauxB  = ca ? Math.round(margeB/ca*100) : 0;
  const tauxN  = ca ? Math.round(margeN/ca*100) : 0;
  // coutAch = coût marchandise seul (pour décomposition)
  const coutAch = ca - margeB;
  return {ca, coutAch, frais, margeB, margeN, tauxB, tauxN};
}

// Alias pour compatibilité avec l'ancien calculerMarge
function calculerMarge(ventesF, achatsF) {
  return calculerMargeFIFO(ventesF, achatsF||[]);
}

  const pinStocke = pinBrut || await hashPin(ADMIN_PIN_DEFAULT);
  const h = await hashPin(val);
  const ok = (pinStocke.length === 64) ? h === pinStocke : val === pinStocke;
  if(ok){
    secRecordSuccess();
    isAdmin=true;
    closeModal();
    logAdminAction("LOGIN", "Connexion admin réussie");
    getEl("modeLabel").textContent="Mode Admin ✓";
    getEl("modeLabel").style.color="#f47820";
    getEl("adminBtn").style.background="rgba(244,120,32,.2)";
    getEl("adminBtn").style.color="#f47820";
    showToast("✓ Mode Admin activé");
    render();
  } else {
    const bloque = secRecordFail();
    if(bloque){
      showToast(`🔒 Compte bloqué 5 min après trop de tentatives`,"error");
    } else {
      showToast(`Code incorrect (${SEC.MAX_ATTEMPTS - SEC.attempts} essai${SEC.MAX_ATTEMPTS - SEC.attempts > 1 ? "s" : ""} restant)`,"error");
    }
    document.getElementById("pinInput").value="";
  }
}

// ─── FORMULAIRE ACHAT (réutilisable pour ajout et modification) ──────────────
function calcAchat(){
  const q=+document.getElementById("af_qte")?.value||0;
  const p=+document.getElementById("af_prix")?.value||0;
  const av=+document.getElementById("af_avance")?.value||0;
  const dt=+document.getElementById("af_droit_terre")?.value||0;
  const tr=+document.getElementById("af_transport")?.value||0;
  const dv=+document.getElementById("af_droit_vente")?.value||0;
  const ch=+document.getElementById("af_charrette")?.value||0;
  const box=document.getElementById("af_calc");
  if(!box) return;
  if(q&&p){
    box.style.display="grid";
    const totalAchat=q*p;
    const totalFrais=dt+tr+dv+ch;
    const totalRevient=totalAchat+totalFrais;
    const coutUnitaire=q?totalRevient/q:0;
    const solde=totalAchat-av;
    document.getElementById("af_calcTotal").textContent=fmt(totalAchat);
    const es=document.getElementById("af_calcSolde");
    es.textContent=fmt(solde); es.style.color=solde>0?"#f87171":"#bef264";
    const cr=document.getElementById("af_calcRevient");
    if(cr){cr.textContent=fmt(totalRevient);}
    const cu=document.getElementById("af_calcUnitaire");
    if(cu){cu.textContent=fmt(coutUnitaire)+"/u";}
  } else { box.style.display="none"; }
}

function calcVente(){
  const q=+document.getElementById("vf_qte")?.value||0;
  const p=+document.getElementById("vf_prix")?.value||0;
  const prod=document.getElementById("vf_produit")?.value||"";
  const box=document.getElementById("vf_calc");
  if(!box) return;
  if(q&&p){
    box.style.display="grid";
    document.getElementById("vf_calcTotal").textContent=fmt(q*p);
    const cm=coutMoyen(prod);
    const marge=cm?(p-cm)*q:null;
    const el=document.getElementById("vf_calcMarge");
    if(marge!==null){el.textContent=fmt(marge);el.style.color=marge>=0?"#15803d":"#dc2626";}
    else{el.textContent="N/A";el.style.color="#78716c";}
  } else { box.style.display="none"; }
}

function attachCalcEvents(){
  ["af_qte","af_prix","af_avance","af_droit_terre","af_transport","af_droit_vente","af_charrette"].forEach(id=>{
    const el=document.getElementById(id);
    if(el) el.addEventListener("input",calcAchat);
  });
  ["vf_qte","vf_prix","vf_produit"].forEach(id=>{
    const el=document.getElementById(id);
    if(el) el.addEventListener("input",calcVente);
  });
  calcAchat(); calcVente();
}

  try{

      await sbDelete(demande.table_cible,demande.enregistrement_id);

    await sbUpdate("demandes",id,{statut:"accepte"});

}

function coutMoyen(produit){
  const lots=achats.filter(a=>a.produit===produit&&a.statut==="recu");
  const tv=lots.reduce((s,a)=>{
    const frais=(a.droit_terre||0)+(a.transport||0)+(a.droit_vente||0)+(a.charrette||0);
    return s+a.quantite*a.prix_unitaire+frais;
  },0);
  const tq=lots.reduce((s,a)=>s+a.quantite,0);
  return tq?tv/tq:0;
}

// MODULE COMMISSION — 10% marge nette par lot enregistré
// ════════════════════════════════════════════════════════════════════════════

/**
 * Calcule la commission d'un utilisateur sur ses lots enregistrés.
 * Commission = 10% de la marge nette de chaque lot vendu.
 * Un lot = un achat marqué "reçu" enregistré par cet utilisateur.
 */
function calculerCommission(nomUtilisateur) {
  // Lots enregistrés par cet utilisateur
  const lotsUser = achats.filter(a =>
    a.statut === "recu" &&
    (a.enregistre_par === nomUtilisateur || a.auteur === nomUtilisateur)
  );

  if(!lotsUser.length) return {lots:[], totalCommission:0, totalMargeNette:0};

  const resultats = lotsUser.map(lot => {
    // Ventes de ce produit depuis ce lot (FIFO)
    const fifo = calculerFIFO(lot.produit);
    const lotFifo = fifo.lots.find(l=>l.id===lot.id);
    if(!lotFifo) return {lot, qteVendue:0, margeNette:0, commission:0};

    const qteVendue = lotFifo.qteConsommee;
    if(!qteVendue) return {lot, qteVendue:0, margeNette:0, commission:0};

    // Marge nette de ce lot = (prix_vente_moy - coût_revient) × qte_vendue
    // On utilise les ventes réelles filtrées par ordre FIFO
    const ventesLot = [];
    let aConsommer = 0;
    // Calculer combien de ventes correspondent à ce lot
    const lotsAvant = fifo.lots.filter(l=>fifo.lots.indexOf(l) < fifo.lots.indexOf(lotFifo));
    const qteAvant = lotsAvant.reduce((s,l)=>s+l.qteInitiale, 0);
    const ventesTriees = ventes
      .filter(v=>v.produit===lot.produit)
      .sort((a,b)=>new Date(a.date)-new Date(b.date));

    let aSkip = qteAvant;
    let aPrendre = qteVendue;
    const ventesImputees = [];
    for(const v of ventesTriees) {
      if(aPrendre <= 0) break;
      if(aSkip >= v.quantite) { aSkip -= v.quantite; continue; }
      const skip = aSkip;
      aSkip = 0;
      const pris = Math.min(aPrendre, v.quantite - skip);
      aPrendre -= pris;
      // Créer une vente virtuelle pour la portion imputée à ce lot
      ventesImputees.push({...v, quantite: pris});
    }

    const margeNetteL = margenette(ventesImputees);
    const commission = Math.max(0, margeNetteL * 0.10);

    return {
      lot,
      produit: lot.produit,
      fournisseur: lot.fournisseur,
      date: lot.date_reception||lot.date,
      qteInitiale: lot.quantite,
      qteVendue,
      margeNette: margeNetteL,
      commission
    };
  });

  const totalMargeNette = resultats.reduce((s,r)=>s+r.margeNette, 0);
  const totalCommission = resultats.reduce((s,r)=>s+r.commission, 0);

  return {lots: resultats, totalMargeNette, totalCommission};
}

      <button onclick="exportDashboardCSV()" style="background:#f0fdf4;border:1.5px solid #bbf7d0;color:#15803d;border-radius:10px;padding:8px 14px;cursor:pointer;font-size:12px;font-weight:700;font-family:inherit;">⬇ Export CSV</button>
    </div>
  </div>
  <div class="grid-4" style="margin-bottom:14px;">
    <div style="background:linear-gradient(135deg,#1e3a5f,#1a2e4a);border:none;border-radius:14px;padding:14px;box-shadow:0 3px 12px rgba(30,58,95,.3);">

      <div style="font-size:9px;font-weight:700;color:#86efac;text-transform:uppercase;letter-spacing:.1em;">Total ventes</div>
      <div style="font-size:17px;font-weight:900;color:#fff;margin-top:4px;line-height:1.1;">${fmt(totalV)}</div>
      <div style="font-size:10px;color:#4ade80;margin-top:4px;">${nbVentes} vente${nbVentes>1?"s":""}</div>
      <div style="font-size:10px;color:rgba(255,255,255,.5);margin-top:2px;">Brute : ${fmt(marge)}  ·  Nette : ${fmt(margeNette)}</div>
    </div>
    <div style="background:${totalDus>0?"linear-gradient(135deg,#7f1d1d,#991b1b)":"linear-gradient(135deg,#14532d,#166534)"};border:none;border-radius:14px;padding:14px;box-shadow:0 3px 12px rgba(0,0,0,.15);">
      <div style="font-size:9px;font-weight:700;color:${totalDus>0?"#fca5a5":"#86efac"};text-transform:uppercase;letter-spacing:.1em;">Dû fournisseurs</div>
      <div style="font-size:17px;font-weight:900;color:#fff;margin-top:4px;line-height:1.1;">${fmt(totalDus)}</div>
      <div style="font-size:10px;color:${totalDus>0?"#f87171":"#4ade80"};margin-top:4px;">${totalDus>0?"⚠ À régler":"✓ Tout soldé"}</div>
    </div>
    <div style="background:linear-gradient(135deg,#78350f,#92400e);border:none;border-radius:14px;padding:14px;box-shadow:0 3px 12px rgba(120,53,15,.3);">
      <div style="font-size:9px;font-weight:700;color:#fdba74;text-transform:uppercase;letter-spacing:.1em;">Stocks transit</div>
      <div style="font-size:17px;font-weight:900;color:#fff;margin-top:4px;line-height:1.1;">${nbTransit}</div>
      <div style="font-size:10px;color:#c2410c;margin-top:4px;">En route vers Abidjan</div>
      <div style="font-size:10px;color:rgba(255,255,255,.5);margin-top:2px;">${nbRecus} reçu${nbRecus>1?"s":""}</div>
    </div>
  </div>`;

  // Alerte demandes
  if(isAdmin&&pending>0){
    html+=`<div onclick="switchTab('demandes')" style="background:#fff7ed;border:1.5px solid #fed7aa;border-radius:12px;padding:10px 14px;margin-bottom:10px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;">
      <div style="color:#c2410c;font-weight:700;font-size:12px;">⏳ ${pending} demande${pending>1?"s":""} en attente de validation</div>
      <div style="color:#3d5c48;font-size:11px;">Voir →</div>
    </div>`;
  }

  // ── LIGNE 2 : JAUGE + SANTÉ ──
  html+=`<div class="dash-row" style="margin-bottom:12px;">
    <div class="card" style="margin-bottom:0;cursor:pointer;transition:box-shadow .2s;" onclick="detailMarge()" title="Voir le détail de la marge">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
        <div class="label" style="margin-bottom:0;">📊 Marge</div>
        <span style="font-size:10px;color:#0369a1;font-weight:700;background:#eff6ff;padding:2px 8px;border-radius:999px;border:1px solid #bfdbfe;">Détail →</span>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px;">
        <div style="background:${taux>=20?'#f0fdf4':taux>=10?'#fff7ed':'#fef2f2'};border:1.5px solid ${taux>=20?'#bbf7d0':taux>=10?'#fed7aa':'#fecaca'};border-radius:12px;padding:10px;text-align:center;">
          <div style="font-size:20px;font-weight:900;color:${gaugeColor};">${taux}%</div>
          <div style="font-size:10px;color:#3d5c48;font-weight:700;margin-top:2px;">Taux brut</div>
          <div style="font-size:12px;font-weight:800;color:${gaugeColor};margin-top:3px;">${fmt(marge)}</div>
        </div>
        <div style="background:${margeNette>=0?'#f0fdf4':'#fef2f2'};border:1.5px solid ${margeNette>=0?'#bbf7d0':'#fecaca'};border-radius:12px;padding:10px;text-align:center;">
          <div style="font-size:20px;font-weight:900;color:${margeNette>=0?'#166534':'#dc2626'};">${tauxNet}%</div>
          <div style="font-size:10px;color:#3d5c48;font-weight:700;margin-top:2px;">Taux net</div>
          <div style="font-size:12px;font-weight:800;color:${margeNette>=0?'#166534':'#dc2626'};margin-top:3px;">${fmt(margeNette)}</div>
        </div>
      </div>
      <div style="height:6px;background:#e2ece7;border-radius:999px;overflow:hidden;">
        <div style="height:100%;background:${gaugeColor};border-radius:999px;width:${Math.min(taux,100)}%;transition:width .5s;"></div>
      </div>
      <div style="font-size:9px;color:#6b8c7a;text-align:center;margin-top:6px;">Frais terrain : −${fmt(fraisTerrain)}</div>
    </div>
    <div class="card" style="margin-bottom:0;">
      <div class="label" style="margin-bottom:10px;">Santé de l'activité</div>
      <table style="width:100%;border-collapse:collapse;font-size:12px;">
        <tr style="border-bottom:1px solid var(--gray-100);"><td style="padding:6px 0;color:var(--gray-500);">Achats</td><td style="padding:6px 0;color:#2980b9;font-weight:700;text-align:right;">${nbAchats} lots</td></tr>
        <tr style="border-bottom:1px solid var(--gray-100);"><td style="padding:6px 0;color:var(--gray-500);">En transit</td><td style="padding:6px 0;color:var(--amber);font-weight:700;text-align:right;">${nbTransit}</td></tr>
        <tr style="border-bottom:1px solid var(--gray-100);"><td style="padding:6px 0;color:var(--gray-500);">Reçus</td><td style="padding:6px 0;color:var(--green-600);font-weight:700;text-align:right;">${nbRecus}</td></tr>
        <tr style="border-bottom:1px solid var(--gray-100);"><td style="padding:6px 0;color:var(--gray-500);">Ventes</td><td style="padding:6px 0;color:var(--green-600);font-weight:700;text-align:right;">${nbVentes}</td></tr>
        <tr><td style="padding:6px 0;color:var(--gray-500);">Dû fourn.</td><td style="padding:6px 0;color:${totalDus>0?"#dc2626":"#22a356"};font-weight:700;text-align:right;">${fmt(totalDus)}</td></tr>
      </table>
    </div>
  </div>`;

  // ── LIGNE 3 : COURBE ÉVOLUTION ──
  if(evolVals.some(v=>v>0)){
    const W=300,H=70,PAD=10;
    const pts=evolVals.map((v,i)=>({
      x:PAD+(i/(evolDays.length-1||1))*(W-PAD*2),
      y:PAD+(1-(v/maxEvol))*(H-PAD*2)
    }));
    const polyline=pts.map(p=>`${p.x},${p.y}`).join(" ");
    const areaPath=`M${pts[0].x},${H} `+pts.map(p=>`L${p.x},${p.y}`).join(" ")+` L${pts[pts.length-1].x},${H} Z`;
    html+=`<div style="background:var(--white);border:1.5px solid var(--gray-200);border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:var(--shadow);">
      <div class="label" style="margin-bottom:10px;">📈 Évolution des ventes — 7 derniers jours</div>
      <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:70px;">
        <defs>
          <linearGradient id="gr2" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="var(--green-500)" stop-opacity="0.25"/>
            <stop offset="100%" stop-color="var(--green-500)" stop-opacity="0"/>
          </linearGradient>
        </defs>
        <!-- Grille -->
        ${[0,1,2,3].map(i=>`<line x1="${PAD}" y1="${PAD+(i/3)*(H-PAD*2)}" x2="${W-PAD}" y2="${PAD+(i/3)*(H-PAD*2)}" stroke="var(--gray-200)" stroke-width="0.5"/>`).join("")}
        <path d="${areaPath}" fill="url(#gr2)"/>
        <polyline points="${polyline}" fill="none" stroke="var(--green-600)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
        ${pts.map((p,i)=>evolVals[i]>0?`<circle cx="${p.x}" cy="${p.y}" r="3" fill="#bef264" stroke="#0c0a09" stroke-width="1.5"/>`:"").join("")}
      </svg>
      <div style="display:flex;justify-content:space-between;margin-top:4px;">
        ${evolDays.map((d,i)=>`<div style="font-size:9px;color:var(--gray-500);text-align:center;flex:1;">${d.slice(5).replace("-","/")}${evolVals[i]>0?`<div style="color:#15803d;font-size:8px;">${fmt(evolVals[i]).replace(" F","")}</div>`:""}</div>`).join("")}
      </div>
    </div>`;
  }

  // ── LIGNE 4 : CAMEMBERT + PROGRESSION PRODUITS ──
  if(topProduits.length){
    const pieSlices=buildPie(topProduits);
    html+=`<div class="dash-row" style="margin-bottom:12px;">
      <div class="card" style="margin-bottom:0;">
        <div class="label" style="margin-bottom:10px;">Répartition ventes</div>
        <svg viewBox="0 0 140 140" style="width:100%;max-width:180px;display:block;margin:0 auto;height:140px;">
          ${pieSlices}
          <circle cx="70" cy="70" r="28" fill="#ffffff" stroke="#e2ece7" stroke-width="1"/>
          <text x="70" y="67" text-anchor="middle" font-size="9" fill="#3d5c48">Total</text>
          <text x="70" y="79" text-anchor="middle" font-size="8" font-weight="700" fill="#15803d">${fmt(totalV).replace(" F","")}</text>
        </svg>
        <div style="margin-top:8px;">
          ${topProduits.slice(0,5).map(([p],i)=>`<div style="display:flex;align-items:center;gap:6px;margin-bottom:5px;">
            <div style="width:10px;height:10px;background:${CHART_COLORS[i%CHART_COLORS.length]};border-radius:3px;flex-shrink:0;"></div>
            <span style="font-size:11px;font-weight:600;color:#1a2e22;">${getProduitIcon(p)} ${p}</span>
          </div>`).join("")}
        </div>
      </div>
      <div class="card" style="margin-bottom:0;">
        <div class="label" style="margin-bottom:12px;">Progression par produit</div>
        ${topProduits.slice(0,5).map(([p,m],i)=>{
          const ico=getProduitIcon(p)||"🌿";
          const pct=Math.round((m/(topProduits[0][1]||1))*100);
          const col=CHART_COLORS[i%CHART_COLORS.length];
          return `<div style="margin-bottom:10px;">
            <div style="display:flex;justify-content:space-between;font-size:12px;font-weight:600;margin-bottom:4px;">
              <span style="color:#1a2e22;">${ico} ${p}</span>
              <span style="color:#1a2e22;font-weight:700;">${pct}%</span>
            </div>
            <div style="height:8px;background:var(--gray-200);border-radius:999px;overflow:hidden;">
              <div style="height:100%;background:${col};border-radius:999px;width:${pct}%;"></div>
            </div>
          </div>`;
        }).join("")}
      </div>
    </div>`;
  }

  // ── LIGNE 5 : ACHATS VS VENTES ──
  const allProduits=[...new Set([...Object.keys(byP),...Object.keys(byPA)])];
  if(allProduits.length){
    const maxAV=Math.max(...allProduits.map(p=>Math.max(byPA[p]||0,byP[p]||0)),1);
    html+=`<div class="card" style="margin-bottom:12px;">
      <div class="label" style="margin-bottom:10px;">⚖ Achats vs Ventes</div>
      <div style="display:flex;gap:16px;margin-bottom:12px;">
        <div style="display:flex;align-items:center;gap:5px;font-size:11px;font-weight:600;color:#0369a1;">
          <div style="width:10px;height:10px;background:#60a5fa;border-radius:2px;"></div>Achats
        </div>
        <div style="display:flex;align-items:center;gap:5px;font-size:11px;font-weight:600;color:#15803d;">
          <div style="width:10px;height:10px;background:#4ade80;border-radius:2px;"></div>Ventes
        </div>
      </div>
      ${allProduits.slice(0,6).map(p=>{
        const ico=getProduitIcon(p)||"🌿";
        const pa=byPA[p]||0,pv=byP[p]||0;
        const pctA=Math.round((pa/maxAV)*100),pctV=Math.round((pv/maxAV)*100);
        return `<div style="margin-bottom:10px;">
          <div style="font-size:12px;font-weight:600;color:#1a2e22;margin-bottom:4px;">${ico} ${p}</div>
          <div style="height:7px;background:var(--gray-200);border-radius:999px;overflow:hidden;margin-bottom:3px;">
            <div style="height:100%;background:#60a5fa;border-radius:999px;width:${pctA}%;"></div>
          </div>
          <div style="height:7px;background:var(--gray-200);border-radius:999px;overflow:hidden;">
            <div style="height:100%;background:#4ade80;border-radius:999px;width:${pctV}%;"></div>
          </div>
          <div style="display:flex;justify-content:space-between;font-size:10px;font-weight:600;margin-top:3px;">
            <span style="color:#0369a1;">${fmt(pa)}</span>
            <span style="color:#15803d;">${fmt(pv)}</span>
          </div>
        </div>`;
      }).join("")}
    </div>`;
  }

  // ── SOLDES FOURNISSEURS avec règlements ──
  if(Object.keys(dusFourn).length){
    // Calculer les règlements déjà effectués
    const regParFourn={};
    reglements.forEach(r=>{ regParFourn[r.fournisseur]=(regParFourn[r.fournisseur]||0)+r.montant; });

    html+=`<div style="background:#fef2f2;border:1.5px solid #fecaca;border-radius:16px;padding:14px;margin-bottom:10px;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
        <div style="font-size:9px;font-weight:700;color:#dc2626;text-transform:uppercase;letter-spacing:.1em;">⚠ Soldes fournisseurs à payer</div>
        <button onclick="voirReglements()" style="font-size:10px;font-weight:700;color:#0369a1;background:#eff6ff;border:1px solid #bfdbfe;border-radius:8px;padding:3px 10px;cursor:pointer;font-family:inherit;">📋 Historique</button>
      </div>`;
    Object.entries(dusFourn).forEach(([f,m])=>{
      const regEffectue=regParFourn[f]||0;
      const soldeNet=Math.max(0,m-regEffectue);
      html+=`<div style="padding:8px 0;border-bottom:1px solid #fecaca;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;">
          <span style="color:#0f1f16;font-size:12px;font-weight:600;">${f}</span>
          <div style="text-align:right;">
            <span style="color:#dc2626;font-weight:700;font-size:12px;">${fmt(soldeNet)}</span>
            ${regEffectue>0?`<div style="font-size:10px;color:#15803d;">Payé : ${fmt(regEffectue)}</div>`:""}
          </div>
        </div>
        ${soldeNet>0&&isAdmin?`<button onclick="payerFournisseur('${f}',${soldeNet})" style="font-size:10px;font-weight:700;color:#15803d;background:#f0fdf4;border:1px solid #bbf7d0;border-radius:8px;padding:3px 10px;cursor:pointer;font-family:inherit;width:100%;">✓ Marquer un paiement</button>`:""}
      </div>`;
    });
    html+=`</div>`;
  }

  document.getElementById("page-dashboard").innerHTML=html;
}

function renderAchats(){
  // Filtrage combiné statut + date + produit + fournisseur
  let liste=achats;
  if(filterAchats!=="tous") liste=liste.filter(a=>a.statut===filterAchats);
  if(filtreAchatDate)        liste=liste.filter(a=>a.date&&a.date.slice(0,7)===filtreAchatDate);
  if(filtreAchatProduit)     liste=liste.filter(a=>a.produit===filtreAchatProduit);
  if(filtreAchatFourn)       liste=liste.filter(a=>(a.fournisseur||"").toLowerCase().includes(filtreAchatFourn.toLowerCase()));

  const prodsDispos=[...new Set(achats.map(a=>a.produit))].filter(Boolean);
  const moisDispos=[...new Set(achats.map(a=>a.date?.slice(0,7)))].filter(Boolean).sort().reverse();

  let html=`<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center;">
    <button class="btn btn-green" onclick="showAchatForm()" style="flex-shrink:0;">+ Nouvel achat</button>
    <button onclick="exportAchatsCSV()" style="background:#f0fdf4;border:1.5px solid #bbf7d0;color:#15803d;border-radius:10px;padding:8px 14px;cursor:pointer;font-size:12px;font-weight:700;font-family:inherit;flex-shrink:0;">⬇ Export CSV</button>
    <button onclick="bilanJour()" style="background:#fff7ed;border:1.5px solid #fed7aa;color:#c2410c;border-radius:10px;padding:8px 14px;cursor:pointer;font-size:12px;font-weight:700;font-family:inherit;flex-shrink:0;">📊 Bilan du jour</button>
  </div>
  <div style="display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap;">
    <button class="filter-btn ${filterAchats==="tous"?"f-active":"f-inactive"}" onclick="setFilter('tous')">Tous</button>
    <button class="filter-btn ${filterAchats==="en_cours"?"f-active":"f-inactive"}" onclick="setFilter('en_cours')">En transit</button>
    <button class="filter-btn ${filterAchats==="recu"?"f-active":"f-inactive"}" onclick="setFilter('recu')">Reçus</button>
  </div>
  <div style="display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;">
    <select onchange="filtreAchatDate=this.value;renderAchats()" style="flex:1;min-width:120px;padding:7px 10px;border-radius:10px;border:1.5px solid var(--gray-200);font-family:inherit;font-size:12px;background:#fff;color:#0f1f16;">
      <option value="">📅 Tous les mois</option>
      ${moisDispos.map(m=>`<option value="${m}" ${filtreAchatDate===m?"selected":""}>${m}</option>`).join("")}
    </select>
    <select onchange="filtreAchatProduit=this.value;renderAchats()" style="flex:1;min-width:120px;padding:7px 10px;border-radius:10px;border:1.5px solid var(--gray-200);font-family:inherit;font-size:12px;background:#fff;color:#0f1f16;">
      <option value="">🌿 Tous les produits</option>
      ${prodsDispos.map(p=>`<option value="${p}" ${filtreAchatProduit===p?"selected":""}>${p}</option>`).join("")}
    </select>
    <input type="text" value="${filtreAchatFourn}" placeholder="🔍 Fournisseur..." oninput="filtreAchatFourn=this.value;renderAchats()" style="flex:1;min-width:120px;padding:7px 10px;border-radius:10px;border:1.5px solid var(--gray-200);font-family:inherit;font-size:12px;"/>
    ${(filtreAchatDate||filtreAchatProduit||filtreAchatFourn)?`<button onclick="filtreAchatDate='';filtreAchatProduit='';filtreAchatFourn='';renderAchats()" style="background:#fef2f2;border:1.5px solid #fecaca;color:#dc2626;border-radius:10px;padding:7px 12px;cursor:pointer;font-size:12px;font-weight:700;font-family:inherit;">✕ Reset</button>`:""}
  </div>
  ${liste.length?`<div style="font-size:11px;font-weight:600;color:#3d5c48;margin-bottom:8px;">${liste.length} résultat${liste.length>1?"s":""} · Total : ${fmt(liste.reduce((s,a)=>s+a.quantite*a.prix_unitaire,0))}</div>`:""}
  `;

  if(!liste.length){html+=`<div style="text-align:center;padding:40px 0;color:#3d5c48;font-size:13px;">Aucun achat</div>`;}
  else liste.forEach(a=>{
    const total=a.quantite*a.prix_unitaire,solde=total-(a.avance_paye||0);
    const hasPending=demandes.some(d=>d.enregistrement_id===a.id&&d.statut==="en_attente");
    html+=`<div class="card">
      <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:8px;">
        <div style="flex:1;min-width:0;">
          <div style="display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-bottom:5px;">
            <span style="font-size:18px;">${getProduitIcon(a.produit)||"🌿"}</span>
            <span style="font-weight:800;color:#0f1f16;font-size:14px;">${a.produit}</span>
            <span class="badge ${a.statut==="recu"?"b-lime":"b-amber"}">${a.statut==="recu"?"✓ Reçu":"⏳ Transit"}</span>
            <span class="badge b-stone">${a.unite}</span>
            ${hasPending?`<span class="badge b-orange">⏳ En révision</span>`:""}
          </div>
          <div style="font-size:11px;color:#3d5c48;margin-bottom:5px;">${a.date} · <span style="color:var(--gray-500);">${a.fournisseur}</span>${a.lieu?" · "+a.lieu:""}</div>
          <div style="display:flex;flex-wrap:wrap;gap:10px;font-size:11px;">
            <span style="color:#3d5c48;">${a.quantite} × ${fmt(a.prix_unitaire)}</span>
            <span style="color:#0f1f16;font-weight:600;">${fmt(total)}</span>

// ════════════════════════════════════════════════════════════════════════════
// MOTEUR FIFO — Valorisation et suivi des stocks lot par lot
// ════════════════════════════════════════════════════════════════════════════

/**
 * Calcule l'état FIFO d'un produit.
 * Retourne les lots dans l'ordre chronologique avec leur consommation.
 *
 * Algorithme :
 * 1. Trier les lots reçus par date (plus ancien en premier)
 * 2. Consommer les ventes lot par lot dans l'ordre
 * 3. Chaque lot a : qteInitiale, qteConsommée, qteRestante, statut
 */
function calculerFIFO(produit) {
  // Lots reçus triés par date (FIFO = premier entré premier sorti)
  const lots = achats
    .filter(a => a.produit === produit && a.statut === "recu")
    .sort((a, b) => new Date(a.date_reception||a.date) - new Date(b.date_reception||b.date));

  if(!lots.length) return { lots:[], qteTotal:0, qteDispo:0, qteVendue:0, coutFIFO:0, lotsActifs:[] };

  // Total vendu de ce produit
  let qteAVendre = ventes
    .filter(v => v.produit === produit)
    .reduce((s,v) => s+v.quantite, 0);

  // Pertes enregistrées
  const qtePerte = pertes[produit] || 0;
  qteAVendre += qtePerte;

  // Appliquer le FIFO lot par lot
  const lotsAvecEtat = lots.map(lot => {
    const qteInitiale = lot.quantite;
    const consommee = Math.min(qteAVendre, qteInitiale);
    qteAVendre = Math.max(0, qteAVendre - qteInitiale);
    const restante = qteInitiale - consommee;

    let statut;
    if(restante <= 0)          statut = "epuise";
    else if(consommee > 0)     statut = "partiel";
    else                       statut = "intact";

    return {
      ...lot,
      qteInitiale,
      qteConsommee: consommee,
      qteRestante: Math.max(0, restante),
      statut,
      coutUnitaire: lot.prix_unitaire,
      fraisUnitaires: (lot.droit_terre||0+lot.transport||0+lot.droit_vente||0+lot.charrette||0) / qteInitiale,
      coutRevient: lot.prix_unitaire + ((lot.droit_terre||0)+(lot.transport||0)+(lot.droit_vente||0)+(lot.charrette||0)) / qteInitiale
    };
  });

  const qteTotalRecu = lots.reduce((s,a) => s+a.quantite, 0);
  const qteTotalDispo = lotsAvecEtat.reduce((s,l) => s+l.qteRestante, 0);
  const qteTotalVendue = lotsAvecEtat.reduce((s,l) => s+l.qteConsommee, 0);

  // Lots actifs = non épuisés (stock disponible)
  const lotsActifs = lotsAvecEtat.filter(l => l.statut !== "epuise");

  // Coût FIFO du stock restant = valeur des lots actifs au prorata
  const coutFIFO = lotsActifs.reduce((s,l) => s+l.qteRestante*l.coutRevient, 0);

  // Prochain lot à consommer (pour info vendeur)
  const prochainLot = lotsActifs[0] || null;

  return {
    lots: lotsAvecEtat,
    lotsActifs,
    prochainLot,
    qteTotal: qteTotalRecu,
    qteDispo: Math.max(0, qteTotalDispo),
    qteVendue: qteTotalVendue,
    coutFIFO,
    nbLots: lots.length,
    nbLotsActifs: lotsActifs.length
  };
}

/**
 * Remplace coutMoyen() pour la marge avec la méthode FIFO.
 * Retourne le coût unitaire FIFO du prochain lot à vendre.
 */
function coutFIFOUnitaire(produit) {
  const fifo = calculerFIFO(produit);
  if(!fifo.prochainLot) return coutMoyen(produit); // fallback
  return fifo.prochainLot.coutRevient;
}

async function sauvegarderPIN(){
  const actuel=document.getElementById("pin_actuel").value;
  const nouveau=document.getElementById("pin_nouveau").value;
  const confirme=document.getElementById("pin_confirm").value;
  const pinCourant=localStorage.getItem("va_admin_pin") || await hashPin(ADMIN_PIN_DEFAULT);
  if(actuel!==pinCourant) return showToast("Code actuel incorrect","error");
  if(!nouveau||nouveau.length<4) return showToast("Le nouveau code doit avoir au moins 4 caractères","error");
  if(nouveau!==confirme) return showToast("Les deux codes ne correspondent pas","error");
  try{
    // Sauvegarde dans Supabase
    const h={...HDR,"Prefer":"resolution=merge-duplicates,return=representation"};
    const r=await fetch(`${SB_URL}/rest/v1/config`,{
      method:"POST", headers:h,
      body:JSON.stringify({cle:"admin_pin",valeur:nouveau,updated_at:new Date().toISOString()})
    });
    if(!r.ok) throw new Error(await r.text());
    // Sauvegarde locale
    const nouveauHash = await hashPin(nouveau);
    localStorage.setItem("va_admin_pin", nouveauHash);
    logAdminAction("CHANGEMENT_PIN","Code PIN admin modifié");
    closeModal();
    showToast("✓ Code PIN modifié pour tous les appareils");
  }catch(e){showToast("Erreur : "+e.message,"error");}
}

async function saveProduit(){
  const nom=document.getElementById("np_nom").value.trim();
  const icone=document.getElementById("np_icone").value||"🌿";
  if(!nom) return showToast("Entre un nom de produit","error");
  if(produits.find(p=>p.nom.toLowerCase()===nom.toLowerCase()))
    return showToast("Ce produit existe déjà","error");
  const payload={id:genId(),nom,icone,actif:true};
  try{
    await sbInsert("produits",payload);
    produits.push(payload); saveLocal();
    closeModal(); renderListeProduits();
    showToast("✓ Produit ajouté");
  }catch(e){showToast("Erreur : "+e.message,"error");}
}

async function toggleProduitActif(id,actif){
  try{
    await sbUpdate("produits",id,{actif:!actif});
    produits=produits.map(p=>p.id===id?{...p,actif:!actif}:p);
    saveLocal(); renderListeProduits();
    showToast(actif?"Produit désactivé":"Produit activé");
  }catch(e){showToast("Erreur : "+e.message,"error");}
}

async function supprimerProduit(id){
  const p=produits.find(x=>x.id===id);
  if(!confirm(`Supprimer "${p?.nom}" ?`)) return;
  try{
    await sbDelete("produits",id);
    produits=produits.filter(x=>x.id!==id);
    saveLocal(); renderListeProduits();
    showToast("Produit supprimé");
  }catch(e){showToast("Erreur : "+e.message,"error");}
}

// ── Supabase helpers chat ─────────────────────────────────────────────────────
async function sbGetMessages(since) {
  let url = SB_URL+"/rest/v1/messages?order=created_at.asc&limit=200";
  if (since) url += "&created_at=gt."+encodeURIComponent(since);
  const r = await fetch(url, { headers: HDR });
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}

async function sbSendMessage(payload) {
  const r = await fetch(SB_URL+"/rest/v1/messages", { method:"POST", headers:HDR, body:JSON.stringify(payload) });
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}

async function sbDeleteMessage(id) {
  const r = await fetch(SB_URL+"/rest/v1/messages?id=eq."+id, { method:"DELETE", headers:HDR });
  if (!r.ok) throw new Error(await r.text());
}

async function sbReactMessage(id, reactions) {
  const r = await fetch(SB_URL+"/rest/v1/messages?id=eq."+id, { method:"PATCH", headers:HDR, body:JSON.stringify({reactions}) });
  if (!r.ok) throw new Error(await r.text());
}

async function uploadChatImage(file) {
  const ext = file.name.split(".").pop().toLowerCase();
  const path = genId()+"."+ext;
  const h = { "apikey":SB_KEY, "Authorization":"Bearer "+SB_KEY, "Content-Type":file.type };
  const r = await fetch(SB_STORAGE+"/"+path, { method:"POST", headers:h, body:file });
  if (!r.ok) throw new Error(await r.text());
  return SB_STORAGE_PUBLIC+"/"+path;
}

// ── Chargement messages ───────────────────────────────────────────────────────
async function loadMessages(full) {
  try {
    const since = (!full && chatLastId && chatMessages.length) ? chatMessages[chatMessages.length-1].created_at : null;
    const msgs = await sbGetMessages(since);

    if (full) {
      chatMessages = msgs;
    } else {
      if (msgs.length) {
        const newMsgs = msgs.filter(m => !chatMessages.find(x => x.id === m.id));
        if (newMsgs.length) {
          chatMessages.push(...newMsgs);
          // Badge si pas sur le chat
          if (currentTab !== "chat") {
            chatUnreadCount += newMsgs.filter(m => m.auteur !== chatAuteur).length;
            updateChatBadge(chatUnreadCount);
          }
        } else return; // rien de nouveau
      } else return;
    }

    renderMessages();
  } catch(e) {
    const el = document.getElementById("chatMessages");
    if (el) el.innerHTML = '<div style="text-align:center;color:#dc2626;font-size:12px;padding:20px;">Erreur : '+e.message+'</div>';
  }
}

// ── Rendu messages ────────────────────────────────────────────────────────────
function renderMessages(filterText) {
  const el = document.getElementById("chatMessages");
  if (!el) return;

  const msgs = filterText
    ? chatMessages.filter(m => (m.contenu||"").toLowerCase().includes(filterText.toLowerCase()) || (m.auteur||"").toLowerCase().includes(filterText.toLowerCase()))
    : chatMessages;

  if (!msgs.length) {
    el.innerHTML = filterText
      ? '<div style="text-align:center;color:#6b8c7a;font-size:12px;padding:30px;">Aucun résultat pour "'+filterText+'"</div>'
      : '<div style="text-align:center;padding:40px 20px;"><div style="font-size:40px;margin-bottom:12px;">💬</div><div style="color:#6b8c7a;font-size:13px;">Aucun message.<br>Sois le premier à écrire !</div></div>';
    return;
  }

  let html = "";
  let lastDate = "";
  let lastAuteur = "";

  // Regrouper les membres actifs
  const membres = [...new Set(chatMessages.map(m => m.auteur))];

  msgs.forEach(m => {
    const isMe = m.auteur === chatAuteur;
    const d = new Date(m.created_at);
    const dateStr = d.toLocaleDateString("fr-CI",{day:"numeric",month:"long"});
    const timeStr = d.toLocaleTimeString("fr-CI",{hour:"2-digit",minute:"2-digit"});
    const isGrouped = lastAuteur === m.auteur && lastDate === dateStr;

    // Séparateur de date
    if (dateStr !== lastDate) {
      const isToday = dateStr === new Date().toLocaleDateString("fr-CI",{day:"numeric",month:"long"});
      html += '<div style="text-align:center;margin:12px 0 8px;"><span style="background:#e2ece7;color:#3d5c48;font-size:10px;font-weight:700;padding:4px 14px;border-radius:999px;">'+(isToday?"Aujourd'hui":dateStr)+'</span></div>';
      lastDate = dateStr;
    }
    lastAuteur = m.auteur;

    const reactions = m.reactions ? JSON.parse(m.reactions) : {};
    const reactHtml = Object.entries(reactions).filter(([,v])=>v>0).map(([k,v])=>
      '<button onclick="toggleReaction(\''+m.id+'\',\''+k+'\')" style="background:#f0fdf4;border:1px solid #bbf7d0;border-radius:999px;padding:2px 8px;cursor:pointer;font-size:12px;margin-right:3px;font-family:inherit;">'+k+' '+v+'</button>'
    ).join("");

    const replyHtml = m.reply_to ? (()=>{
      const orig = chatMessages.find(x=>x.id===m.reply_to);
      if (!orig) return "";
      return '<div style="background:rgba(0,0,0,.06);border-left:2px solid rgba(0,0,0,.2);border-radius:6px;padding:4px 8px;margin-bottom:4px;font-size:10px;opacity:.75;cursor:pointer;" onclick="scrollToMsg(\''+orig.id+'\')">↩ '+orig.auteur+' : '+(orig.contenu||"[image]").slice(0,50)+'</div>';
    })() : "";

    // Avatar couleur par auteur
    const avatarColors = ["#f47820","#0369a1","#166534","#7c3aed","#dc2626","#0891b2","#65a30d"];
    const avatarColor = avatarColors[membres.indexOf(m.auteur) % avatarColors.length];

    const deleteBtn = (isMe || isAdmin) ? '<button onclick="supprimerMsg(\''+m.id+'\')" style="background:none;border:none;cursor:pointer;font-size:10px;color:#dc2626;opacity:.5;padding:0 2px;margin-left:2px;" title="Supprimer">🗑</button>' : "";
    const replyBtn = '<button onclick="setReply(\''+m.id+'\',\''+escAttr(m.auteur)+'\',\''+escAttr((m.contenu||"[image]").slice(0,40))+'\')" style="background:none;border:none;cursor:pointer;font-size:10px;color:#0369a1;opacity:.6;padding:0 2px;" title="Répondre">↩</button>';
    const reactBtn = '<button onclick="showReactionPicker(\''+m.id+'\')" style="background:none;border:none;cursor:pointer;font-size:10px;opacity:.5;padding:0 2px;" title="Réagir">😊</button>';

    const isMention = !isMe && m.contenu && m.contenu.includes("@"+chatAuteur);
    const bg = isMe ? "linear-gradient(135deg,#0d3d1a,#166534)" : isMention ? "#fffbeb" : "#fff";
    const txtCol = isMe ? "#fff" : "#0f1f16";
    const shadow = isMe ? "0 2px 8px rgba(13,61,26,.2)" : isMention ? "0 2px 8px rgba(244,120,32,.1)" : "0 1px 4px rgba(0,0,0,.06)";
    const mentionBorder = isMention ? "border-left:3px solid #f47820;" : "";

    html += '<div id="msg-'+m.id+'" style="display:flex;justify-content:'+(isMe?"flex-end":"flex-start")+';margin-bottom:'+(isGrouped?"2px":"8px")+';">';

    // Avatar (côté gauche, seulement si pas groupé)
    if (!isMe) {
      html += '<div style="width:30px;margin-right:8px;flex-shrink:0;margin-top:auto;">';
      if (!isGrouped) {
        html += '<div style="width:30px;height:30px;background:'+avatarColor+';border-radius:999px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:900;color:#fff;">'+m.auteur.charAt(0).toUpperCase()+'</div>';
      }
      html += '</div>';
    }

    html += '<div style="max-width:78%;min-width:60px;">';
    if (!isMe && !isGrouped) html += '<div style="font-size:10px;font-weight:700;color:'+avatarColor+';margin-bottom:3px;padding-left:2px;">'+m.auteur+'</div>';

    html += '<div style="background:'+bg+';border-radius:'+(isMe?"14px 2px 14px 14px":"2px 14px 14px 14px")+';padding:'+(m.image_url&&!m.contenu?"4px":"9px 12px")+';box-shadow:'+shadow+';'+mentionBorder+'">';
    if (replyHtml) html += replyHtml;
    if (m.image_url) html += '<img src="'+m.image_url+'" style="max-width:220px;max-height:220px;border-radius:8px;display:block;cursor:pointer;" onclick="window.open(\''+m.image_url+'\',\'_blank\')"/>';
    if (m.contenu) {
      // Mettre en évidence les mentions
      const highlighted = m.contenu.replace(/@(\w+)/g, '<span style="background:rgba(244,120,32,.15);color:'+( isMe?"#fbbf24":"#c2410c")+';font-weight:700;border-radius:4px;padding:0 3px;">@$1</span>');
      html += '<div style="color:'+txtCol+';font-size:13px;line-height:1.5;'+(m.image_url?"margin-top:6px;":"")+'word-break:break-word;">'+highlighted+'</div>';
    }
    html += '<div style="display:flex;align-items:center;gap:2px;margin-top:3px;justify-content:flex-end;">';
    html += '<span style="font-size:9px;color:'+(isMe?"rgba(255,255,255,.55)":"#9cb8a8")+';margin-right:2px;">'+timeStr+'</span>';
    html += reactBtn+replyBtn+deleteBtn;
    html += '</div></div>';

    if (reactHtml) html += '<div style="margin-top:4px;padding:0 4px;">'+reactHtml+'</div>';
    html += '</div></div>';
  });

  const wasAtBottom = el.scrollHeight - el.scrollTop - el.clientHeight < 80;
  el.innerHTML = html;
  if (wasAtBottom || filterText === undefined) {
    requestAnimationFrame(() => { el.scrollTop = el.scrollHeight; });
  }
}

function escAttr(s) {
  return String(s||"").replace(/'/g,"&#x27;").replace(/"/g,"&quot;");
}

// ── Envoi message ─────────────────────────────────────────────────────────────
async function envoyerMessage() {
  const ta = document.getElementById("chatTexte");
  const texte = ta?.value.trim();
  if (!texte && !chatImageFile) return;
  if (!chatAuteur) return showToast("Entre ton prénom d'abord","error");

  const btn = document.getElementById("chatSendBtn");
  btn.disabled = true;
  btn.style.transform = "scale(.9)";

  try {
    let imageUrl = null;
    if (chatImageFile) {
      imageUrl = await uploadChatImage(chatImageFile);
      clearChatImg();
    }
    const payload = {
      id: genId(),
      auteur: chatAuteur,
      contenu: texte || null,
      image_url: imageUrl || null,
      reply_to: chatReplyTo ? chatReplyTo.id : null,
      reactions: null
    };
    const res = await sbSendMessage(payload);
    const msg = Array.isArray(res) ? res[0] : res;
    if (msg) chatMessages.push(msg);
    ta.value = "";
    ta.style.height = "38px";
    cancelReply();
    renderMessages();
  } catch(e) { showToast("Erreur : "+e.message,"error"); }

  btn.disabled = false;
  btn.style.transform = "";
}

// ── Saisie dynamique ──────────────────────────────────────────────────────────
function chatOnInput(el) {
  autoResize(el);
  // Autocomplete mention @
  const val = el.value;
  const lastAt = val.lastIndexOf("@");
  if (lastAt >= 0) {
    const query = val.slice(lastAt+1).toLowerCase();
    const membres = [...new Set(chatMessages.map(m=>m.auteur))].filter(m=>m!==chatAuteur);
    const matches = membres.filter(m=>m.toLowerCase().startsWith(query));
    showMentionSuggestions(matches, lastAt, el);
  } else {
    closeMentionSuggestions();
  }
}

let mentionStart = -1;
function showMentionSuggestions(matches, atPos, ta) {
  let el = document.getElementById("mentionSuggestions");
  if (!matches.length) { if (el) el.style.display="none"; return; }
  if (!el) {
    el = document.createElement("div");
    el.id = "mentionSuggestions";
    el.style.cssText = "position:absolute;background:#fff;border:1.5px solid #e2ece7;border-radius:10px;box-shadow:0 4px 16px rgba(0,0,0,.1);z-index:999;max-height:120px;overflow-y:auto;";
    document.getElementById("chatWrap")?.appendChild(el);
  }
  mentionStart = atPos;
  el.innerHTML = matches.map(m=>'<div onclick="completeMention(\''+m+'\')" style="padding:8px 14px;cursor:pointer;font-size:13px;font-weight:600;color:#0f1f16;" onmouseover="this.style.background=\'#f0fdf4\'" onmouseout="this.style.background=\'\'">@'+m+'</div>').join("");
  el.style.display = "block";
}
function closeMentionSuggestions() {
  const el = document.getElementById("mentionSuggestions");
  if (el) el.style.display="none";
}
function completeMention(nom) {
  const ta = document.getElementById("chatTexte");
  if (!ta || mentionStart < 0) return;
  const before = ta.value.slice(0, mentionStart);
  const after = ta.value.slice(ta.selectionStart);
  ta.value = before+"@"+nom+" "+after;
  ta.focus();
  closeMentionSuggestions();
}

// ─── EXPORT CSV ──────────────────────────────────────────────────────────────
function downloadCSV(filename, rows, headers){
  const escape = v => {
    if(v===null||v===undefined) return "";
    const s = String(v);
    return s.includes(",") || s.includes('"') || s.includes("\n") ? `"${s.replace(/"/g,'""')}"` : s;
  };
  const lines = [headers.map(escape).join(","), ...rows.map(r=>r.map(escape).join(","))];
  const blob = new Blob(["﻿"+lines.join("\n")], {type:"text/csv;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
  URL.revokeObjectURL(a.href);
}

  if(filterAchats!=="tous") liste=liste.filter(a=>a.statut===filterAchats);

  const headers=["Date","Produit","Fournisseur","Lieu","Quantité","Unité","Prix unitaire","Total","Avance payée","Solde dû","Mode paiement","Statut","Droit terre","Transport","Droit vente","Charrette","Notes"];
  const rows=liste.map(a=>[
    a.date, a.produit, a.fournisseur, a.lieu||"",
    a.quantite, a.unite, a.prix_unitaire,
    a.quantite*a.prix_unitaire,
    a.avance_paye||0,
    (a.quantite*a.prix_unitaire)-(a.avance_paye||0),
    a.mode_paiement||"", a.statut||"",
    a.droit_terre||0, a.transport||0, a.droit_vente||0, a.charrette||0,
    a.notes||""
  ]);
  const date = filtreAchatDate || new Date().toISOString().slice(0,7);
  downloadCSV(`VerdApp_Achats_${date}.csv`, rows, headers);
  showToast(`✓ ${liste.length} achats exportés`);
}

function exportVentesCSV(){
  let liste = ventes;
  if(filtreVenteDate)    liste=liste.filter(v=>v.date?.slice(0,7)===filtreVenteDate);
  if(filtreVenteProduit) liste=liste.filter(v=>v.produit===filtreVenteProduit);
  if(filtreVenteClient)  liste=liste.filter(v=>(v.client||"").toLowerCase().includes(filtreVenteClient.toLowerCase()));

  const headers=["Date","Produit","Client","Quantité","Unité","Prix vente","Total","Mode paiement","Coût FIFO","Marge FIFO","Taux FIFO%","Notes"];
  const rows=liste.map(v=>{
    const {marge: mFIFO, taux: tFIFO, cout: cFIFO} = margeVenteFIFO(v, ventes.filter(x=>x.produit===v.produit&&new Date(x.date)<new Date(v.date)));
    return [v.date, v.produit, v.client||"", v.quantite, v.unite||"", v.prix_vente,
      v.quantite*v.prix_vente, v.mode_paiement||"", Math.round(cFIFO), Math.round(mFIFO), tFIFO+"%", v.notes||""];
  });
  const date = filtreVenteDate || new Date().toISOString().slice(0,7);
  downloadCSV(`VerdApp_Ventes_${date}.csv`, rows, headers);
  showToast(`✓ ${liste.length} ventes exportées`);
}

function exportDashboardCSV(){
  // Export complet : achats + ventes du mois en cours
  const mois = new Date().toISOString().slice(0,7);
  const aM = achats.filter(a=>a.date?.slice(0,7)===mois);
  const vM = ventes.filter(v=>v.date?.slice(0,7)===mois);
  const totalA = aM.reduce((s,a)=>s+a.quantite*a.prix_unitaire,0);
  const totalV = vM.reduce((s,v)=>s+v.quantite*v.prix_vente,0);
  const rows=[
    ["Période", mois], [""],
    ["=== ACHATS ==="],
    ["Nombre d'achats", aM.length],
    ["Total achats", totalA],
    [""],
    ["=== VENTES ==="],
    ["Nombre de ventes", vM.length],
    ["Total ventes", totalV],
    [""],
    ["=== RÉSULTAT ==="],
    ["Marge brute", totalV-totalA],
    ["Taux de marge", totalA>0?Math.round(((totalV-totalA)/totalA)*100)+"%" : "N/A"],
  ];
  downloadCSV(`VerdApp_Bilan_${mois}.csv`, rows, ["Indicateur","Valeur"]);
  showToast("✓ Bilan exporté");
}

  let contenu = "";

  // ── PAR JOUR ──
  if(bilanOnglet==="jour") {
    const parJour={};

    achats.forEach(a=>{
      const j=(a.date_reception||a.date||"").slice(0,10);

          const isToday=j===new Date().toISOString().slice(0,10);
          const dateAff=new Date(j).toLocaleDateString("fr-CI",{weekday:"short",day:"numeric",month:"short"});
          const tauxJ = tv ? Math.round(margeJ/tv*100) : 0;
          const tauxNJ = tv ? Math.round(margeNJ/tv*100) : 0;
          return '<div style="background:#fff;border:1.5px solid '+(isToday?'#0d3d1a':'#e4ede7')+';border-radius:12px;padding:11px 13px;">'
            +'<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">'
              +'<div><div style="font-weight:700;font-size:12px;color:#0f1f16;">'+dateAff+(isToday?' <span style="font-size:9px;background:#0d3d1a;color:#fff;padding:1px 7px;border-radius:999px;">Auj.</span>':'')+'</div>'

            +'<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:4px;">'

              +'<div class="marge-cell" data-j="'+j+'" style="background:'+(margeJ>=0?'#f0fdf4':'#fef2f2')+';border-radius:7px;padding:5px;text-align:center;cursor:pointer;border:1.5px solid #93c5fd;">'

                    +'<div style="font-size:13px;font-weight:900;color:#c2410c;">−'+l.qtePerte+' u.</div>'
                    +'<div style="font-size:10px;color:#6b8c7a;">−'+fmt(l.valPerte)+'</div>'
                  +'</div>'
                +'</div>'
              +'</div>';
            }).join("")
            +'</div>'
          : '<div style="text-align:center;padding:16px;color:#6b8c7a;font-size:12px;background:#f8faf8;border-radius:10px;">Aucun déficit détecté sur les lots.</div>');

function exportBilanCSV(){
  const parJour={};
  achats.forEach(a=>{
    const j=(a.date_reception||a.date||"").slice(0,10);
    if(j){if(!parJour[j])parJour[j]={a:[],v:[]};parJour[j].a.push(a);}
  });
  ventes.forEach(v=>{const j=(v.date||"").slice(0,10);if(j){if(!parJour[j])parJour[j]={a:[],v:[]};parJour[j].v.push(v);}});
  const parMois={};
  achats.forEach(a=>{const m=(a.date||"").slice(0,7);if(m){if(!parMois[m])parMois[m]={a:[],v:[]};parMois[m].a.push(a);}});
  ventes.forEach(v=>{const m=(v.date||"").slice(0,7);if(m){if(!parMois[m])parMois[m]={a:[],v:[]};parMois[m].v.push(v);}});

  const rows=[
    ["=== BILAN PAR JOUR ==="],
    ["Date","Total achats","Total ventes","Solde","Marge brute","Marge nette","Frais terrain","Nb achats","Nb ventes"],
    ...Object.keys(parJour).sort().reverse().map(j=>{
      const d=parJour[j];
      const ta=d.a.reduce((s,a)=>s+a.quantite*a.prix_unitaire,0);
      const tv=d.v.reduce((s,v)=>s+v.quantite*v.prix_vente,0);
      const mb=margebrute(d.v);
      const mn=margenette(d.v);
      const fr=mb-mn;
      return [j,fmt(ta),fmt(tv),fmt(tv-ta),fmt(mb),fmt(mn),fmt(fr),d.a.length,d.v.length];
    }),
    [""],
    ["=== BILAN PAR MOIS ==="],
    ["Mois","Total achats","Total ventes","Solde","Marge brute","Marge nette","Frais terrain"],
    ...Object.keys(parMois).sort().reverse().map(m=>{
      const d=parMois[m];
      const ta=d.a.reduce((s,a)=>s+a.quantite*a.prix_unitaire,0);
      const tv=d.v.reduce((s,v)=>s+v.quantite*v.prix_vente,0);
      const mb=margebrute(d.v);
      const mn=margenette(d.v);
      const fr=mb-mn;
      return [m,fmt(ta),fmt(tv),fmt(tv-ta),fmt(mb),fmt(mn),fmt(fr)];
    }),
    [""],
    ["=== PERTES ==="],
    ["Produit","Quantité perdue","Valeur estimée"],
    ...Object.entries(pertes).filter(([,v])=>v>0).map(([p,q])=>{
      const c=coutMoyen(p);
      return [p,q,c?fmt(q*c):"N/A"];
    }),
  ];
  downloadCSV("VerdApp_BilanFinancier_"+new Date().toISOString().slice(0,10)+".csv", rows, []);
  showToast("✓ Bilan exporté");
}

function partagerBilanWA(j,totalA,totalV,margeB,nbA,nbV){
  const taux=totalA>0?Math.round((margeB/totalA)*100):0;
  const waLink=localStorage.getItem("va_wa_link")||"";
  const msg=`📊 *Bilan VerdApp CI — ${j}*\n`

// MODULE ANALYSE DE MARGE — Jour / Mois / Année + Par date
// ════════════════════════════════════════════════════════════════════════════

// ── Helpers calcul marge ─────────────────────────────────────────────────────
function couleurMarge(t){ return t>=20?"#166534":t>=10?"#c2410c":"#dc2626"; }
function bgMarge(t)     { return t>=20?"#f0fdf4":t>=10?"#fff7ed":"#fef2f2"; }
function borderMarge(t) { return t>=20?"#bbf7d0":t>=10?"#fed7aa":"#fecaca"; }

// calculerMarge — utilise le moteur FIFO (même résultat que le tableau de bord)
function calculerMarge(ventesF, achatsF) {
  return calculerMargeFIFO(ventesF, achatsF||[]);
}

// Jauge demi-cercle SVG
function jaugeMarge(t){
  const pct=Math.min(Math.max(t,0),100);
  const a=pct/100*180, r=a*Math.PI/180;
  const gx=70+54*Math.cos(Math.PI-r), gy=70-54*Math.sin(Math.PI-r);
  const col=t>=20?"#22a356":t>=10?"#f47820":"#dc2626";
  return '<svg viewBox="0 0 140 80" style="width:100px;height:52px;">'
    +'<path d="M15,70 A55,55 0 0,1 125,70" fill="none" stroke="#e2ece7" stroke-width="10" stroke-linecap="round"/>'
    +'<path d="M15,70 A55,55 0 0,1 '+gx.toFixed(1)+','+gy.toFixed(1)+'" fill="none" stroke="'+col+'" stroke-width="10" stroke-linecap="round"/>'
    +'<text x="70" y="62" text-anchor="middle" font-size="16" font-weight="900" fill="'+col+'">'+t+'%</text>'
    +'</svg>';
}

// Barre de progression
function barreMarge(t){
  const col=t>=20?"#22a356":t>=10?"#f47820":"#dc2626";
  const pct=Math.min(Math.max(t,0),100);
  return '<div style="height:6px;background:#e2ece7;border-radius:999px;overflow:hidden;margin-top:5px;">'
    +'<div style="height:100%;background:'+col+';border-radius:999px;width:'+pct+'%;"></div></div>';
}

// Ligne de décomposition
function ligneDecomp(lbl,val,col,sign,bold){
  const s=bold?"font-weight:700;color:#0f1f16;":"";
  const bs=bold?"border-top:2px solid #e2ece7;margin-top:4px;padding-top:10px;":"";
  return '<div style="display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid #e2ece7;'+bs+'">'
    +'<span style="font-size:12px;color:#3d5c48;'+s+'">'+lbl+'</span>'
    +'<span style="font-size:13px;font-weight:'+(bold?'900':'700')+';color:'+col+';">'+(sign||'')+fmt(Math.abs(val))+'</span>'
    +'</div>';
}

// ── FONCTION PRINCIPALE ───────────────────────────────────────────────────────
let margeOnglet = "jour"; // "jour" | "mois" | "annee"

function detailMarge(onglet) {
  if(onglet) margeOnglet = onglet;

  // ── Onglets ──
  const onglets = ['jour','mois','annee'];
  const ongletLabels = {jour:'Par jour',mois:'Par mois',annee:'Par année'};
  const ongletsHtml = '<div style="display:flex;gap:6px;margin-bottom:18px;background:#f0f5f1;border-radius:12px;padding:4px;">'
    + onglets.map(o =>
        '<button onclick="detailMarge(\''+o+'\')" style="flex:1;padding:8px 4px;border:none;border-radius:9px;cursor:pointer;font-family:inherit;font-size:12px;font-weight:700;transition:all .2s;'
        +(margeOnglet===o?'background:#0d3d1a;color:#fff;box-shadow:0 2px 8px rgba(13,61,26,.3);':'background:none;color:#3d5c48;')
        +'">'+ongletLabels[o]+'</button>'
      ).join('')
    + '</div>';

  // ── KPI global (commun à tous les onglets) ──
  const global = calculerMarge(ventes, achats.filter(a=>a.statut==="recu")); // calculerMarge maintenu pour les vues filtrées
  const kpiHtml =
    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px;">'
    +'<div style="background:'+bgMarge(global.tauxB)+';border:1.5px solid '+borderMarge(global.tauxB)+';border-radius:14px;padding:12px;text-align:center;">'
      +jaugeMarge(global.tauxB)
      +'<div style="font-size:11px;font-weight:700;color:#0f1f16;margin-top:2px;">Marge brute globale</div>'
      +'<div style="font-size:14px;font-weight:900;color:'+couleurMarge(global.tauxB)+';margin-top:2px;">'+fmt(global.margeB)+'</div>'
      +'<div style="font-size:9px;color:#6b8c7a;">CA : '+fmt(global.ca)+'</div>'
    +'</div>'
    +'<div style="background:'+bgMarge(global.tauxN)+';border:1.5px solid '+borderMarge(global.tauxN)+';border-radius:14px;padding:12px;text-align:center;">'
      +jaugeMarge(global.tauxN)
      +'<div style="font-size:11px;font-weight:700;color:#0f1f16;margin-top:2px;">Marge nette globale</div>'
      +'<div style="font-size:14px;font-weight:900;color:'+couleurMarge(global.tauxN)+';margin-top:2px;">'+fmt(global.margeN)+'</div>'
      +'<div style="font-size:9px;color:#6b8c7a;">Frais : −'+fmt(global.frais)+'</div>'
    +'</div>'
    +'</div>';

  // ── Décomposition globale ──
  const decomp =
    '<div style="background:#f8faf8;border-radius:14px;padding:14px;margin-bottom:18px;">'
    +'<div style="font-size:11px;font-weight:700;color:#0f1f16;text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px;">Décomposition</div>'
    +ligneDecomp("Chiffre d'affaires (CA)",global.ca,"#0369a1","",false)
    +ligneDecomp("Coût d'achat marchandise (FIFO)",global.coutAch,"#dc2626","−",false)
    +ligneDecomp("Marge brute  ("+global.tauxB+"%)",global.margeB,couleurMarge(global.tauxB),global.margeB>=0?"+":"",false)
    +ligneDecomp("Frais terrain (transport, droits…)",global.frais,"#c2410c","−",false)
    +ligneDecomp("Marge nette  ("+global.tauxN+"%)",global.margeN,couleurMarge(global.tauxN),global.margeN>=0?"+":"",true)
    +'</div>';

  // ── Contenu selon onglet ──
  let contenu = "";

  if(margeOnglet === "jour") {
    // Grouper par date de la vente (YYYY-MM-DD)
    const parJour = {};
    ventes.forEach(v => {
      const j = (v.date||"").slice(0,10);
      if(!j) return;
      if(!parJour[j]) parJour[j] = {ventes:[], achats:[]};
      parJour[j].ventes.push(v);
    });

function exportMargeCSV(){
  const global = calculerMarge(ventes, achats.filter(a=>a.statut==="recu")); // calculerMarge maintenu pour les vues filtrées

  // Par jour
  const parJour = {};
  ventes.forEach(v=>{ const j=(v.date||"").slice(0,10); if(j){ if(!parJour[j])parJour[j]={v:[],a:[]}; parJour[j].v.push(v); }});
  achats.filter(a=>a.statut==="recu").forEach(a=>{ const j=(a.date_reception||a.date||"").slice(0,10); if(j){ if(!parJour[j])parJour[j]={v:[],a:[]}; parJour[j].a.push(a); }});

  // Par mois
  const parMois = {};
  ventes.forEach(v=>{ const m=(v.date||"").slice(0,7); if(m){ if(!parMois[m])parMois[m]={v:[],a:[]}; parMois[m].v.push(v); }});
  achats.filter(a=>a.statut==="recu").forEach(a=>{ const m=(a.date_reception||a.date||"").slice(0,7); if(m){ if(!parMois[m])parMois[m]={v:[],a:[]}; parMois[m].a.push(a); }});

  const rows = [
    ["=== RÉSUMÉ GLOBAL ==="],
    ["CA total", fmt(global.ca)],
    ["Marge brute", fmt(global.margeB), global.tauxB+"%"],
    ["Frais terrain", fmt(global.frais)],
    ["Marge nette", fmt(global.margeN), global.tauxN+"%"],
    [""],
    ["=== PAR JOUR ==="],
    ["Date","CA","Marge brute","Taux brut%","Marge nette","Taux net%","Nb ventes","Nb achats"],
    ...Object.keys(parJour).sort().reverse().map(j=>{
      const m=calculerMarge(parJour[j].v,parJour[j].a);
      return [j,fmt(m.ca),fmt(m.margeB),m.tauxB+"%",fmt(m.margeN),m.tauxN+"%",parJour[j].v.length,parJour[j].a.length];
    }),
    [""],
    ["=== PAR MOIS ==="],
    ["Mois","CA","Marge brute","Taux brut%","Marge nette","Taux net%"],
    ...Object.keys(parMois).sort().reverse().map(k=>{
      const m=calculerMarge(parMois[k].v,parMois[k].a);
      return [k,fmt(m.ca),fmt(m.margeB),m.tauxB+"%",fmt(m.margeN),m.tauxN+"%"];
    }),
  ];

  const d = new Date().toISOString().slice(0,10);
  downloadCSV("VerdApp_AnalyseMarge_"+d+".csv", rows, []);
  showToast("✓ Analyse marge exportée");
}

// ─── SÉCURITÉ : Vérification intégrité des données ───────────────────────────
function verifierIntegriteDonnees(){
  const problemes=[];

  // Vérifier les achats
  achats.forEach((a,i)=>{
    if(!a.id) problemes.push(`Achat #${i}: ID manquant`);
    if(!a.produit) problemes.push(`Achat #${i}: Produit manquant`);
    if(!a.quantite||a.quantite<=0) problemes.push(`Achat ${a.produit||"#"+i}: Quantité invalide`);
    if(!a.prix_unitaire||a.prix_unitaire<=0) problemes.push(`Achat ${a.produit||"#"+i}: Prix invalide`);
  });

  // Vérifier les ventes
  ventes.forEach((v,i)=>{
    if(!v.id) problemes.push(`Vente #${i}: ID manquant`);
    if(!v.produit) problemes.push(`Vente #${i}: Produit manquant`);
    if(!v.quantite||v.quantite<=0) problemes.push(`Vente ${v.produit||"#"+i}: Quantité invalide`);
    if(!v.prix_vente||v.prix_vente<=0) problemes.push(`Vente ${v.produit||"#"+i}: Prix invalide`);
  });

  // Détecter stocks négatifs
  const prodsStock=[...new Set(achats.filter(a=>a.statut==="recu").map(a=>a.produit))];
  prodsStock.forEach(p=>{
    const r=achats.filter(a=>a.produit===p&&a.statut==="recu").reduce((s,a)=>s+a.quantite,0);
    const v=ventes.filter(vv=>vv.produit===p).reduce((s,vv)=>s+vv.quantite,0);
    const pt=pertes[p]||0;
    const dispo=r-v-pt;
    if(dispo<0) problemes.push(`Stock négatif : ${p} (${dispo})`);
  });

  showModal(`
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
      <div>
        <div style="font-size:17px;font-weight:800;color:#0f1f16;">🔍 Vérification des données</div>
        <div style="font-size:11px;color:#3d5c48;margin-top:2px;">${achats.length} achats · ${ventes.length} ventes analysés</div>
      </div>
      <button onclick="closeModal()" style="background:#f1f5f2;border:none;border-radius:999px;width:32px;height:32px;cursor:pointer;font-size:16px;color:#3d5c48;">✕</button>
    </div>
    ${problemes.length===0
      ? `<div style="background:#f0fdf4;border:1.5px solid #bbf7d0;border-radius:14px;padding:24px;text-align:center;">
          <div style="font-size:32px;margin-bottom:8px;">✅</div>
          <div style="font-weight:700;color:#166534;font-size:15px;">Données intègres</div>
          <div style="font-size:13px;color:#3d5c48;margin-top:4px;">Aucun problème détecté sur ${achats.length+ventes.length} enregistrements.</div>
         </div>`
      : `<div style="background:#fef2f2;border:1.5px solid #fecaca;border-radius:12px;padding:12px;margin-bottom:12px;">
          <div style="font-size:12px;font-weight:700;color:#dc2626;margin-bottom:8px;">⚠ ${problemes.length} problème${problemes.length>1?"s":""} détecté${problemes.length>1?"s":""}</div>
          ${problemes.map(p=>`<div style="font-size:12px;color:#dc2626;padding:4px 0;border-bottom:1px solid #fecaca;">${p}</div>`).join("")}
        </div>`
    }
  `);
}
