              +'<div class="marge-cell" data-j="'+j+'" style="background:'+(margeJ>=0?'#f0fdf4':'#fef2f2')+';border-radius:7px;padding:5px;text-align:center;cursor:pointer;border:1.5px solid #93c5fd;">'
                +'<div style="font-size:10px;font-weight:700;color:'+(margeJ>=0?'#166534':'#dc2626')+';">'+(margeJ>=0?'+':'')+fmt(margeJ)+'</div>'
                +'<div style="font-size:8px;color:#0369a1;font-weight:700;">'+tauxJ+'% brute 🔍</div>'
              +'</div>'
              +'<div class="marge-cell" data-j="'+j+'" style="background:'+(margeNJ>=0?'#f0fdf4':'#fef2f2')+';border-radius:7px;padding:5px;text-align:center;cursor:pointer;border:1.5px solid #93c5fd;">'
                +'<div style="font-size:10px;font-weight:700;color:'+(margeNJ>=0?'#166534':'#dc2626')+';">'+(margeNJ>=0?'+':'')+fmt(margeNJ)+'</div>'
                +'<div style="font-size:8px;color:#0369a1;font-weight:700;">'+tauxNJ+'% nette 🔍</div>'
              +'</div>'
            +'</div>'
          +'</div>';
        }).join("")
        +'</div>';
    }
  }

  // ── PAR ANNÉE ──
  else if(bilanOnglet==="annee") {
    const parAn={};
    achats.forEach(a=>{const an=(a.date||"").slice(0,4);if(an){if(!parAn[an])parAn[an]={a:[],v:[]};parAn[an].a.push(a);}});
    ventes.forEach(v=>{const an=(v.date||"").slice(0,4);if(an){if(!parAn[an])parAn[an]={a:[],v:[]};parAn[an].v.push(v);}});
    const anList=Object.keys(parAn).sort().reverse();
    if(!anList.length){contenu='<div style="text-align:center;padding:30px;color:#6b8c7a;font-size:12px;">Aucune donnée.</div>';}
    else {
      contenu='<div style="font-size:11px;font-weight:700;color:#0f1f16;text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px;">Bilan annuel</div>'
        +'<div style="display:flex;flex-direction:column;gap:10px;">'
        +anList.map(an=>{
          const d=parAn[an];
          const ta=d.a.reduce((s,a)=>s+a.quantite*a.prix_unitaire,0);
          const tv=d.v.reduce((s,v)=>s+v.quantite*v.prix_vente,0);
          const margeAn  = margebrute(d.v);
          const margeNAn = margenette(d.v);
          const fraisAn  = margeAn - margeNAn;
          const soldeAn=tv-ta;
          const avAn=d.a.reduce((s,a)=>s+(a.avance_paye||0),0);
          const isCurrent=an===new Date().getFullYear().toString();
          return '<div style="background:#fff;border:1.5px solid '+(isCurrent?'#0d3d1a':'#e4ede7')+';border-radius:16px;padding:16px;">'
            +'<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">'
              +'<div><div style="font-size:22px;font-weight:900;color:#0f1f16;">'+an+(isCurrent?' <span style="font-size:10px;background:#0d3d1a;color:#fff;padding:2px 8px;border-radius:999px;">En cours</span>':'')+'</div>'
                +'<div style="font-size:11px;color:#6b8c7a;">'+d.a.length+' achats · '+d.v.length+' ventes</div>'
              +'</div>'
              +'<div style="text-align:right;"><div style="font-size:18px;font-weight:900;color:'+(soldeAn>=0?'#166534':'#dc2626')+';">'+(soldeAn>=0?'+':'')+fmt(soldeAn)+'</div><div style="font-size:10px;color:#6b8c7a;">Solde annuel</div></div>'
            +'</div>'
            +'<div style="display:grid;grid-template-columns:repeat(2,1fr);gap:8px;">'
              +'<div style="background:#eff6ff;border-radius:10px;padding:10px;text-align:center;"><div style="font-size:14px;font-weight:900;color:#1d4ed8;">'+fmt(ta)+'</div><div style="font-size:10px;color:#6b8c7a;">Total achats</div><div style="font-size:10px;color:#6b8c7a;">Avances : '+fmt(avAn)+'</div></div>'
              +'<div style="background:#f0fdf4;border-radius:10px;padding:10px;text-align:center;"><div style="font-size:14px;font-weight:900;color:#166534;">'+fmt(tv)+'</div><div style="font-size:10px;color:#6b8c7a;">Total ventes</div><div style="font-size:10px;color:#6b8c7a;">Frais : '+fmt(fraisAn)+'</div></div>'
              +'<div style="background:'+(margeAn>=0?'#f0fdf4':'#fef2f2')+';border-radius:10px;padding:10px;text-align:center;"><div style="font-size:14px;font-weight:900;color:'+(margeAn>=0?'#166534':'#dc2626')+';">'+(margeAn>=0?'+':'')+fmt(margeAn)+'</div><div style="font-size:10px;color:#6b8c7a;">Marge brute</div></div>'
              +'<div style="background:'+(margeNAn>=0?'#f0fdf4':'#fef2f2')+';border-radius:10px;padding:10px;text-align:center;"><div style="font-size:14px;font-weight:900;color:'+(margeNAn>=0?'#166534':'#dc2626')+';">'+(margeNAn>=0?'+':'')+fmt(margeNAn)+'</div><div style="font-size:10px;color:#6b8c7a;">Marge nette</div></div>'
            +'</div>'
          +'</div>';
        }).join("")
        +'</div>';
    }
  }

  // ── PERTES (admin seulement) ──
  // ── COMPTE DE RÉSULTAT (SIG — Soldes Intermédiaires de Gestion) ──
  else if(bilanOnglet==="sig") {
    const ca          = totalV;
    const coutMarchandiseVendu = ca - margeB;     // CA − marge brute = coût d'achat des marchandises vendues (FIFO)
    const margeBrute  = margeB;                   // CA − CMV
    const fraisAcc    = frais;                    // frais accessoires (transport, droit de terre, charrette)
    const margeNetteCommerciale = margeN;         // CA − (CMV + frais)
    const totalPertesV = totalPertesValeur();
    const totalCommiss = totalCommissionsDues();
    const resultatExploitation = margeNetteCommerciale - totalPertesV - totalCommiss;

    const tauxB  = ca ? Math.round(margeBrute/ca*100) : 0;
    const tauxN  = ca ? Math.round(margeNetteCommerciale/ca*100) : 0;
    const tauxRE = ca ? Math.round(resultatExploitation/ca*100) : 0;

    // ── Ratios financiers ──
    // Stock valorisé = coût FIFO réel du stock restant (cohérent avec calculerFIFO,
    // PAS l'hybride qteDispo × coûtMoyen qui mélangeait FIFO et CMP).
    const produitsRecus = [...new Set(achats.filter(a=>a.statut==="recu").map(a=>a.produit))];
    const stockValorise = produitsRecus.reduce((tot,p)=>tot + (calculerFIFO(p).coutFIFO||0), 0);

    // Stock initial valorisé (= coût total des achats reçus) pour la rotation sur stock moyen.
    const coutAchatsRecus = achats
      .filter(a=>a.statut==="recu")
      .reduce((s,a)=>s+a.quantite*a.prix_unitaire+((a.droit_terre||0)+(a.transport||0)+(a.droit_vente||0)+(a.charrette||0)),0);
    // Stock moyen = (stock entré + stock restant) / 2 — base correcte du ratio de rotation.
    const stockMoyen = (coutAchatsRecus + stockValorise) / 2;
    const rotationStock = stockMoyen>0 ? (coutMarchandiseVendu/stockMoyen) : 0;

    // Détection d'incohérence : stock théorique négatif (ventes+pertes > achats reçus)
    const stockNegatifs = produitsRecus.map(p=>{
      const qteAchat = achats.filter(a=>a.produit===p&&a.statut==="recu").reduce((s,a)=>s+a.quantite,0);
      const qteVente = ventes.filter(v=>v.produit===p).reduce((s,v)=>s+v.quantite,0);
      const qtePerte = pertes[p]||0;
      const ecart = qteAchat - qteVente - qtePerte;
      return {produit:p, qteAchat, qteVente, qtePerte, ecart};
    }).filter(x=>x.ecart<0);
    const tauxPerte = (coutMarchandiseVendu+totalPertesV)>0 ? Math.round(totalPertesV/(coutMarchandiseVendu+totalPertesV)*1000)/10 : 0;

    function ligneSIG(label, montant, opts){
      opts=opts||{};
      const isTotal = opts.total;
      const isNeg = opts.neg;
      const color = montant<0?'#dc2626':(isTotal?(montant>=0?'#166534':'#dc2626'):'#0f1f16');
      return '<div style="display:flex;justify-content:space-between;align-items:center;padding:'+(isTotal?'10px 12px':'7px 12px')+';'
        +(isTotal?'background:#f0fdf4;border:1.5px solid #bbf7d0;border-radius:10px;margin:6px 0;':'border-bottom:1px solid #f1f5f2;')+'">'
        +'<span style="font-size:'+(isTotal?'12px':'11px')+';font-weight:'+(isTotal?'800':'600')+';color:'+(isTotal?'#0f1f16':'#3d5c48')+';">'+label+'</span>'
        +'<span style="font-size:'+(isTotal?'14px':'12px')+';font-weight:900;color:'+color+';">'+(isNeg?'− ':(isTotal&&montant>=0?'':''))+fmt(Math.abs(montant))+(opts.taux!==undefined?' <span style="font-size:10px;font-weight:700;color:#6b8c7a;">('+opts.taux+'%)</span>':'')+'</span>'
      +'</div>';
    }

    contenu =
      '<div style="font-size:11px;font-weight:700;color:#0f1f16;text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px;">📊 Compte de résultat (Soldes Intermédiaires de Gestion)</div>'
      +(stockNegatifs.length
        ? '<div style="background:#fef2f2;border:1.5px solid #fecaca;border-radius:12px;padding:12px;margin-bottom:14px;">'
          +'<div style="font-size:12px;font-weight:800;color:#dc2626;margin-bottom:6px;">⚠ Incohérence de stock détectée</div>'
          +'<div style="font-size:11px;color:#3d5c48;margin-bottom:8px;">Pour ces produits, les ventes + pertes dépassent les achats reçus. Les chiffres (rotation, stock valorisé, CMV) sont faussés tant que ce n\'est pas corrigé. Vérifie : des achats reçus non saisis, ou des pertes comptées en double avec des ventes.</div>'
          +stockNegatifs.map(x=>
            '<div style="display:flex;justify-content:space-between;align-items:center;font-size:11px;padding:5px 0;border-top:1px solid #fecaca;">'
            +'<span style="font-weight:700;color:#0f1f16;">'+(getProduitIcon(x.produit)||"🌿")+' '+x.produit+'</span>'
            +'<span style="color:#3d5c48;">Achats '+x.qteAchat+' u. − Ventes '+x.qteVente+' u. − Pertes '+x.qtePerte+' u. = <span style="font-weight:900;color:#dc2626;">'+x.ecart+' u.</span></span>'
            +'</div>'
          ).join('')
          +'<button onclick="ouvrirReconciliation(\''+stockNegatifs[0].produit+'\')" style="margin-top:10px;width:100%;background:#dc2626;color:#fff;border:none;border-radius:10px;padding:9px;font-weight:700;font-size:12px;cursor:pointer;font-family:inherit;">🔍 Ouvrir l\'outil de réconciliation</button>'
        +'</div>'
        : '')
      +'<div style="background:#fff;border:1.5px solid #e4ede7;border-radius:12px;padding:6px 4px;margin-bottom:16px;">'
        +ligneSIG("Chiffre d'affaires (CA)", ca)
        +ligneSIG("− Coût d'achat des marchandises vendues (CMV, FIFO)", coutMarchandiseVendu, {neg:true})
        +ligneSIG("= MARGE BRUTE", margeBrute, {total:true, taux:tauxB})
        +ligneSIG("− Frais accessoires d'achat (transport, droit de terre, charrette)", fraisAcc, {neg:true})
        +ligneSIG("= MARGE NETTE COMMERCIALE", margeNetteCommerciale, {total:true, taux:tauxN})
        +ligneSIG("− Commissions versées au personnel terrain", totalCommiss, {neg:true})
        +ligneSIG("− Pertes sur stocks", totalPertesV, {neg:true})
        +ligneSIG("= RÉSULTAT D'EXPLOITATION", resultatExploitation, {total:true, taux:tauxRE})
      +'</div>'
      +'<div style="font-size:10px;color:#6b8c7a;margin-bottom:16px;">Le résultat d\'exploitation ne tient pas compte des charges fiscales (patente, impôts) ni des charges fixes générales (loyer, personnel administratif, amortissements), à intégrer par le comptable en charge de la comptabilité légale.</div>'

      +'<div style="font-size:11px;font-weight:700;color:#0f1f16;text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px;">📐 Ratios financiers</div>'
      +'<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">'
        +ratioCard("Taux de marge brute", tauxB+"%", tauxB>=20, "Seuil sain : > 20%", interpreterRatio(tauxB, GRILLE_MARGE_BRUTE))
        +ratioCard("Taux de marge nette", tauxN+"%", tauxN>=15, "Seuil sain : > 15%", interpreterRatio(tauxN, GRILLE_MARGE_NETTE))
        +ratioCard("Rotation des stocks", rotationStock.toFixed(1)+"x", rotationStock>=1, "CMV / Stock moyen (période)", interpreterRatio(rotationStock, GRILLE_ROTATION))
        +ratioCard("Taux de perte", tauxPerte+"%", tauxPerte<3, "Pertes / (CMV+Pertes) — seuil sain : < 3%", interpreterRatio(tauxPerte, GRILLE_PERTE, true))
        +ratioCard("Stock valorisé (FIFO)", fmt(stockValorise), true, "Coût d'achat du stock disponible")
        +ratioCard("Dû fournisseurs", fmt(totalDus), totalDus<=stockValorise, "À régler sur le stock en cours")
      +'</div>';

    // ── Diagnostic financier automatique (points forts / faibles / reco) ──
    const forts = [], faibles = [], recos = [];
    if(tauxB>=20) forts.push("Marge brute solide ("+tauxB+"%)"); else faibles.push("Marge brute faible ("+tauxB+"%)");
    if(tauxN>=15) forts.push("Marge nette saine ("+tauxN+"%)"); else { faibles.push("Marge nette sous le seuil ("+tauxN+"%)"); recos.push("Réduire les charges variables (frais terrain, commissions) ou augmenter les prix de vente."); }
    if(rotationStock>=6) forts.push("Bonne rotation des stocks ("+rotationStock.toFixed(1)+"x)"); else if(rotationStock<3 && rotationStock>0){ faibles.push("Rotation des stocks lente ("+rotationStock.toFixed(1)+"x)"); recos.push("Écouler le stock plus vite pour limiter l'immobilisation de trésorerie et les pertes."); }
    if(tauxPerte<3) forts.push("Pertes maîtrisées ("+tauxPerte+"%)"); else { faibles.push("Taux de perte élevé ("+tauxPerte+"%)"); recos.push("Améliorer la conservation/écoulement des produits périssables pour réduire les pertes."); }
    if(totalDus>stockValorise) { faibles.push("Dettes fournisseurs ("+fmt(totalDus)+") supérieures au stock disponible"); recos.push("Surveiller la capacité à régler les fournisseurs ; négocier des délais."); }
    if(resultatExploitation<0){ faibles.push("Résultat d'exploitation négatif"); recos.push("Action urgente : l'activité ne couvre pas ses charges courantes."); }

    // Score financier 0-100 (moyenne pondérée simple des indicateurs sains)
    let score = 0;
    score += Math.min(30, Math.max(0, tauxB)); // marge brute jusqu'à 30 pts
    score += Math.min(30, Math.max(0, tauxN*2)); // marge nette jusqu'à 30 pts
    score += Math.min(20, rotationStock*2);      // rotation jusqu'à 20 pts
    score += Math.max(0, 20 - tauxPerte*4);      // pertes : 20 pts si 0%, 0 si >=5%
    score = Math.round(Math.min(100, Math.max(0, score)));
    const scoreColor = score>=70?"#15803d":score>=45?"#ca8a04":"#dc2626";
    const scoreLabel = score>=70?"Bonne santé":score>=45?"Vigilance":"Situation à risque";

    const blocListe = (titre, items, couleur) => items.length
      ? '<div style="margin-bottom:8px;"><div style="font-size:10px;font-weight:800;color:'+couleur+';text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px;">'+titre+'</div>'
        +items.map(i=>'<div style="font-size:11px;color:#3d5c48;margin-bottom:2px;">• '+i+'</div>').join('')+'</div>'
      : '';

    contenu += '<div style="font-size:11px;font-weight:700;color:#0f1f16;text-transform:uppercase;letter-spacing:.06em;margin:16px 0 8px;">🩺 Diagnostic financier automatique</div>'
      +'<div style="background:#fff;border:1.5px solid #e4ede7;border-radius:12px;padding:14px;margin-bottom:4px;">'
        +'<div style="display:flex;align-items:center;gap:14px;margin-bottom:12px;">'
          +'<div style="width:64px;height:64px;border-radius:999px;border:5px solid '+scoreColor+';display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0;">'
            +'<div style="font-size:20px;font-weight:900;color:'+scoreColor+';line-height:1;">'+score+'</div><div style="font-size:7px;color:#6b8c7a;">/ 100</div>'
          +'</div>'
          +'<div><div style="font-size:14px;font-weight:800;color:'+scoreColor+';">'+scoreLabel+'</div>'
            +'<div style="font-size:10px;color:#6b8c7a;">Score financier global (marge, rotation, pertes)</div></div>'
        +'</div>'
        +blocListe("Points forts", forts, "#15803d")
        +blocListe("Points faibles", faibles, "#dc2626")
        +blocListe("Recommandations", recos, "#0369a1")
        +(recos.length===0 && faibles.length===0 ? '<div style="font-size:11px;color:#15803d;">Aucune alerte : les indicateurs sont dans les seuils sains.</div>':'')
      +'</div>';

    // ── Seuil de rentabilité (point mort) ──
    // Charges fixes proxy : commissions + pertes constatées sur la période,
    // utilisées comme estimation faute de saisie de charges fixes dédiée
    // (loyer, salaires admin, etc. — à compléter via l'onglet Budget).
    const chargesFixesProxy = totalCommiss + totalPertesV;
    const tauxMargeSurCA = ca ? (margeBrute/ca) : 0;
    const seuilRentabilite = tauxMargeSurCA>0 ? chargesFixesProxy/tauxMargeSurCA : 0;
    const margeSecurite = ca - seuilRentabilite;
    const tauxMargeSecurite = ca ? Math.round(margeSecurite/ca*100) : 0;

    contenu += '<div style="font-size:11px;font-weight:700;color:#0f1f16;text-transform:uppercase;letter-spacing:.06em;margin:16px 0 8px;">🎯 Seuil de rentabilité (point mort)</div>'
      +'<div style="background:#fff;border:1.5px solid #e4ede7;border-radius:12px;padding:12px;">'
        +'<div style="font-size:11px;color:#3d5c48;margin-bottom:8px;">Charges fixes estimées (commissions + pertes) : <b>'+fmt(chargesFixesProxy)+' F</b> · Taux de marge brute / CA : <b>'+Math.round(tauxMargeSurCA*100)+'%</b></div>'
        +'<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">'
          +ratioCard("CA minimum requis", fmt(seuilRentabilite), ca>=seuilRentabilite, "Pour couvrir les charges fixes")
          +ratioCard("Marge de sécurité", (margeSecurite>=0?'+':'')+fmt(margeSecurite), margeSecurite>=0, "CA actuel − Seuil ("+tauxMargeSecurite+"%)")
        +'</div>'
        +'<div style="font-size:10px;color:#6b8c7a;margin-top:8px;">Cette estimation utilise commissions + pertes comme proxy des charges fixes. Pour un calcul précis, saisissez vos charges fixes réelles (loyer, salaires administratifs, etc.) dans l\'onglet Budget.</div>'
      +'</div>';
  }

  // ── BUDGET PRÉVISIONNEL VS RÉALISÉ ──
  else if(bilanOnglet==="budget") {
    const now = new Date();
    const annee = now.getFullYear(), mois = now.getMonth()+1;
    const moisLabel = now.toLocaleDateString("fr-CI",{month:"long",year:"numeric"});

    const budgetCourant = budgetsMensuels.find(b=>b.annee===annee && b.mois===mois);

    // Réalisé du mois courant
    const ventesMois = ventes.filter(v=>(v.date||"").slice(0,7)===now.toISOString().slice(0,7));
    const caRealise = totalVentes(ventesMois);
    const margeBruteRealisee = margebrute(ventesMois);
    const margeNetteRealisee = margenette(ventesMois);
    const totalCommissMois = totalCommissionsDues(); // global (l'app ne filtre pas les commissions par mois)
    const totalPertesMois = totalPertesValeur();
    const resultatNetRealise = margeNetteRealisee - totalCommissMois - totalPertesMois - (budgetCourant?.charges_fixes_mensuelles||0);

    function ligneBudget(label, objectif, realise){
      const ecart = realise - objectif;
      const ecartPct = objectif ? Math.round(ecart/objectif*100) : 0;
      const color = ecart>=0 ? "#166534" : "#dc2626";
      return '<div style="display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:6px;align-items:center;padding:8px 0;border-bottom:1px solid #f1f5f2;font-size:11px;">'
        +'<div style="font-weight:700;color:#0f1f16;">'+label+'</div>'
        +'<div style="text-align:right;color:#6b8c7a;">'+fmt(objectif)+'</div>'
        +'<div style="text-align:right;font-weight:800;color:#0f1f16;">'+fmt(realise)+'</div>'
        +'<div style="text-align:right;font-weight:800;color:'+color+';">'+(ecart>=0?'+':'')+fmt(ecart)+' <span style="font-size:9px;">('+(ecart>=0?'+':'')+ecartPct+'%)</span></div>'
      +'</div>';
    }

    contenu =
      '<div style="font-size:11px;font-weight:700;color:#0f1f16;text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px;">📅 Budget vs Réalisé — '+moisLabel+'</div>'

      +'<div style="display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:6px;padding:6px 0;font-size:10px;font-weight:700;color:#6b8c7a;text-transform:uppercase;letter-spacing:.04em;border-bottom:2px solid #e4ede7;margin-bottom:4px;">'
        +'<div>Indicateur</div><div style="text-align:right;">Budget</div><div style="text-align:right;">Réalisé</div><div style="text-align:right;">Écart</div>'
      +'</div>'
      +ligneBudget("Chiffre d'affaires", budgetCourant?.ca_objectif||0, caRealise)
      +ligneBudget("Marge brute", budgetCourant?.marge_brute_objectif||0, margeBruteRealisee)
      +ligneBudget("Résultat net", budgetCourant?.resultat_net_objectif||0, resultatNetRealise)

      +'<div style="margin-top:14px;">'
        +'<button onclick="modalEditerBudget('+annee+','+mois+')" style="width:100%;background:#0369a1;color:#fff;border:none;border-radius:10px;padding:10px;font-weight:700;font-size:12px;cursor:pointer;font-family:inherit;">✏ '+(budgetCourant?'Modifier':'Définir')+' le budget de '+moisLabel+'</button>'
      +'</div>'

      +'<div style="font-size:11px;font-weight:700;color:#0f1f16;text-transform:uppercase;letter-spacing:.06em;margin:18px 0 8px;">📜 Historique des budgets</div>'
      +(budgetsMensuels.length
        ? '<div style="display:flex;flex-direction:column;gap:6px;">'
          +budgetsMensuels.slice().sort((a,b)=>(b.annee*12+b.mois)-(a.annee*12+a.mois)).map(b=>{
            const label = new Date(b.annee, b.mois-1, 1).toLocaleDateString("fr-CI",{month:"long",year:"numeric"});
            return '<div style="background:#fff;border:1.5px solid #e4ede7;border-radius:10px;padding:9px 12px;display:flex;justify-content:space-between;align-items:center;font-size:11px;">'
              +'<div><div style="font-weight:700;color:#0f1f16;">'+label+'</div>'
                +'<div style="font-size:10px;color:#6b8c7a;">CA obj. '+fmt(b.ca_objectif)+' · MB obj. '+fmt(b.marge_brute_objectif)+' · RN obj. '+fmt(b.resultat_net_objectif)+'</div>'
              +'</div>'
              +'<button onclick="modalEditerBudget('+b.annee+','+b.mois+')" style="background:#f1f5f2;border:none;border-radius:8px;padding:5px 10px;font-size:10px;font-weight:700;color:#3d5c48;cursor:pointer;font-family:inherit;">✏</button>'
            +'</div>';

          +'</div>'
        : '<div style="text-align:center;padding:16px;color:#6b8c7a;font-size:12px;background:#f8faf8;border-radius:10px;">Aucun budget défini.</div>');
  }

  else if(bilanOnglet==="pertes") {
    if(!isAdmin){
      contenu='<div style="background:#fef2f2;border:1.5px solid #fecaca;border-radius:14px;padding:24px;text-align:center;">'
        +'<div style="font-size:32px;margin-bottom:8px;">🔐</div>'
        +'<div style="font-weight:700;color:#dc2626;font-size:14px;">Réservé à l\'administrateur</div>'
        +'</div>';
    } else {
      // Pertes par produit
      const pertesProds = Object.entries(pertes).filter(([,v])=>v>0);
      // Pertes par lot (achats avec pertes détectées via stock négatif)
      const pertesLots = [];
      achats.filter(a=>a.statut==="recu").forEach(a=>{
        const qteVendue=ventes.filter(v=>v.produit===a.produit).reduce((s,v)=>s+v.quantite,0);
        const qtePerte=pertes[a.produit]||0;
        const qteRestante=a.quantite-qteVendue-qtePerte;
        const perteLot=a.quantite-(qteVendue+Math.max(qteRestante,0));
        if(perteLot>0){
          const valPerte=perteLot*a.prix_unitaire;
          pertesLots.push({
            fournisseur:a.fournisseur||"N/A",
            produit:a.produit,
            date:a.date,
            qteAchetee:a.quantite,
            qtePerte:perteLot,
            valPerte,
            lot:a.id
          });
        }
      });
      const totalPertesVal=pertesProds.reduce((s,[p,q])=>{const c=coutMoyen(p);return s+(c?q*c:0);},0);

      contenu='<div style="background:#fef2f2;border:1.5px solid #fecaca;border-radius:12px;padding:12px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;">'
        +'<div><div style="font-size:12px;font-weight:700;color:#dc2626;">⚠ Pertes enregistrées</div>'
          +'<div style="font-size:11px;color:#3d5c48;margin-top:2px;">'+pertesProds.length+' produit'+(pertesProds.length>1?'s':'')+" · Valeur estimée : "+fmt(totalPertesVal)+'</div>'
        +'</div>'
        +'<button onclick="switchTab(\'commercial\');switchCommercialSub(\'stock\')" style="background:#dc2626;color:#fff;border:none;border-radius:9px;padding:7px 12px;cursor:pointer;font-size:11px;font-weight:700;font-family:inherit;">Gérer →</button>'
        +'</div>'

        // Pertes par produit
        +'<div style="font-size:11px;font-weight:700;color:#0f1f16;text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px;">Par produit</div>'
        +(pertesProds.length
          ? '<div style="display:flex;flex-direction:column;gap:6px;margin-bottom:14px;">'
            +pertesProds.map(([p,q])=>{
              const c=coutMoyen(p);
              const val=c?q*c:null;
              return '<div style="background:#fff;border:1.5px solid #fecaca;border-radius:10px;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;">'
                +'<div><div style="font-weight:700;color:#0f1f16;font-size:13px;">'+(getProduitIcon(p)||"🌿")+" "+p+'</div>'
                  +'<div style="font-size:10px;color:#6b8c7a;">Qté perdue : '+q+' unités'+(c?' · Valeur : '+fmt(val):'')+'</div>'
                +'</div>'
                +'<div style="text-align:right;">'
                  +'<div style="font-size:14px;font-weight:900;color:#dc2626;">−'+q+'</div>'
                  +(val?'<div style="font-size:10px;color:#6b8c7a;">−'+fmt(val)+'</div>':'')
                +'</div>'
              +'</div>';
            }).join("")
            +'</div>'
          : '<div style="text-align:center;padding:16px;color:#6b8c7a;font-size:12px;background:#f8faf8;border-radius:10px;margin-bottom:14px;">Aucune perte enregistrée par produit.</div>')

        // Pertes par lot (calcul automatique)
        +'<div style="font-size:11px;font-weight:700;color:#0f1f16;text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px;">Par lot (déficit détecté)</div>'
        +(pertesLots.length
          ? '<div style="display:flex;flex-direction:column;gap:6px;">'
            +pertesLots.map(l=>{
              return '<div style="background:#fff;border:1.5px solid #fed7aa;border-radius:10px;padding:10px 12px;">'
                +'<div style="display:flex;justify-content:space-between;align-items:center;">'
                  +'<div><div style="font-weight:700;color:#0f1f16;font-size:12px;">'+(getProduitIcon(l.produit)||"🌿")+" "+l.produit+' — '+l.fournisseur+'</div>'
                    +'<div style="font-size:10px;color:#6b8c7a;">Date : '+l.date+' · Acheté : '+l.qteAchetee+' u.</div>'
                  +'</div>'
                  +'<div style="text-align:right;">'
                    +'<div style="font-size:13px;font-weight:900;color:#c2410c;">−'+l.qtePerte+' u.</div>'
                    +'<div style="font-size:10px;color:#6b8c7a;">−'+fmt(l.valPerte)+'</div>'
                  +'</div>'
                +'</div>'
              +'</div>';
            }).join("")
            +'</div>'
          : '<div style="text-align:center;padding:16px;color:#6b8c7a;font-size:12px;background:#f8faf8;border-radius:10px;">Aucun déficit détecté sur les lots.</div>');
    }
  }

  // Export CSV
  const exportBtn = '<button onclick="exportBilanCSV()" style="background:#f0fdf4;border:1.5px solid #bbf7d0;color:#15803d;border-radius:10px;padding:6px 10px;cursor:pointer;font-size:11px;font-weight:700;font-family:inherit;">⬇ CSV</button>';

  const bodyHtml = ongletsHtml + (bilanOnglet==="sig"||bilanOnglet==="budget"?"":kpiHtml) + contenu;

  if(inline) return bodyHtml;

  showModal(
    '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">'
    +'<div><div style="font-size:17px;font-weight:800;color:#0f1f16;">💼 Bilan financier</div>'
    +'<div style="font-size:11px;color:#3d5c48;margin-top:2px;">Achats · Ventes · Soldes · Pertes</div></div>'
    +'<div style="display:flex;gap:6px;align-items:center;">'+exportBtn
    +'<button onclick="closeModal()" style="background:#f1f5f2;border:none;border-radius:999px;width:32px;height:32px;cursor:pointer;font-size:16px;color:#3d5c48;">✕</button>'
    +'</div></div>'
    + bodyHtml
  );
}

function exportBilanCSV(){
  const parJour={};
  achats.forEach(a=>{
    const j=(a.date_reception||a.date||"").slice(0,10);
    if(j){if(!parJour[j])parJour[j]={a:[],v:[]};parJour[j].a.push(a);}
  });
  ventes.forEach(v=>{const j=(v.date||"").slice(0,10);if(j){if(!parJour[j])parJour[j]={a:[],v:[]};parJour[j].v.push(v);}});
  const parMois={};
  achats.forEach(a=>{const m=(a.date||"").slice(0,7);if(m){if(!parMois[m])parMois[m]={a:[],v:[]};parMois[m].a.push(a);}});
  ventes.forEach(v=>{const m=(v.date||"").slice(0,7);if(m){if(!parMois[m])parMois[m]={a:[],v:[]};parMois[m].v.push(v);}});

  const rows=[
    ["=== BILAN PAR JOUR ==="],
    ["Date","Total achats","Total ventes","Solde","Marge brute","Marge nette","Frais terrain","Nb achats","Nb ventes"],
    ...Object.keys(parJour).sort().reverse().map(j=>{
      const d=parJour[j];
      const ta=d.a.reduce((s,a)=>s+a.quantite*a.prix_unitaire,0);
      const tv=d.v.reduce((s,v)=>s+v.quantite*v.prix_vente,0);
      const mb=margebrute(d.v);
      const mn=margenette(d.v);
      const fr=mb-mn;
      return [j,fmt(ta),fmt(tv),fmt(tv-ta),fmt(mb),fmt(mn),fmt(fr),d.a.length,d.v.length];
    }),
    [""],
    ["=== BILAN PAR MOIS ==="],
    ["Mois","Total achats","Total ventes","Solde","Marge brute","Marge nette","Frais terrain"],
    ...Object.keys(parMois).sort().reverse().map(m=>{
      const d=parMois[m];
      const ta=d.a.reduce((s,a)=>s+a.quantite*a.prix_unitaire,0);
      const tv=d.v.reduce((s,v)=>s+v.quantite*v.prix_vente,0);
      const mb=margebrute(d.v);
      const mn=margenette(d.v);
      const fr=mb-mn;
      return [m,fmt(ta),fmt(tv),fmt(tv-ta),fmt(mb),fmt(mn),fmt(fr)];
    }),
    [""],
    ["=== PERTES ==="],
    ["Produit","Quantité perdue","Valeur estimée"],
    ...Object.entries(pertes).filter(([,v])=>v>0).map(([p,q])=>{
      const c=coutMoyen(p);
      return [p,q,c?fmt(q*c):"N/A"];
    }),
  ];
  downloadCSV("VerdApp_BilanFinancier_"+new Date().toISOString().slice(0,10)+".csv", rows, []);
  showToast("✓ Bilan exporté");
}

function partagerBilanWA(j,totalA,totalV,margeB,nbA,nbV){
  const taux=totalA>0?Math.round((margeB/totalA)*100):0;
  const waLink=localStorage.getItem("va_wa_link")||"";
  const msg=`📊 *Bilan VerdApp CI — ${j}*\n`
    +`🛒 Achats : *${fmt(totalA)}* (${nbA} lot${nbA>1?"s":""})\n`
    +`💰 Ventes : *${fmt(totalV)}* (${nbV} vente${nbV>1?"s":""})\n`
    +`${margeB>=0?"✅":"⚠️"} Marge brute : *${margeB>=0?"+":""}${fmt(margeB)}* (${taux}%)`;
  const url=waLink.startsWith("http")?waLink:"https://wa.me/?text="+encodeURIComponent(msg);
  window.open(url,"_blank");
}

async function confirmerReglement(fournisseur){
  const montant = parseFloat(document.getElementById("reg-montant").value);
  const date    = document.getElementById("reg-date").value || today();
  const note    = document.getElementById("reg-note").value.trim();
  if(!montant||montant<=0){ showToast("Montant invalide","error"); return; }

  const reg = { id:genId(), fournisseur, montant, date, note };
  reglements.push(reg);
  saveLocal();

  // Sync Supabase si disponible
  try {
    await sbInsert("reglements_fournisseurs", reg);
  } catch(e){ /* pas bloquant */ }

  closeModal();
  showToast(`✓ Paiement de ${fmt(montant)} enregistré pour ${fournisseur}`);
  render();
}

function voirReglements(){
  const sorted = [...reglements].sort((a,b)=>b.date.localeCompare(a.date));
  if(!sorted.length){
    showModal(`<div style="text-align:center;padding:24px;color:#3d5c48;">
      <div style="font-size:40px;margin-bottom:12px;">📋</div>
      <div style="font-weight:700;font-size:16px;color:#0f1f16;">Aucun règlement enregistré</div>
      <div style="font-size:13px;margin-top:8px;">Les paiements effectués aux fournisseurs apparaîtront ici.</div>
    </div>`);
    return;
  }
  const total = sorted.reduce((s,r)=>s+r.montant,0);
  showModal(`
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
      <div>
        <div style="font-size:17px;font-weight:800;color:#0f1f16;">📋 Historique des règlements</div>
        <div style="font-size:11px;color:#3d5c48;margin-top:2px;">${sorted.length} paiement${sorted.length>1?"s":" "} · Total : ${fmt(total)}</div>
      </div>
      <button onclick="closeModal()" style="background:#f1f5f2;border:none;border-radius:999px;width:32px;height:32px;cursor:pointer;font-size:16px;color:#3d5c48;">✕</button>
    </div>
    <div style="max-height:420px;overflow-y:auto;">
      ${sorted.map(r=>`
        <div style="display:flex;justify-content:space-between;align-items:flex-start;padding:12px;background:#f8faf8;border-radius:12px;margin-bottom:8px;">
          <div>
            <div style="font-weight:700;color:#0f1f16;font-size:13px;">${r.fournisseur}</div>
            <div style="font-size:11px;color:#3d5c48;margin-top:2px;">📅 ${r.date}${r.note?" · "+r.note:""}</div>
          </div>
          <div style="text-align:right;">
            <div style="font-weight:800;color:#166534;font-size:14px;">${fmt(r.montant)}</div>
            ${isAdmin?`<button onclick="supprimerReglement('${r.id}')" style="font-size:10px;color:#dc2626;background:none;border:none;cursor:pointer;margin-top:2px;">Supprimer</button>`:""}

        </div>`).join("")}

}

function supprimerReglement(id){
  if(!confirm("Supprimer ce règlement ?")) return;
  reglements = reglements.filter(r=>r.id!==id);
  saveLocal();
  showToast("Règlement supprimé");
  voirReglements();
  render();
}

function voirHistoPrix(){
  const prods = [...new Set(achats.map(a=>a.produit))].filter(Boolean);
  if(!prods.length){
    showModal(`<div style="text-align:center;padding:24px;color:#3d5c48;">
      <div style="font-size:40px;margin-bottom:12px;">📈</div>
      <div style="font-weight:700;font-size:16px;color:#0f1f16;">Aucune donnée de prix</div>
    </div>`);
    return;
  }

  // Calculer évolution prix par produit
  const histoPrix = {};
  prods.forEach(p=>{
    const lignes = achats
      .filter(a=>a.produit===p && a.prix_unitaire)
      .sort((a,b)=>a.date.localeCompare(b.date))
      .map(a=>({date:a.date, prix:a.prix_unitaire, fourn:a.fournisseur}));
    if(lignes.length) histoPrix[p] = lignes;
  });

  showModal(`
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
      <div style="font-size:17px;font-weight:800;color:#0f1f16;">📈 Historique des prix d'achat</div>
      <button onclick="closeModal()" style="background:#f1f5f2;border:none;border-radius:999px;width:32px;height:32px;cursor:pointer;font-size:16px;color:#3d5c48;">✕</button>
    </div>
    <div style="max-height:480px;overflow-y:auto;">
      ${Object.entries(histoPrix).map(([p,lignes])=>{
        const min=Math.min(...lignes.map(l=>l.prix));
        const max=Math.max(...lignes.map(l=>l.prix));
        const der=lignes[lignes.length-1];
        const avan=lignes.length>=2?lignes[lignes.length-2]:null;
        const tendance=avan?(der.prix>avan.prix?"📈":der.prix<avan.prix?"📉":"➡"):""
        return `<div style="background:#f8faf8;border-radius:14px;padding:16px;margin-bottom:14px;">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
            <div style="display:flex;align-items:center;gap:8px;">
              <span style="font-size:20px;">${getProduitIcon(p)||"🌿"}</span>
              <span style="font-weight:800;color:#0f1f16;font-size:14px;">${p}</span>
            </div>
            <div style="text-align:right;">
              <div style="font-size:15px;font-weight:800;color:#f47820;">${fmt(der.prix)}<span style="font-size:11px;color:#3d5c48;">/u</span></div>
              <div style="font-size:10px;color:#3d5c48;">${tendance} Dernier prix</div>
            </div>
          </div>
          <div style="display:flex;gap:8px;margin-bottom:10px;">
            <div style="flex:1;background:#f0fdf4;border:1px solid #bbf7d0;border-radius:8px;padding:8px;text-align:center;">
              <div style="font-size:12px;font-weight:700;color:#166534;">${fmt(min)}</div>
              <div style="font-size:10px;color:#3d5c48;">Prix min</div>
            </div>
            <div style="flex:1;background:#fef2f2;border:1px solid #fecaca;border-radius:8px;padding:8px;text-align:center;">
              <div style="font-size:12px;font-weight:700;color:#dc2626;">${fmt(max)}</div>
              <div style="font-size:10px;color:#3d5c48;">Prix max</div>
            </div>
            <div style="flex:1;background:#eff6ff;border:1px solid #bfdbfe;border-radius:8px;padding:8px;text-align:center;">
              <div style="font-size:12px;font-weight:700;color:#1d4ed8;">${fmt(Math.round(lignes.reduce((s,l)=>s+l.prix,0)/lignes.length))}</div>
              <div style="font-size:10px;color:#3d5c48;">Prix moyen</div>
            </div>
          </div>
          <div style="display:flex;flex-direction:column;gap:4px;">
            ${[...lignes].reverse().slice(0,6).map(l=>`
              <div style="display:flex;justify-content:space-between;align-items:center;padding:5px 8px;background:#fff;border-radius:8px;">

                <div style="font-size:12px;font-weight:700;color:#0f1f16;">${fmt(l.prix)}</div>
              </div>`).join("")}
            ${lignes.length>6?`<div style="font-size:10px;color:#6b8c7a;text-align:center;padding:4px;">+${lignes.length-6} enregistrement${lignes.length-6>1?"s":""}</div>`:""}
          </div>
        </div>`;
      }).join("")}
    </div>
  `);
}

function confirmerSeuil(produit){
  const val = parseInt(document.getElementById("seuil-val").value)||0;

}


// ════════════════════════════════════════════════════════════════════════════
// MODULE ANALYSE DE MARGE — Jour / Mois / Année + Par date
// ════════════════════════════════════════════════════════════════════════════

// ── Helpers calcul marge ─────────────────────────────────────────────────────
function couleurMarge(t){ return t>=20?"#166534":t>=10?"#c2410c":"#dc2626"; }
function bgMarge(t)     { return t>=20?"#f0fdf4":t>=10?"#fff7ed":"#fef2f2"; }
function borderMarge(t) { return t>=20?"#bbf7d0":t>=10?"#fed7aa":"#fecaca"; }

// calculerMarge — utilise le moteur FIFO (même résultat que le tableau de bord)
function calculerMarge(ventesF, achatsF) {
  return calculerMargeFIFO(ventesF, achatsF||[]);
}

// Jauge demi-cercle SVG
function jaugeMarge(t){
  const pct=Math.min(Math.max(t,0),100);
  const a=pct/100*180, r=a*Math.PI/180;
  const gx=70+54*Math.cos(Math.PI-r), gy=70-54*Math.sin(Math.PI-r);
  const col=t>=20?"#22a356":t>=10?"#f47820":"#dc2626";
  return '<svg viewBox="0 0 140 80" style="width:100px;height:52px;">'
    +'<path d="M15,70 A55,55 0 0,1 125,70" fill="none" stroke="#e2ece7" stroke-width="10" stroke-linecap="round"/>'
    +'<path d="M15,70 A55,55 0 0,1 '+gx.toFixed(1)+','+gy.toFixed(1)+'" fill="none" stroke="'+col+'" stroke-width="10" stroke-linecap="round"/>'
    +'<text x="70" y="62" text-anchor="middle" font-size="16" font-weight="900" fill="'+col+'">'+t+'%</text>'
    +'</svg>';
}

// Barre de progression
function barreMarge(t){
  const col=t>=20?"#22a356":t>=10?"#f47820":"#dc2626";
  const pct=Math.min(Math.max(t,0),100);
  return '<div style="height:6px;background:#e2ece7;border-radius:999px;overflow:hidden;margin-top:5px;">'
    +'<div style="height:100%;background:'+col+';border-radius:999px;width:'+pct+'%;"></div></div>';
}

// Ligne de décomposition
function ligneDecomp(lbl,val,col,sign,bold){
  const s=bold?"font-weight:700;color:#0f1f16;":"";
  const bs=bold?"border-top:2px solid #e2ece7;margin-top:4px;padding-top:10px;":"";
  return '<div style="display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid #e2ece7;'+bs+'">'
    +'<span style="font-size:12px;color:#3d5c48;'+s+'">'+lbl+'</span>'
    +'<span style="font-size:13px;font-weight:'+(bold?'900':'700')+';color:'+col+';">'+(sign||'')+fmt(Math.abs(val))+'</span>'
    +'</div>';
}

function exportMargeCSV(){
  const global = calculerMarge(ventes, achats.filter(a=>a.statut==="recu")); // calculerMarge maintenu pour les vues filtrées

  // Par jour
  const parJour = {};
  ventes.forEach(v=>{ const j=(v.date||"").slice(0,10); if(j){ if(!parJour[j])parJour[j]={v:[],a:[]}; parJour[j].v.push(v); }});
  achats.filter(a=>a.statut==="recu").forEach(a=>{ const j=(a.date_reception||a.date||"").slice(0,10); if(j){ if(!parJour[j])parJour[j]={v:[],a:[]}; parJour[j].a.push(a); }});

  // Par mois
  const parMois = {};
  ventes.forEach(v=>{ const m=(v.date||"").slice(0,7); if(m){ if(!parMois[m])parMois[m]={v:[],a:[]}; parMois[m].v.push(v); }});
  achats.filter(a=>a.statut==="recu").forEach(a=>{ const m=(a.date_reception||a.date||"").slice(0,7); if(m){ if(!parMois[m])parMois[m]={v:[],a:[]}; parMois[m].a.push(a); }});

  const rows = [
    ["=== RÉSUMÉ GLOBAL ==="],
    ["CA total", fmt(global.ca)],
    ["Marge brute", fmt(global.margeB), global.tauxB+"%"],
    ["Frais terrain", fmt(global.frais)],
    ["Marge nette", fmt(global.margeN), global.tauxN+"%"],
    [""],
    ["=== PAR JOUR ==="],
    ["Date","CA","Marge brute","Taux brut%","Marge nette","Taux net%","Nb ventes","Nb achats"],
    ...Object.keys(parJour).sort().reverse().map(j=>{
      const m=calculerMarge(parJour[j].v,parJour[j].a);
      return [j,fmt(m.ca),fmt(m.margeB),m.tauxB+"%",fmt(m.margeN),m.tauxN+"%",parJour[j].v.length,parJour[j].a.length];
    }),
    [""],
    ["=== PAR MOIS ==="],
    ["Mois","CA","Marge brute","Taux brut%","Marge nette","Taux net%"],
    ...Object.keys(parMois).sort().reverse().map(k=>{
      const m=calculerMarge(parMois[k].v,parMois[k].a);
      return [k,fmt(m.ca),fmt(m.margeB),m.tauxB+"%",fmt(m.margeN),m.tauxN+"%"];
    }),
  ];

  const d = new Date().toISOString().slice(0,10);
  downloadCSV("VerdApp_AnalyseMarge_"+d+".csv", rows, []);
  showToast("✓ Analyse marge exportée");
}

// ─── SÉCURITÉ : Vérification intégrité des données ───────────────────────────
function verifierIntegriteDonnees(){
  const problemes=[];

  // Vérifier les achats
  achats.forEach((a,i)=>{
    if(!a.id) problemes.push(`Achat #${i}: ID manquant`);
    if(!a.produit) problemes.push(`Achat #${i}: Produit manquant`);
    if(!a.quantite||a.quantite<=0) problemes.push(`Achat ${a.produit||"#"+i}: Quantité invalide`);
    if(!a.prix_unitaire||a.prix_unitaire<=0) problemes.push(`Achat ${a.produit||"#"+i}: Prix invalide`);
  });

  // Vérifier les ventes
  ventes.forEach((v,i)=>{
    if(!v.id) problemes.push(`Vente #${i}: ID manquant`);
    if(!v.produit) problemes.push(`Vente #${i}: Produit manquant`);
    if(!v.quantite||v.quantite<=0) problemes.push(`Vente ${v.produit||"#"+i}: Quantité invalide`);
    if(!v.prix_vente||v.prix_vente<=0) problemes.push(`Vente ${v.produit||"#"+i}: Prix invalide`);
  });

  // Détecter stocks négatifs
  const prodsStock=[...new Set(achats.filter(a=>a.statut==="recu").map(a=>a.produit))];
  prodsStock.forEach(p=>{
    const r=achats.filter(a=>a.produit===p&&a.statut==="recu").reduce((s,a)=>s+a.quantite,0);
    const v=ventes.filter(vv=>vv.produit===p).reduce((s,vv)=>s+vv.quantite,0);
    const pt=pertes[p]||0;
    const dispo=r-v-pt;
    if(dispo<0) problemes.push(`Stock négatif : ${p} (${dispo})`);
  });

  showModal(`
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
      <div>
        <div style="font-size:17px;font-weight:800;color:#0f1f16;">🔍 Vérification des données</div>
        <div style="font-size:11px;color:#3d5c48;margin-top:2px;">${achats.length} achats · ${ventes.length} ventes analysés</div>
      </div>
      <button onclick="closeModal()" style="background:#f1f5f2;border:none;border-radius:999px;width:32px;height:32px;cursor:pointer;font-size:16px;color:#3d5c48;">✕</button>
    </div>
    ${problemes.length===0
      ? `<div style="background:#f0fdf4;border:1.5px solid #bbf7d0;border-radius:14px;padding:24px;text-align:center;">
          <div style="font-size:32px;margin-bottom:8px;">✅</div>
          <div style="font-weight:700;color:#166534;font-size:15px;">Données intègres</div>
          <div style="font-size:13px;color:#3d5c48;margin-top:4px;">Aucun problème détecté sur ${achats.length+ventes.length} enregistrements.</div>
         </div>`
      : `<div style="background:#fef2f2;border:1.5px solid #fecaca;border-radius:12px;padding:12px;margin-bottom:12px;">
          <div style="font-size:12px;font-weight:700;color:#dc2626;margin-bottom:8px;">⚠ ${problemes.length} problème${problemes.length>1?"s":""} détecté${problemes.length>1?"s":""}</div>
          ${problemes.map(p=>`<div style="font-size:12px;color:#dc2626;padding:4px 0;border-bottom:1px solid #fecaca;">${p}</div>`).join("")}
        </div>`
    }
  `);
}

async function sbGetUsers() {
  const r = await sbFetch("/rest/v1/utilisateurs?order=nom.asc");
  if(!r.ok) throw new Error(await r.text());
  return r.json();
}
async function sbCreateUser(payload) {
  const r = await sbFetch("/rest/v1/utilisateurs", {method:"POST",body:JSON.stringify(payload)});
  if(!r.ok) throw new Error(await r.text());
  return r.json();
}
async function sbUpdateUser(id, data) {
  const r = await sbFetch("/rest/v1/utilisateurs?id=eq."+id, {method:"PATCH",body:JSON.stringify(data)});
  if(!r.ok) throw new Error(await r.text());
  return r.json();
}
async function sbDeleteUser(id) {
  const r = await sbFetch("/rest/v1/utilisateurs?id=eq."+id, {method:"DELETE"});
  if(!r.ok) throw new Error(await r.text());
}

async function sauvegarderUtilisateur() {
  const id   = document.getElementById("edit-uid").value;
  const nom  = document.getElementById("edit-unom").value.trim();
  const role = document.getElementById("edit-urole").value;
  const pin  = document.getElementById("edit-upin").value;
  const msg  = document.getElementById("user-form-msg");

  if(!nom) { msg.style.display="block"; msg.style.color="#dc2626"; msg.textContent="Le nom est obligatoire."; return; }
  if(!id && !pin) { msg.style.display="block"; msg.style.color="#dc2626"; msg.textContent="Le PIN est obligatoire pour un nouvel utilisateur."; return; }
  if(pin && (pin.length < 4 || !/^\d+$/.test(pin))) { msg.style.display="block"; msg.style.color="#dc2626"; msg.textContent="Le PIN doit contenir au moins 4 chiffres."; return; }

  msg.style.display="block"; msg.style.color="#166534"; msg.textContent="Sauvegarde...";

  try {
    if(id) {
      const data = {nom, role};
      if(pin) data.pin_hash = await hashPin(pin);
      await sbUpdateUser(id, data);
      logAdminAction("USER_EDIT","Modification : "+nom);
      showToast("✓ Utilisateur modifié");
    } else {
      const pin_hash = await hashPin(pin);
      await sbCreateUser({id:genUUID(), nom, role, pin_hash, actif:true});
      logAdminAction("USER_CREATE","Création : "+nom+" ("+role+")");
      showToast("✓ Utilisateur créé");
    }
    await renderGestionUtilisateurs();
  } catch(e) {
    msg.style.color="#dc2626";
    msg.textContent = errMsg(e);
  }
}

async function toggleUserActif(id, actif) {
  try {
    await sbUpdateUser(id, {actif: !actif});
    logAdminAction("USER_TOGGLE","Statut utilisateur ID:"+id+" → "+(actif?"inactif":"actif"));
    showToast(actif ? "Utilisateur désactivé" : "Utilisateur activé");
    renderGestionUtilisateurs();
  } catch(e) { showToast("Erreur : "+e.message,"error"); }
}

async function supprimerUtilisateur(id, nom) {
  if(!confirm("Supprimer l'utilisateur "+nom+" ? Cette action est irréversible.")) return;
  try {
    await sbDeleteUser(id);
    logAdminAction("USER_DELETE","Suppression : "+nom);
    showToast("Utilisateur supprimé");
    renderGestionUtilisateurs();
  } catch(e) { showToast(errMsg(e),"error"); }
}
