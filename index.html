// MODULE ANALYSE CLIENTS / FOURNISSEURS (Pôle Financier — Lot 4)
// ════════════════════════════════════════════════════════════════════════════
//
// Top clients par CA, top fournisseurs par achats, fréquence et panier moyen.
// NOTE : le délai moyen de paiement (DSO/DPO) n'est pas calculable car l'app
// n'enregistre pas de date de règlement ni de statut crédit/comptant côté
// client. On l'indique clairement comme non disponible plutôt que d'inventer
// une valeur.

function renderTiers(){
  const target = document.getElementById("tiersInline");
  if(!target) return;

  // ── Clients (depuis ventes) ──
  const clientsMap = {};
  ventes.forEach(v=>{
    const nom = (v.client||"—").trim() || "—";
    if(!clientsMap[nom]) clientsMap[nom] = {nom, ca:0, nb:0, dates:[]};
    clientsMap[nom].ca += (v.quantite||0)*(v.prix_vente||0);
    clientsMap[nom].nb += 1;
    if(v.date) clientsMap[nom].dates.push(v.date);
  });
  const clients = Object.values(clientsMap).sort((a,b)=>b.ca-a.ca);
  const caTotal = clients.reduce((s,c)=>s+c.ca,0)||1;

  // ── Fournisseurs (depuis achats) ──
  const fournMap = {};
  achats.forEach(a=>{
    const nom = (a.fournisseur||"—").trim() || "—";
    if(!fournMap[nom]) fournMap[nom] = {nom, montant:0, nb:0, du:0};
    const frais=(a.droit_terre||0)+(a.transport||0)+(a.droit_vente||0)+(a.charrette||0);
    const total=(a.quantite||0)*(a.prix_unitaire||0)+frais;
    fournMap[nom].montant += total;
    fournMap[nom].nb += 1;
    fournMap[nom].du += Math.max(0, total - (a.avance_paye||0));
  });
  const fournisseurs = Object.values(fournMap).sort((a,b)=>b.montant-a.montant);
  const achatTotal = fournisseurs.reduce((s,f)=>s+f.montant,0)||1;

  const ligneTiers = (nom, montant, part, sub, couleur) =>
    '<div style="margin-bottom:8px;">'
      +'<div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:2px;">'
        +'<span style="color:#0f1f16;font-weight:700;">'+nom+'</span>'
        +'<span style="font-weight:800;color:#0f1f16;">'+fmt(montant)+' <span style="font-size:9px;color:#6b8c7a;">('+part+'%)</span></span>'
      +'</div>'
      +(sub?'<div style="font-size:10px;color:#6b8c7a;margin-bottom:3px;">'+sub+'</div>':'')
      +'<div style="height:7px;background:#f1f5f2;border-radius:999px;overflow:hidden;"><div style="height:100%;width:'+part+'%;background:'+couleur+';border-radius:999px;"></div></div>'
    +'</div>';

  const clientsHtml = clients.slice(0,10).map(c=>{
    const part = Math.round(c.ca/caTotal*100);
    const panier = c.nb ? Math.round(c.ca/c.nb) : 0;
    return ligneTiers(c.nom, c.ca, part, c.nb+" achat"+(c.nb>1?"s":"")+" · panier moyen "+fmt(panier), "#0369a1");
  }).join('');

  const fournHtml = fournisseurs.slice(0,10).map(f=>{
    const part = Math.round(f.montant/achatTotal*100);
    return ligneTiers(f.nom, f.montant, part, f.nb+" lot"+(f.nb>1?"s":"")+(f.du>0?" · reste dû "+fmt(f.du):" · soldé"), "#f47820");
  }).join('');

  target.innerHTML =
    '<div style="font-size:11px;font-weight:700;color:#0f1f16;text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px;">👥 Clients</div>'
    +'<div style="background:#fff;border:1.5px solid #e4ede7;border-radius:12px;padding:14px;margin-bottom:14px;">'
      +'<div style="display:flex;justify-content:space-between;font-size:11px;color:#6b8c7a;margin-bottom:10px;"><span>'+clients.length+' client'+(clients.length>1?'s':'')+'</span><span>CA total : '+fmt(caTotal)+'</span></div>'
      +(clients.length?clientsHtml:'<div style="text-align:center;padding:14px;color:#6b8c7a;font-size:12px;">Aucune vente enregistrée.</div>')
    +'</div>'

    +'<div style="font-size:11px;font-weight:700;color:#0f1f16;text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px;">🚚 Fournisseurs</div>'
    +'<div style="background:#fff;border:1.5px solid #e4ede7;border-radius:12px;padding:14px;margin-bottom:14px;">'
      +'<div style="display:flex;justify-content:space-between;font-size:11px;color:#6b8c7a;margin-bottom:10px;"><span>'+fournisseurs.length+' fournisseur'+(fournisseurs.length>1?'s':'')+'</span><span>Achats : '+fmt(achatTotal)+'</span></div>'
      +(fournisseurs.length?fournHtml:'<div style="text-align:center;padding:14px;color:#6b8c7a;font-size:12px;">Aucun achat enregistré.</div>')
    +'</div>'

    +'<div style="background:#fff7ed;border:1.5px solid #fed7aa;border-radius:10px;padding:10px 12px;font-size:10px;color:#92400e;">'
      +'<b>Délai moyen de paiement (DSO / DPO) : donnée non disponible.</b> L\'application n\'enregistre pas encore les dates de règlement ni le statut crédit/comptant des ventes. Pour activer ce calcul, il faudra ajouter un suivi des encaissements clients et décaissements fournisseurs datés.'
    +'</div>';
}

// MODULE RAPPORT FINANCIER PDF (Pôle Financier — Lot 6)
// ════════════════════════════════════════════════════════════════════════════
function genererRapportFinancierPDF(){
  if(typeof window.jspdf==="undefined"){ showToast("Génération PDF indisponible (hors-ligne)","error"); return; }
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({unit:"mm", format:"a4"});
  const W=210, M=14;
  let y=0;

  // Données
  const ca = totalVentes();
  const margeBrute = margebrute(ventes);
  const margeNetteCom = margenette(ventes);
  const cmv = ca - margeBrute;
  const frais = margeBrute - margeNetteCom;
  const totalCommiss = totalCommissionsDues();
  const totalPertesV = totalPertesValeur();
  const resultatExpl = margeNetteCom - totalCommiss - totalPertesV;
  const totalDus = totalAchats() - totalAvances();
  const tauxB = ca?Math.round(margeBrute/ca*100):0;
  const tauxN = ca?Math.round(margeNetteCom/ca*100):0;
  const tauxRE = ca?Math.round(resultatExpl/ca*100):0;
  const soldeTreso = soldeCaisse(tousMouvementsCaisse());

  // En-tête
  doc.setFillColor(13,61,26); doc.rect(0,0,W,26,"F");
  doc.setTextColor(255,255,255); doc.setFontSize(17); doc.setFont(undefined,"bold");
  doc.text("VerdApp CI", M, 12);
  doc.setFontSize(9); doc.setFont(undefined,"normal");
  doc.text("Rapport financier", M, 19);
  const moisLabel = new Date().toLocaleDateString("fr-CI",{month:"long",year:"numeric"});
  doc.setFontSize(11); doc.setFont(undefined,"bold");
  doc.text(moisLabel, W-M, 12, {align:"right"});
  doc.setFontSize(8); doc.setFont(undefined,"normal");
  doc.text("Édité le "+new Date().toLocaleDateString("fr-CI"), W-M, 19, {align:"right"});

  y=36;
  doc.setTextColor(20,20,20);

  // Section : Compte de résultat (SIG)
  function titreSection(t){
    doc.setFillColor(240,244,240); doc.rect(M,y-5,W-2*M,8,"F");
    doc.setFontSize(10); doc.setFont(undefined,"bold"); doc.setTextColor(13,61,26);
    doc.text(t, M+2, y); y+=9; doc.setTextColor(20,20,20);
  }
  function ligne(label, valeur, opts){
    opts=opts||{};
    doc.setFontSize(opts.gras?10:9); doc.setFont(undefined,opts.gras?"bold":"normal");
    doc.text(label, M+2, y);
    doc.text(valeur, W-M-2, y, {align:"right"});
    y+=opts.gras?7:6;
  }

  titreSection("COMPTE DE RÉSULTAT (SIG)");
  ligne("Chiffre d'affaires (CA)", fmt(ca));
  ligne("− Coût d'achat des marchandises vendues (FIFO)", "−"+fmt(cmv));
  ligne("= MARGE BRUTE  ("+tauxB+"%)", fmt(margeBrute), {gras:true});
  ligne("− Frais accessoires d'achat", "−"+fmt(frais));
  ligne("= MARGE NETTE COMMERCIALE  ("+tauxN+"%)", fmt(margeNetteCom), {gras:true});
  ligne("− Commissions terrain", "−"+fmt(totalCommiss));
  ligne("− Pertes sur stocks", "−"+fmt(totalPertesV));
  ligne("= RÉSULTAT D'EXPLOITATION  ("+tauxRE+"%)", fmt(resultatExpl), {gras:true});
  y+=4;

  // Section : Indicateurs clés
  titreSection("INDICATEURS CLÉS");
  ligne("Trésorerie (solde de caisse)", fmt(soldeTreso));
  ligne("Dû fournisseurs", fmt(totalDus));
  ligne("Taux de marge brute", tauxB+"%");
  ligne("Taux de marge nette", tauxN+"%");
  y+=4;

  // Section : Diagnostic
  titreSection("DIAGNOSTIC");
  const diag = [];
  if(tauxB>=20) diag.push("+ Marge brute solide"); else diag.push("- Marge brute faible");
  if(tauxN>=15) diag.push("+ Marge nette saine"); else diag.push("- Marge nette sous le seuil de 15%");
  if(resultatExpl>=0) diag.push("+ Activité bénéficiaire"); else diag.push("- Résultat d'exploitation négatif");
  if(totalDus>0) diag.push("- Dettes fournisseurs à régler : "+fmt(totalDus));
  doc.setFontSize(9); doc.setFont(undefined,"normal");
  diag.forEach(d=>{ doc.text(d, M+2, y); y+=6; });

  // Pied de page
  doc.setFontSize(7); doc.setTextColor(120,120,120);
  doc.text("Document généré par VerdApp CI — conforme au cadre SYSCOHADA. Les charges fixes générales (loyer, salaires administratifs, amortissements,", M, 285);
  doc.text("impôts) ne sont pas incluses dans le résultat d'exploitation ci-dessus et doivent être intégrées par le comptable pour le résultat net.", M, 289);

  doc.save("rapport_financier_verdapp_"+new Date().toISOString().slice(0,7)+".pdf");
}

// ════════════════════════════════════════════════════════════════════════════
// MODULE INVESTISSEMENTS (ROI, Payback, VAN, TRI)
// ════════════════════════════════════════════════════════════════════════════
//
// Hypothèse de modèle : un investissement a un coût initial (sortie en année 0),
// puis un flux net annuel constant attendu (gain ou économie) sur un horizon
// donné, plus une valeur résiduelle en fin d'horizon. Ces flux sont des
// PRÉVISIONS saisies par l'utilisateur — l'app ne peut pas les deviner.
//
// Méthodes :
//   ROI = (flux cumulés + valeur résiduelle − coût) / coût
//   Payback = coût / flux annuel (en années, si flux>0)
//   VAN (NPV) = −coût + Σ flux_t/(1+i)^t + résiduelle/(1+i)^n
//   TRI (IRR) = taux i tel que VAN = 0 (résolu par bissection)

function vanInvest(inv){
  const cout = +inv.cout_initial||0;
  const flux = +inv.flux_annuel||0;
  const n = Math.max(1, parseInt(inv.duree_annees)||1);
  const i = (+inv.taux_actualisation||0)/100;
  const residuelle = +inv.valeur_residuelle||0;
  let van = -cout;
  for(let t=1;t<=n;t++){ van += flux/Math.pow(1+i,t); }
  van += residuelle/Math.pow(1+i,n);
  return van;
}

function triInvest(inv){
  const cout = +inv.cout_initial||0;
  const flux = +inv.flux_annuel||0;
  const n = Math.max(1, parseInt(inv.duree_annees)||1);
  const residuelle = +inv.valeur_residuelle||0;
  if(cout<=0) return null;
  // VAN en fonction du taux r
  const vanAt = r => {
    let v=-cout;
    for(let t=1;t<=n;t++){ v += flux/Math.pow(1+r,t); }
    v += residuelle/Math.pow(1+r,n);
    return v;
  };
  // Si même le taux 0 donne une VAN négative, pas de TRI positif
  if(vanAt(0) < 0) return null;
  // Bissection entre 0 et 1000%
  let lo=0, hi=10; // 0% à 1000%
  if(vanAt(hi) > 0) return null; // TRI > 1000%, non pertinent
  for(let k=0;k<100;k++){
    const mid=(lo+hi)/2;
    const v=vanAt(mid);
    if(Math.abs(v)<1) return mid*100;
    if(v>0) lo=mid; else hi=mid;
  }
  return ((lo+hi)/2)*100;
}

// MODULE EMPRUNTS — échéancier (annuités constantes / capital constant / libre)
//                   + alertes d'échéance à 7 jours
// ════════════════════════════════════════════════════════════════════════════

/**
 * Génère le tableau d'amortissement théorique d'un emprunt.
 * Méthodes :
 *  - "annuites"          : mensualité constante (annuités) — formule bancaire classique
 *  - "capital_constant"  : amortissement constant du capital (mensualité dégressive)
 *  - "libre"             : pas d'échéancier auto (remboursements saisis manuellement)
 * Taux et durée optionnels : si pas de taux → intérêts = 0 ; si pas de durée → []
 * @returns {Array<{n, date, mensualite, interet, capital, capitalRestant}>}
 */
function genererEcheancier(emp){
  const principal = +emp.montant_principal||0;
  const n = parseInt(emp.duree_mois)||0;
  const methode = emp.methode_amortissement||"annuites";
  if(methode==="libre" || n<=0 || principal<=0) return [];

  const tauxMensuel = (+emp.taux_annuel||0)/100/12;
  const dateDebut = new Date(emp.date_debut||new Date().toISOString().slice(0,10));
  const jourEch = parseInt(emp.jour_echeance)||dateDebut.getDate();

  const lignes = [];
  let capitalRestant = principal;

  // Mensualité constante (annuités) : M = P·i / (1 − (1+i)^−n)
  let mensualiteConst = 0;
  if(methode==="annuites"){
    mensualiteConst = tauxMensuel>0
      ? principal * tauxMensuel / (1 - Math.pow(1+tauxMensuel, -n))
      : principal / n;
  }
  const capitalConst = principal / n; // pour capital_constant

  for(let k=1; k<=n; k++){
    const interet = capitalRestant * tauxMensuel;
    let capital, mensualite;
    if(methode==="annuites"){
      mensualite = mensualiteConst;
      capital = mensualite - interet;
    } else { // capital_constant
      capital = capitalConst;
      mensualite = capital + interet;
    }
    capitalRestant = Math.max(0, capitalRestant - capital);
    // Date d'échéance : k mois après le début, au jour d'échéance
    const dEch = new Date(dateDebut);
    dEch.setMonth(dEch.getMonth()+k);
    dEch.setDate(Math.min(jourEch, daysInMonth(dEch.getFullYear(), dEch.getMonth())));
    lignes.push({
      n:k,
      date: dEch.toISOString().slice(0,10),
      mensualite, interet, capital,
      capitalRestant
    });
  }
  return lignes;
}

function daysInMonth(y,m){ return new Date(y, m+1, 0).getDate(); }

/** Total déjà remboursé (réel) pour un emprunt. */
function totalRembourse(empruntId){
  return empruntsRemboursements
    .filter(r=>r.emprunt_id===empruntId)
    .reduce((s,r)=>s+(+r.montant||0), 0);
}

/** Capital restant dû théorique (principal + intérêts − remboursé), version simple. */
function resteAPayerEmprunt(emp){
  const ech = genererEcheancier(emp);
  if(ech.length){
    const totalDu = ech.reduce((s,l)=>s+l.mensualite, 0);
    return Math.max(0, totalDu - totalRembourse(emp.id));
  }
  // Emprunt libre : reste = principal − remboursé
  return Math.max(0, (+emp.montant_principal||0) - totalRembourse(emp.id));
}

/**
 * Prochaine échéance non encore couverte par les remboursements.
 * On considère les mensualités couvertes tant que le cumul remboursé les couvre.
 */
function prochaineEcheance(emp){
  const ech = genererEcheancier(emp);
  if(!ech.length) return null;
  let rembourse = totalRembourse(emp.id);
  for(const l of ech){
    if(rembourse >= l.mensualite){ rembourse -= l.mensualite; continue; }
    return l; // première échéance non (entièrement) couverte
  }
  return null; // tout couvert
}

/** Liste des emprunts actifs dont la prochaine échéance tombe dans ≤ 7 jours. */
function echeancesProches(joursAlerte){
  const seuil = joursAlerte||7;
  const today = new Date(); today.setHours(0,0,0,0);
  const res = [];
  emprunts.filter(e=>e.statut==="actif").forEach(emp=>{
    const pe = prochaineEcheance(emp);
    if(!pe) return;
    const dEch = new Date(pe.date); dEch.setHours(0,0,0,0);
    const joursRestants = Math.round((dEch - today)/(1000*60*60*24));
    if(joursRestants <= seuil){
      res.push({emp, echeance:pe, joursRestants});
    }
  });
  return res.sort((a,b)=>a.joursRestants-b.joursRestants);
}

/** Total du capital restant dû sur tous les emprunts actifs (pour dashboard/SIG). */
function totalDetteEmprunts(){
  return emprunts.filter(e=>e.statut==="actif").reduce((s,e)=>s+resteAPayerEmprunt(e), 0);
}

async function enregistrerInvestissement(){
  const msg = document.getElementById("inv_msg");
  const libelle = document.getElementById("inv_libelle")?.value.trim();
  if(!libelle){ msg.style.cssText="display:block;color:#dc2626;"; msg.textContent="Saisissez un libellé."; return; }
  const payload = {
    id: genId(),
    libelle,
    categorie: document.getElementById("inv_cat")?.value || "autre",
    cout_initial: parseFloat(document.getElementById("inv_cout")?.value)||0,
    date_acquisition: document.getElementById("inv_date")?.value || new Date().toISOString().slice(0,10),
    flux_annuel: parseFloat(document.getElementById("inv_flux")?.value)||0,
    duree_annees: parseInt(document.getElementById("inv_duree")?.value)||1,
    taux_actualisation: parseFloat(document.getElementById("inv_taux")?.value)||0,
    valeur_residuelle: parseFloat(document.getElementById("inv_residu")?.value)||0,
    enregistre_par: currentUser?.nom || "Admin",
  };
  msg.style.cssText="display:block;color:#166534;"; msg.textContent="Enregistrement…";
  try {
    await sbInsert("investissements", payload);
    investissements.unshift(payload);
    saveInvestissements();
    logAdminAction("INVESTISSEMENT", libelle+" "+fmt(payload.cout_initial));
    showToast("✓ Investissement enregistré");
    closeModal();
    renderInvestissements();
  } catch(e) {
    msg.style.cssText="display:block;color:#dc2626;"; msg.textContent="Erreur : "+e.message;
  }
}

async function supprimerInvestissement(id){
  if(!isAdmin){ showToast("Réservé à l'administrateur","error"); return; }
  const inv = investissements.find(x=>x.id===id);
  if(!inv || !confirm("Supprimer l'investissement \""+inv.libelle+"\" ?")) return;
  try {
    await sbDelete("investissements", id);
    investissements = investissements.filter(x=>x.id!==id);
    saveInvestissements();
    showToast("✓ Supprimé");
    renderInvestissements();
  } catch(e) { showToast("Erreur : "+e.message,"error"); }
}

async function enregistrerEmprunt(){

  if(!libelle){ msg.style.cssText="display:block;color:#dc2626;"; msg.textContent="Saisissez un libellé."; return; }

  if(montant<=0){ msg.style.cssText="display:block;color:#dc2626;"; msg.textContent="Saisissez un montant."; return; }

  const tauxVal = document.getElementById("emp_taux")?.value;
  const dureeVal = document.getElementById("emp_duree")?.value;
  const jourVal = document.getElementById("emp_jour")?.value;

  const payload = {
    id: genId(),
    libelle,
    type_emprunt: document.getElementById("emp_type")?.value || "bancaire",
    preteur: document.getElementById("emp_preteur")?.value.trim() || null,
    montant_principal: montant,

    note: document.getElementById("emp_note")?.value.trim() || null,
    statut: "actif",
    enregistre_par: currentUser?.nom || "Admin",
  };
  msg.style.cssText="display:block;color:#166534;"; msg.textContent="Enregistrement…";
  try {
    await sbInsert("emprunts", payload);
    emprunts.unshift(payload);
    saveEmprunts();

async function supprimerEmprunt(id){
  if(!isAdmin){ showToast("Réservé à l'administrateur","error"); return; }
  const emp = emprunts.find(x=>x.id===id);
  if(!emp || !confirm("Supprimer l'emprunt \""+emp.libelle+"\" et tous ses remboursements ?")) return;

  } catch(e) { showToast("Erreur : "+e.message,"error"); }
}

  const rembourse = totalRembourse(emp.id);
  let cumulCouvert = rembourse;

  const lignes = ech.map(l=>{
    const couverte = cumulCouvert >= l.mensualite;
    if(couverte) cumulCouvert -= l.mensualite;
    const partielle = !couverte && cumulCouvert>0;
    const restPartiel = partielle ? cumulCouvert : 0;

    const statutTxt = couverte ? '<span style="color:#15803d;font-weight:700;">✓ payée</span>'

async function enregistrerRemboursement(id){
  const msg = document.getElementById("rb_msg");
  const emp = emprunts.find(x=>x.id===id);
  if(!emp) return;
  const montant = parseFloat(document.getElementById("rb_montant")?.value)||0;
  if(montant<=0){ msg.style.cssText="display:block;color:#dc2626;"; msg.textContent="Saisissez un montant."; return; }

  // Ventilation capital/intérêt sur la base de la prochaine échéance théorique
  const pe = prochaineEcheance(emp);
  let partInteret = null, partCapital = null;
  if(pe){
    partInteret = Math.min(montant, pe.interet);
    partCapital = montant - partInteret;
  }

  const payload = {
    id: genId(),
    emprunt_id: id,
    date: document.getElementById("rb_date")?.value || new Date().toISOString().slice(0,10),
    montant,
    part_capital: partCapital,
    part_interet: partInteret,
    mode_paiement: document.getElementById("rb_mode")?.value || "virement",
    note: document.getElementById("rb_note")?.value.trim() || null,
    enregistre_par: currentUser?.nom || "Admin",
  };
  const marquerSolde = document.getElementById("rb_solde")?.checked;

  msg.style.cssText="display:block;color:#166534;"; msg.textContent="Enregistrement…";
  try {
    await sbInsert("emprunts_remboursements", payload);
    empruntsRemboursements.unshift(payload);
    saveEmpruntsRemboursements();
    if(marquerSolde){
      await sbUpdate("emprunts", id, {statut:"solde"});
      emp.statut = "solde"; saveEmprunts();
    }
    logAdminAction("REMBOURSEMENT", emp.libelle+" "+fmt(montant));
    showToast("✓ Remboursement enregistré");
    closeModal();
    renderEmprunts();
  } catch(e) {
    msg.style.cssText="display:block;color:#dc2626;"; msg.textContent="Erreur : "+e.message;
  }
}

function voirJournalComptable(){
  if(!isAdmin){ showToast("Réservé à l'administrateur","error"); return; }

  const lignes = journalComptable.slice().sort((a,b)=>(b.date||"").localeCompare(a.date||""));

  // Balance simplifiée par compte (somme débits / somme crédits)
  const balance = {};
  lignes.forEach(e=>{
    balance[e.compte_debit] = balance[e.compte_debit] || {libelle:e.compte_debit_libelle, debit:0, credit:0};
    balance[e.compte_debit].debit += e.montant;
    balance[e.compte_credit] = balance[e.compte_credit] || {libelle:e.compte_credit_libelle, debit:0, credit:0};
    balance[e.compte_credit].credit += e.montant;
  });

async function lancerRegenerationJournal(){
  const capitalEl = document.getElementById("jc_capital");
  const msg = document.getElementById("jc_msg");
  const capital = parseFloat(capitalEl?.value)||0;

  msg.style.cssText="display:block;color:#166534;"; msg.textContent="Génération en cours…";

  try {
    const n = await regenererJournalComptable(capital);
    logAdminAction("REGEN_JOURNAL", n+" écritures générées");
    showToast("✓ Journal régénéré : "+n+" écritures");
    voirJournalComptable();
  } catch(e) {
    msg.style.cssText="display:block;color:#dc2626;"; msg.textContent="Erreur : "+e.message;
  }
}

function exporterJournalCSV(){
  if(!journalComptable.length){ showToast("Journal vide","error"); return; }
  const header = "Date,Type,Reference,Libelle,Compte debit,Libelle debit,Compte credit,Libelle credit,Montant\n";
  const rows = journalComptable.slice().sort((a,b)=>(a.date||"").localeCompare(b.date||"")).map(e=>
    [e.date,e.type_operation,e.reference||"",'"'+e.libelle.replace(/"/g,'""')+'"',e.compte_debit,'"'+e.compte_debit_libelle+'"',e.compte_credit,'"'+e.compte_credit_libelle+'"',e.montant]
    .join(",")
  ).join("\n");
  const blob = new Blob([header+rows], {type:"text/csv;charset=utf-8;"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = "journal_comptable_verdapp.csv";
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

  function buildPie(data){
    if(!data.length) return "";
    const total=data.reduce((s,[,v])=>s+v,0);
    let startAngle=-Math.PI/2;
    const R=55, CX=70, CY=70;
    let slices="";
    data.slice(0,6).forEach(([name,val],i)=>{
      const pct=val/total;
      const end=startAngle+pct*2*Math.PI;
      const x1=CX+R*Math.cos(startAngle), y1=CY+R*Math.sin(startAngle);
      const x2=CX+R*Math.cos(end), y2=CY+R*Math.sin(end);

      slices+=`<path d="M${CX},${CY} L${x1},${y1} A${R},${R} 0 ${large},1 ${x2},${y2} Z" fill="${col}" opacity="0.9"/>`;

        <div style="background:${margeCommerciale>=0?'#f0fdf4':'#fef2f2'};border:1.5px solid ${margeCommerciale>=0?'#bbf7d0':'#fecaca'};border-radius:12px;padding:8px;text-align:center;">
          <div style="font-size:17px;font-weight:900;color:${margeCommerciale>=0?'#166534':'#dc2626'};">${tauxCommercial}%</div>
          <div style="font-size:9px;color:#3d5c48;font-weight:700;margin-top:2px;">Taux commercial</div>
          <div style="font-size:11px;font-weight:800;color:${margeCommerciale>=0?'#166534':'#dc2626'};margin-top:3px;">${fmt(margeCommerciale)}</div>
        </div>
      </div>
      <div style="height:6px;background:#e2ece7;border-radius:999px;overflow:hidden;">
        <div style="height:100%;background:${gaugeColor};border-radius:999px;width:${Math.min(taux,100)}%;transition:width .5s;"></div>
      </div>
      <div style="font-size:9px;color:#6b8c7a;text-align:center;margin-top:6px;">Frais terrain : −${fmt(fraisTerrain)} · Pertes : −${fmt(totalPertes)} · Commissions : −${fmt(totalCommiss)}</div>
    </div>
    <div class="card" style="margin-bottom:0;">
      <div class="label" style="margin-bottom:10px;">Santé de l'activité</div>
      <table style="width:100%;border-collapse:collapse;font-size:12px;">
        <tr style="border-bottom:1px solid var(--gray-100);"><td style="padding:6px 0;color:var(--gray-500);">Achats</td><td style="padding:6px 0;color:#2980b9;font-weight:700;text-align:right;">${nbAchats} lots</td></tr>
        <tr style="border-bottom:1px solid var(--gray-100);"><td style="padding:6px 0;color:var(--gray-500);">En transit</td><td style="padding:6px 0;color:var(--amber);font-weight:700;text-align:right;">${nbTransit}</td></tr>
        <tr style="border-bottom:1px solid var(--gray-100);"><td style="padding:6px 0;color:var(--gray-500);">Reçus</td><td style="padding:6px 0;color:var(--green-600);font-weight:700;text-align:right;">${nbRecus}</td></tr>
        <tr style="border-bottom:1px solid var(--gray-100);"><td style="padding:6px 0;color:var(--gray-500);">Ventes</td><td style="padding:6px 0;color:var(--green-600);font-weight:700;text-align:right;">${nbVentes}</td></tr>
        <tr><td style="padding:6px 0;color:var(--gray-500);">Dû fourn.</td><td style="padding:6px 0;color:${totalDus>0?"#dc2626":"#22a356"};font-weight:700;text-align:right;">${fmt(totalDus)}</td></tr>
      </table>
    </div>
  </div>`;

  // ── LIGNE 3 : COURBE ÉVOLUTION ──
  if(evolVals.some(v=>v>0)){
    const W=300,H=70,PAD=10;
    const pts=evolVals.map((v,i)=>({
      x:PAD+(i/(evolDays.length-1||1))*(W-PAD*2),
      y:PAD+(1-(v/maxEvol))*(H-PAD*2)
    }));
    const polyline=pts.map(p=>`${p.x},${p.y}`).join(" ");
    const areaPath=`M${pts[0].x},${H} `+pts.map(p=>`L${p.x},${p.y}`).join(" ")+` L${pts[pts.length-1].x},${H} Z`;
    html+=`<div style="background:var(--white);border:1.5px solid var(--gray-200);border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:var(--shadow);">
      <div class="label" style="margin-bottom:10px;">📈 Évolution des ventes — 7 derniers jours</div>
      <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:70px;">
        <defs>
          <linearGradient id="gr2" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="var(--green-500)" stop-opacity="0.25"/>
            <stop offset="100%" stop-color="var(--green-500)" stop-opacity="0"/>
          </linearGradient>
        </defs>
        <!-- Grille -->
        ${[0,1,2,3].map(i=>`<line x1="${PAD}" y1="${PAD+(i/3)*(H-PAD*2)}" x2="${W-PAD}" y2="${PAD+(i/3)*(H-PAD*2)}" stroke="var(--gray-200)" stroke-width="0.5"/>`).join("")}
        <path d="${areaPath}" fill="url(#gr2)"/>
        <polyline points="${polyline}" fill="none" stroke="var(--green-600)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
        ${pts.map((p,i)=>evolVals[i]>0?`<circle cx="${p.x}" cy="${p.y}" r="3" fill="#bef264" stroke="#0c0a09" stroke-width="1.5"/>`:"").join("")}
      </svg>
      <div style="display:flex;justify-content:space-between;margin-top:4px;">
        ${evolDays.map((d,i)=>`<div style="font-size:9px;color:var(--gray-500);text-align:center;flex:1;">${d.slice(5).replace("-","/")}${evolVals[i]>0?`<div style="color:#15803d;font-size:8px;">${fmt(evolVals[i]).replace(" F","")}</div>`:""}</div>`).join("")}
      </div>
    </div>`;
  }

  // ── LIGNE 4 : CAMEMBERT + PROGRESSION PRODUITS ──
  if(topProduits.length){
    const pieSlices=buildPie(topProduits);
    html+=`<div class="dash-row" style="margin-bottom:12px;">
      <div class="card" style="margin-bottom:0;">
        <div class="label" style="margin-bottom:10px;">Répartition ventes</div>
        <svg viewBox="0 0 140 140" style="width:100%;max-width:180px;display:block;margin:0 auto;height:140px;">
          ${pieSlices}
          <circle cx="70" cy="70" r="28" fill="#ffffff" stroke="#e2ece7" stroke-width="1"/>
          <text x="70" y="67" text-anchor="middle" font-size="9" fill="#3d5c48">Total</text>
          <text x="70" y="79" text-anchor="middle" font-size="8" font-weight="700" fill="#15803d">${fmt(totalV).replace(" F","")}</text>
        </svg>
        <div style="margin-top:8px;">
          ${topProduits.slice(0,5).map(([p],i)=>`<div style="display:flex;align-items:center;gap:6px;margin-bottom:5px;">
            <div style="width:10px;height:10px;background:${CHART_COLORS[i%CHART_COLORS.length]};border-radius:3px;flex-shrink:0;"></div>
            <span style="font-size:11px;font-weight:600;color:#1a2e22;">${getProduitIcon(p)} ${p}</span>
          </div>`).join("")}
        </div>
      </div>
      <div class="card" style="margin-bottom:0;">
        <div class="label" style="margin-bottom:12px;">Progression par produit</div>
        ${topProduits.slice(0,5).map(([p,m],i)=>{
          const ico=getProduitIcon(p)||"🌿";
          const pct=Math.round((m/(topProduits[0][1]||1))*100);
          const col=CHART_COLORS[i%CHART_COLORS.length];
          return `<div style="margin-bottom:10px;">
            <div style="display:flex;justify-content:space-between;font-size:12px;font-weight:600;margin-bottom:4px;">
              <span style="color:#1a2e22;">${ico} ${p}</span>
              <span style="color:#1a2e22;font-weight:700;">${pct}%</span>
            </div>
            <div style="height:8px;background:var(--gray-200);border-radius:999px;overflow:hidden;">
              <div style="height:100%;background:${col};border-radius:999px;width:${pct}%;"></div>
            </div>
          </div>`;
        }).join("")}
      </div>
    </div>`;
  }

  // ── LIGNE 5 : ACHATS VS VENTES ──
  const allProduits=[...new Set([...Object.keys(byP),...Object.keys(byPA)])];
  if(allProduits.length){
    const maxAV=Math.max(...allProduits.map(p=>Math.max(byPA[p]||0,byP[p]||0)),1);
    html+=`<div class="card" style="margin-bottom:12px;">
      <div class="label" style="margin-bottom:10px;">⚖ Achats vs Ventes</div>
      <div style="display:flex;gap:16px;margin-bottom:12px;">
        <div style="display:flex;align-items:center;gap:5px;font-size:11px;font-weight:600;color:#0369a1;">
          <div style="width:10px;height:10px;background:#60a5fa;border-radius:2px;"></div>Achats
        </div>
        <div style="display:flex;align-items:center;gap:5px;font-size:11px;font-weight:600;color:#15803d;">
          <div style="width:10px;height:10px;background:#4ade80;border-radius:2px;"></div>Ventes
        </div>
      </div>
      ${allProduits.slice(0,6).map(p=>{
        const ico=getProduitIcon(p)||"🌿";
        const pa=byPA[p]||0,pv=byP[p]||0;
        const pctA=Math.round((pa/maxAV)*100),pctV=Math.round((pv/maxAV)*100);
        return `<div style="margin-bottom:10px;">
          <div style="font-size:12px;font-weight:600;color:#1a2e22;margin-bottom:4px;">${ico} ${p}</div>
          <div style="height:7px;background:var(--gray-200);border-radius:999px;overflow:hidden;margin-bottom:3px;">
            <div style="height:100%;background:#60a5fa;border-radius:999px;width:${pctA}%;"></div>
          </div>
          <div style="height:7px;background:var(--gray-200);border-radius:999px;overflow:hidden;">
            <div style="height:100%;background:#4ade80;border-radius:999px;width:${pctV}%;"></div>
          </div>
          <div style="display:flex;justify-content:space-between;font-size:10px;font-weight:600;margin-top:3px;">
            <span style="color:#0369a1;">${fmt(pa)}</span>
            <span style="color:#15803d;">${fmt(pv)}</span>
          </div>
        </div>`;
      }).join("")}
    </div>`;
  }

  // ── SOLDES FOURNISSEURS avec règlements ──
  if(Object.keys(dusFourn).length){
    // Calculer les règlements déjà effectués
    const regParFourn={};
    reglements.forEach(r=>{ regParFourn[r.fournisseur]=(regParFourn[r.fournisseur]||0)+r.montant; });

    html+=`<div style="background:#fef2f2;border:1.5px solid #fecaca;border-radius:16px;padding:14px;margin-bottom:10px;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
        <div style="font-size:9px;font-weight:700;color:#dc2626;text-transform:uppercase;letter-spacing:.1em;">⚠ Soldes fournisseurs à payer</div>
        <button onclick="voirReglements()" style="font-size:10px;font-weight:700;color:#0369a1;background:#eff6ff;border:1px solid #bfdbfe;border-radius:8px;padding:3px 10px;cursor:pointer;font-family:inherit;">📋 Historique</button>
      </div>`;
    Object.entries(dusFourn).forEach(([f,m])=>{
      const regEffectue=regParFourn[f]||0;
      const soldeNet=Math.max(0,m-regEffectue);
      html+=`<div style="padding:8px 0;border-bottom:1px solid #fecaca;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;">
          <span style="color:#0f1f16;font-size:12px;font-weight:600;">${f}</span>
          <div style="text-align:right;">
            <span style="color:#dc2626;font-weight:700;font-size:12px;">${fmt(soldeNet)}</span>
            ${regEffectue>0?`<div style="font-size:10px;color:#15803d;">Payé : ${fmt(regEffectue)}</div>`:""}
          </div>
        </div>
        ${soldeNet>0&&isAdmin?`<button onclick="payerFournisseur('${f}',${soldeNet})" style="font-size:10px;font-weight:700;color:#15803d;background:#f0fdf4;border:1px solid #bbf7d0;border-radius:8px;padding:3px 10px;cursor:pointer;font-family:inherit;width:100%;">✓ Marquer un paiement</button>`:""}
      </div>`;
    });
    html+=`</div>`;
  }

  document.getElementById("page-dashboard").innerHTML=html;
}

      <option value="">📅 Tous les mois</option>
      ${moisDispos.map(m=>`<option value="${m}" ${filtreAchatDate===m?"selected":""}>${m}</option>`).join("")}
    </select>
    <select onchange="filtreAchatProduit=this.value;renderAchats()" style="flex:1;min-width:120px;padding:7px 10px;border-radius:10px;border:1.5px solid var(--gray-200);font-family:inherit;font-size:12px;background:#fff;color:#0f1f16;">
      <option value="">🌿 Tous les produits</option>
      ${prodsDispos.map(p=>`<option value="${p}" ${filtreAchatProduit===p?"selected":""}>${p}</option>`).join("")}
    </select>
    <input type="text" value="${filtreAchatFourn}" placeholder="🔍 Fournisseur..." oninput="filtreAchatFourn=this.value;renderAchats()" style="flex:1;min-width:120px;padding:7px 10px;border-radius:10px;border:1.5px solid var(--gray-200);font-family:inherit;font-size:12px;"/>

            <span style="font-size:18px;">${getProduitIcon(a.produit)||"🌿"}</span>

          <div style="display:flex;flex-wrap:wrap;gap:10px;font-size:11px;">
            <span style="color:#3d5c48;">${a.quantite} × ${fmt(a.prix_unitaire)}</span>
            <span style="color:#0f1f16;font-weight:600;">${fmt(total)}</span>
            ${solde>0?`<span style="color:#dc2626;font-weight:700;">Dû : ${fmt(solde)}</span>`:solde===0?`<span style="color:#15803d;font-weight:700;">✓ Soldé</span>`:""}
          </div>
          ${a.notes?`<div style="font-size:11px;color:var(--gray-500);font-style:italic;margin-top:4px;">${a.notes}</div>`:""}
        </div>
        <div style="display:flex;flex-direction:column;gap:6px;">
          ${a.statut==="en_cours" && currentUser?`<button onclick="marquerRecu('${a.id}')" class="icon-btn-green" title="Accuser réception">✓ Reçu</button>`:""}
          ${isAdmin&&!hasPending?`<button onclick="demandeModifAchat('${a.id}')" class="icon-btn-orange" title="Modifier">✏️</button>`:""}
          ${isAdmin&&!hasPending?`<button onclick="demandeSupprAchat('${a.id}')" class="icon-btn" title="Supprimer">🗑</button>`:""}
        </div>
      </div>
    </div>`;
  });
  document.getElementById("page-achats").innerHTML=html;
}

  </div>

    const hasPending=demandes.some(d=>d.enregistrement_id===v.id&&d.statut==="en_attente");

        <div style="flex:1;min-width:0;">

// MOTEUR FIFO — Valorisation et suivi des stocks lot par lot
// ════════════════════════════════════════════════════════════════════════════

/**
 * Calcule l'état FIFO d'un produit.
 * Retourne les lots dans l'ordre chronologique avec leur consommation.
 *
 * Algorithme :
 * 1. Trier les lots reçus par date (plus ancien en premier)
 * 2. Consommer les ventes lot par lot dans l'ordre
 * 3. Chaque lot a : qteInitiale, qteConsommée, qteRestante, statut
 */
function calculerFIFO(produit) {
  // Lots reçus triés par date (FIFO = premier entré premier sorti)
  const lots = achats
    .filter(a => a.produit === produit && a.statut === "recu")
    .sort((a, b) => new Date(a.date_reception||a.date) - new Date(b.date_reception||b.date));

  if(!lots.length) return { lots:[], qteTotal:0, qteDispo:0, qteVendue:0, coutFIFO:0, lotsActifs:[] };

  // Total vendu de ce produit
  let qteAVendre = ventes
    .filter(v => v.produit === produit)
    .reduce((s,v) => s+v.quantite, 0);

  // Pertes enregistrées
  const qtePerte = pertes[produit] || 0;
  qteAVendre += qtePerte;

  // Appliquer le FIFO lot par lot
  const lotsAvecEtat = lots.map(lot => {
    const qteInitiale = lot.quantite;
    const consommee = Math.min(qteAVendre, qteInitiale);
    qteAVendre = Math.max(0, qteAVendre - qteInitiale);
    const restante = qteInitiale - consommee;

    let statut;
    if(restante <= 0)          statut = "epuise";
    else if(consommee > 0)     statut = "partiel";
    else                       statut = "intact";

    return {
      ...lot,
      qteInitiale,
      qteConsommee: consommee,
      qteRestante: Math.max(0, restante),
      statut,
      coutUnitaire: lot.prix_unitaire,
      fraisUnitaires: ((lot.droit_terre||0)+(lot.transport||0)+(lot.droit_vente||0)+(lot.charrette||0)) / qteInitiale,
      coutRevient: lot.prix_unitaire + ((lot.droit_terre||0)+(lot.transport||0)+(lot.droit_vente||0)+(lot.charrette||0)) / qteInitiale
    };
  });

  const qteTotalRecu = lots.reduce((s,a) => s+a.quantite, 0);
  const qteTotalDispo = lotsAvecEtat.reduce((s,l) => s+l.qteRestante, 0);
  const qteTotalVendue = lotsAvecEtat.reduce((s,l) => s+l.qteConsommee, 0);

  // Lots actifs = non épuisés (stock disponible)
  const lotsActifs = lotsAvecEtat.filter(l => l.statut !== "epuise");

  // Coût FIFO du stock restant = valeur des lots actifs au prorata
  const coutFIFO = lotsActifs.reduce((s,l) => s+l.qteRestante*l.coutRevient, 0);

  // Prochain lot à consommer (pour info vendeur)
  const prochainLot = lotsActifs[0] || null;

  return {
    lots: lotsAvecEtat,
    lotsActifs,
    prochainLot,
    qteTotal: qteTotalRecu,
    qteDispo: Math.max(0, qteTotalDispo),
    qteVendue: qteTotalVendue,
    coutFIFO,
    nbLots: lots.length,
    nbLotsActifs: lotsActifs.length
  };
}

/**
 * Remplace coutMoyen() pour la marge avec la méthode FIFO.
 * Retourne le coût unitaire FIFO du prochain lot à vendre.
 */
function coutFIFOUnitaire(produit) {
  const fifo = calculerFIFO(produit);
  if(!fifo.prochainLot) return coutMoyen(produit); // fallback
  return fifo.prochainLot.coutRevient;
}

function updatePerteCalc(coutRevient, prixAchat) {
  const qte = parseInt(document.getElementById("cp_qte")?.value)||0;
  const calcDiv = document.getElementById("cp_calcul");
  if(!calcDiv) return;
  if(!qte){ calcDiv.style.display="none"; return; }
  calcDiv.style.display="block";
  const elAchat = document.getElementById("cp_valAchat");
  const elRevient = document.getElementById("cp_valRevient");
  if(elAchat) elAchat.textContent = "−"+fmt(qte*prixAchat);
  if(elRevient) elRevient.textContent = "−"+fmt(qte*coutRevient);
}

async function enregistrerPerteLot(lotId, produit, fournisseur, qteRestante, coutRevient, prixAchat) {
  const qteEl = document.getElementById("cp_qte");
  const noteEl = document.getElementById("cp_note");
  const modeEl = document.querySelector('input[name="cp_valMode"]:checked');
  const msg = document.getElementById("cp_msg");

  const qte = parseInt(qteEl?.value)||0;
  if(!qte || qte<=0){ msg.style.cssText="display:block;color:#dc2626;"; msg.textContent="Saisissez une quantité."; return; }
  if(qte>qteRestante){ msg.style.cssText="display:block;color:#dc2626;"; msg.textContent="Quantité supérieure au stock disponible ("+qteRestante+" u.)"; return; }

  const mode = modeEl?.value || "achat";
  const coutUnitaire = mode==="revient" ? coutRevient : prixAchat;
  const valeurPerte = qte * coutUnitaire;
  const note = noteEl?.value.trim()||"";
  const date = new Date().toISOString().slice(0,10);

  msg.style.cssText="display:block;color:#166534;"; msg.textContent="Enregistrement…";

  try {
    // Enregistrer dans pertes_lots (Supabase)
    const payload = {
      id: genId(),
      lot_id: lotId,
      produit,
      fournisseur,
      qte_perte: qte,
      cout_unitaire: coutUnitaire,
      valeur_perte: valeurPerte,
      mode_valorisation: mode,
      note,
      date,
      constate_par: currentUser?.nom || "Admin"
    };

    // Essayer d'enregistrer dans Supabase (table pertes_lots)
    try {
      await sbInsert("pertes_lots", payload);
    } catch(e) {
      // La table n'existe peut-être pas encore — stocker en local
      console.warn("Table pertes_lots inexistante, stockage local:", e.message);
    }

    // Mettre à jour pertes[] local (total par produit)
    pertesLots.unshift(payload);
    savePertesLots();
    // Incrémenter le compteur de pertes global du produit
    pertes[produit] = (pertes[produit]||0) + qte;
    await updatePerte(produit, pertes[produit]);

    logAdminAction("PERTE_LOT", produit+" · "+qte+"u · "+fmt(valeurPerte)+"F (lot:"+lotId+")");

    showToast("✓ Perte enregistrée : "+qte+" u. · "+fmt(valeurPerte));
    closeModal();
    renderStock();

  } catch(e) {
    msg.style.cssText="display:block;color:#dc2626;"; msg.textContent="Erreur : "+e.message;
  }
}

      +'<input type="text" id="mp_note" value="'+(p.note||"").replace(/"/g,'&quot;')+'" placeholder="Motif de la correction…" '
        +'style="width:100%;padding:10px;border:1.5px solid #e4ede7;border-radius:10px;font-family:inherit;font-size:13px;"/>'
    +'</div>'

    +'<div id="mp_msg" style="display:none;margin-bottom:10px;font-size:12px;font-weight:700;text-align:center;"></div>'
    +'<div style="display:flex;gap:10px;">'
      +'<button onclick="enregistrerModifPerte(\''+perteId+'\')" '
        +'style="flex:1;padding:13px;background:#0d3d1a;color:#fff;border:none;border-radius:12px;font-weight:800;font-size:14px;cursor:pointer;font-family:inherit;">Enregistrer la correction</button>'
      +'<button onclick="closeModal()" style="padding:13px 18px;background:#f1f5f2;border:none;border-radius:12px;cursor:pointer;font-family:inherit;font-weight:600;color:#3d5c48;">Annuler</button>'
    +'</div>'
  );

  setTimeout(()=>{ document.getElementById("mp_qte")?.focus(); }, 150);
}

async function enregistrerModifPerte(perteId) {
  const p = pertesLots.find(x=>x.id===perteId);
  if(!p){ showToast("Perte introuvable","error"); return; }

  const qteEl = document.getElementById("mp_qte");
  const noteEl = document.getElementById("mp_note");
  const modeEl = document.querySelector('input[name="mp_valMode"]:checked');
  const msg = document.getElementById("mp_msg");

  const nouvelleQte = parseInt(qteEl?.value)||0;
  if(nouvelleQte<0){ msg.style.cssText="display:block;color:#dc2626;"; msg.textContent="Quantité invalide."; return; }

  const nouveauMode = modeEl?.value || p.mode_valorisation || "achat";
  // Le coût unitaire d'origine est conservé tel quel quel que soit le mode choisi,
  // sauf si l'admin change explicitement de mode (rare) — on garde simplement
  // le cout_unitaire stocké lors de la constatation initiale.
  const nouveauCoutUnitaire = p.cout_unitaire;
  const nouvelleValeur = nouvelleQte * nouveauCoutUnitaire;

  const ancienneQte = p.qte_perte;

  msg.style.cssText="display:block;color:#166534;"; msg.textContent="Enregistrement…";

  try {
    const updatePayload = {
      qte_perte: nouvelleQte,
      mode_valorisation: nouveauMode,
      valeur_perte: nouvelleValeur,
      note: noteEl?.value.trim() || "",
      modifie_par: currentUser?.nom || "Admin",
      modifie_le: new Date().toISOString().slice(0,10),
    };

    try {
      await sbUpdate("pertes_lots", perteId, updatePayload);
    } catch(e) {
      console.warn("sbUpdate pertes_lots a échoué, mise à jour locale seulement:", e.message);
    }

    // Mettre à jour pertesLots[] local
    Object.assign(p, updatePayload);
    savePertesLots();

    // Recalcul en cascade : ajuster le compteur global pertes[produit] par delta
    const delta = nouvelleQte - ancienneQte;
    if(delta !== 0) {
      pertes[p.produit] = Math.max(0, (pertes[p.produit]||0) + delta);
      await updatePerte(p.produit, pertes[p.produit]);
    }

    logAdminAction("MODIF_PERTE", p.produit+" · "+ancienneQte+"→"+nouvelleQte+"u · "+fmt(nouvelleValeur)+"F (lot:"+p.lot_id+")");

    showToast("✓ Perte corrigée : "+nouvelleQte+" u. · "+fmt(nouvelleValeur));
    closeModal();
    // Recalcul en cascade : stock FIFO, marges, dashboard, commissions —
    // toutes ces vues relisent pertesLots/pertes dynamiquement au render().
    render();
    voirPertesLots();

  } catch(e) {
    msg.style.cssText="display:block;color:#dc2626;"; msg.textContent="Erreur : "+e.message;
  }
}

// OUTIL DE RÉCONCILIATION DE STOCK
// Liste chronologique de tous les mouvements (achats reçus, ventes, pertes)
// d'un produit, avec solde courant. Surligne en rouge dès que le stock devient
// négatif → permet de retrouver l'origine d'une incohérence de saisie.
// ════════════════════════════════════════════════════════════════════════════
function ouvrirReconciliation(produitInit){
  if(!isAdmin){ showToast("Réservé à l'administrateur","error"); return; }
  // Produits ayant au moins un mouvement
  const produitsMvt = [...new Set([
    ...achats.filter(a=>a.statut==="recu").map(a=>a.produit),
    ...ventes.map(v=>v.produit),
    ...pertesLots.map(p=>p.produit)
  ])].filter(Boolean).sort();

  if(!produitsMvt.length){
    showModal('<div style="text-align:center;padding:32px;color:#6b8c7a;font-size:12px;">Aucun mouvement de stock à réconcilier.</div>');
    return;
  }
  const produit = produitInit && produitsMvt.includes(produitInit) ? produitInit : produitsMvt[0];
  renderReconciliation(produit, produitsMvt);
}

function renderReconciliation(produit, produitsMvt){
  // Construire la liste des mouvements datés
  const mvts = [];
  achats.filter(a=>a.produit===produit && a.statut==="recu").forEach(a=>{
    mvts.push({
      date: (a.date_reception||a.date||"").slice(0,10),
      type:"achat", sens:+1, qte:a.quantite,
      libelle:"Achat reçu — "+(a.fournisseur||"?"),
      ref:a.numero_document||"",
      enregistre: a.enregistre_par||a.auteur||""
    });
  });
  ventes.filter(v=>v.produit===produit).forEach(v=>{
    mvts.push({
      date:(v.date||"").slice(0,10),
      type:"vente", sens:-1, qte:v.quantite,
      libelle:"Vente"+(v.client?" — "+v.client:""),
      ref:v.numero_document||"",
      enregistre: v.enregistre_par||v.auteur||""
    });
  });
  pertesLots.filter(p=>p.produit===produit).forEach(p=>{
    mvts.push({
      date:(p.date||"").slice(0,10),
      type:"perte", sens:-1, qte:p.qte_perte,
      libelle:"Perte"+(p.note?" — "+p.note:""),
      ref:"", enregistre:p.constate_par||""
    });
  });

  // Tri chronologique ; à date égale, achats d'abord (entrées avant sorties)
  mvts.sort((a,b)=>{
    const d = (a.date||"").localeCompare(b.date||"");
    if(d!==0) return d;
    return (b.sens) - (a.sens); // +1 (achat) avant -1
  });

  // Calcul du solde courant + repérage du premier passage négatif
  let solde = 0;
  let premierNegatifIdx = -1;
  const lignesData = mvts.map((m,i)=>{
    solde += m.sens * m.qte;
    if(solde<0 && premierNegatifIdx===-1) premierNegatifIdx = i;
    return {...m, soldeApres: solde};
  });

  const totalAchat = mvts.filter(m=>m.type==="achat").reduce((s,m)=>s+m.qte,0);
  const totalVente = mvts.filter(m=>m.type==="vente").reduce((s,m)=>s+m.qte,0);
  const totalPerte = mvts.filter(m=>m.type==="perte").reduce((s,m)=>s+m.qte,0);
  const ecartFinal = totalAchat - totalVente - totalPerte;

  const couleurType = {achat:"#166534", vente:"#0369a1", perte:"#dc2626"};
  const signeType = {achat:"+", vente:"−", perte:"−"};

  const lignesHtml = lignesData.map((m,i)=>{
    const estNegatif = m.soldeApres<0;
    const estPremierNeg = i===premierNegatifIdx;
    return '<tr style="border-bottom:1px solid #f1f5f2;font-size:11px;'
      +(estPremierNeg?'background:#fef2f2;':'')+'">'
      +'<td style="padding:6px 4px;color:#6b8c7a;white-space:nowrap;">'+(m.date||"—")+'</td>'
      +'<td style="padding:6px 4px;"><span style="font-weight:700;color:'+couleurType[m.type]+';">'+m.libelle+'</span>'
        +(m.ref?'<span style="font-size:9px;color:#9ca3af;"> ('+m.ref+')</span>':'')
        +(m.enregistre?'<div style="font-size:9px;color:#9ca3af;">'+m.enregistre+'</div>':'')+'</td>'
      +'<td style="padding:6px 4px;text-align:right;font-weight:700;color:'+couleurType[m.type]+';white-space:nowrap;">'+signeType[m.type]+m.qte+'</td>'
      +'<td style="padding:6px 4px;text-align:right;font-weight:900;color:'+(estNegatif?'#dc2626':'#0f1f16')+';white-space:nowrap;">'+m.soldeApres
        +(estPremierNeg?' ⚠':'')+'</td>'
    +'</tr>';
  }).join('');

  const selecteur = produitsMvt.map(p=>
    '<option value="'+p+'"'+(p===produit?' selected':'')+'>'+(getProduitIcon(p)||"🌿")+' '+p+'</option>'
  ).join('');

  showModal(
    '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">'
    +'<div><div style="font-size:16px;font-weight:800;color:#0f1f16;">🔍 Réconciliation de stock</div>'
    +'<div style="font-size:11px;color:#6b8c7a;">Suivez le solde mouvement par mouvement</div></div>'
    +'<button onclick="closeModal()" style="background:#f1f5f2;border:none;border-radius:999px;width:32px;height:32px;cursor:pointer;font-size:16px;">✕</button>'
    +'</div>'

    // Sélecteur de produit
    +'<select onchange="renderReconciliation(this.value, '
      +JSON.stringify(produitsMvt).replace(/"/g,'&quot;')+')" '
      +'style="width:100%;padding:10px;border:1.5px solid #e4ede7;border-radius:10px;font-family:inherit;font-size:13px;background:#fff;margin-bottom:12px;">'
      +selecteur+'</select>'

    // Synthèse
    +'<div style="display:flex;gap:6px;margin-bottom:12px;">'
      +'<div style="flex:1;background:#f0fdf4;border-radius:8px;padding:8px;text-align:center;"><div style="font-weight:900;color:#166534;font-size:14px;">+'+totalAchat+'</div><div style="font-size:9px;color:#6b8c7a;">Achats</div></div>'
      +'<div style="flex:1;background:#eff6ff;border-radius:8px;padding:8px;text-align:center;"><div style="font-weight:900;color:#0369a1;font-size:14px;">−'+totalVente+'</div><div style="font-size:9px;color:#6b8c7a;">Ventes</div></div>'
      +'<div style="flex:1;background:#fef2f2;border-radius:8px;padding:8px;text-align:center;"><div style="font-weight:900;color:#dc2626;font-size:14px;">−'+totalPerte+'</div><div style="font-size:9px;color:#6b8c7a;">Pertes</div></div>'
      +'<div style="flex:1;background:'+(ecartFinal<0?'#fef2f2':'#f0fdf4')+';border-radius:8px;padding:8px;text-align:center;"><div style="font-weight:900;color:'+(ecartFinal<0?'#dc2626':'#166534')+';font-size:14px;">'+ecartFinal+'</div><div style="font-size:9px;color:#6b8c7a;">Stock</div></div>'
    +'</div>'

    // Message de diagnostic
    +(premierNegatifIdx>=0
      ? '<div style="background:#fef2f2;border:1.5px solid #fecaca;border-radius:10px;padding:10px 12px;margin-bottom:12px;font-size:11px;color:#3d5c48;">'
        +'<span style="font-weight:800;color:#dc2626;">⚠ Première incohérence le '+(lignesData[premierNegatifIdx].date||"?")+'.</span> '
        +'À ce mouvement, le stock devient négatif ('+lignesData[premierNegatifIdx].soldeApres+'). '
        +'Cela signifie qu\'une sortie (vente/perte) a été enregistrée sans entrée (achat) correspondante avant cette date. '
        +'Vérifiez : un achat reçu oublié avant cette date, ou une vente/perte saisie en trop ou en double.'
      +'</div>'
      : '<div style="background:#f0fdf4;border:1.5px solid #bbf7d0;border-radius:10px;padding:10px 12px;margin-bottom:12px;font-size:11px;color:#166534;font-weight:700;">✓ Aucune incohérence : le stock reste positif sur toute la période.</div>')

    // Tableau chronologique
    +'<div style="overflow-y:auto;max-height:45vh;">'
    +'<table style="width:100%;border-collapse:collapse;">'
      +'<thead><tr style="font-size:9px;color:#6b8c7a;text-transform:uppercase;border-bottom:2px solid #e4ede7;position:sticky;top:0;background:#fff;">'
        +'<th style="padding:6px 4px;text-align:left;">Date</th>'
        +'<th style="padding:6px 4px;text-align:left;">Mouvement</th>'
        +'<th style="padding:6px 4px;text-align:right;">Qté</th>'
        +'<th style="padding:6px 4px;text-align:right;">Solde</th></tr></thead>'
      +'<tbody>'+lignesHtml+'</tbody>'
    +'</table></div>'
    +'<div style="font-size:9px;color:#9ca3af;margin-top:8px;">À date égale, les achats (entrées) sont comptés avant les ventes/pertes (sorties).</div>'
  );
}

function renderStock(){
  const produitsListe=[...new Set(achats.filter(a=>a.statut==="recu").map(a=>a.produit))];
  const pageEl = document.getElementById("page-stock");
  if(!produitsListe.length){
    pageEl.innerHTML='<div style="text-align:center;padding:40px 0;color:#3d5c48;font-size:13px;">Aucun stock reçu.<br><span style="font-size:11px;">Marque tes achats comme reçus d\'abord.</span></div>';
    return;
  }

  // ── Alertes stock bas ──
  const alertes=[];
  produitsListe.forEach(p=>{
    const f=calculerFIFO(p);
    const seuil=seuilsStock[p]||0;
    if(f.qteDispo<0) alertes.push({p,d:f.qteDispo,seuil,negatif:true});
    else if(seuil>0&&f.qteDispo<=seuil) alertes.push({p,d:f.qteDispo,seuil});
  });

  let html="";
  if(alertes.length){
    html+='<div style="background:#fef2f2;border:1.5px solid #fecaca;border-radius:14px;padding:12px 16px;margin-bottom:14px;">'
      +'<div style="font-size:11px;font-weight:700;color:#dc2626;margin-bottom:8px;">⚠ Alertes stock bas</div>'
      +alertes.map(a=>'<div style="display:flex;align-items:center;gap:8px;margin-bottom:4px;">'
        +'<span style="font-size:14px;">'+(getProduitIcon(a.p)||"🌿")+'</span>'
        +'<span style="font-size:12px;color:#0f1f16;font-weight:600;">'+a.p+'</span>'
        +'<span style="font-size:12px;color:#dc2626;">'+(a.negatif?"Stock négatif ("+a.d+")":"Stock bas : "+a.d+" / seuil "+a.seuil)+'</span>'
      +'</div>').join("")
    +'</div>';

  // ── En-tête ──

    +'<div>'
      +'<div style="font-size:13px;font-weight:800;color:#0f1f16;">📦 Stock FIFO</div>'

    +'<div style="background:linear-gradient(135deg,#1e3a5f,#1a2e4a);border-radius:12px;padding:12px;text-align:center;">'

function selectIcon(ico){
  document.getElementById("np_icone").value=ico;
  document.getElementById("np_iconPreview").textContent=ico;
  document.querySelectorAll("#iconPicker button").forEach(b=>b.style.borderColor="transparent");
  const id="ico_"+ico.codePointAt(0);
  const btn=document.getElementById(id);
  if(btn) btn.style.borderColor="#84cc16";
}

async function saveProduit(){
  const nom=document.getElementById("np_nom").value.trim();
  const icone=document.getElementById("np_icone").value||"🌿";
  if(!nom) return showToast("Entre un nom de produit","error");
  if(produits.find(p=>p.nom.toLowerCase()===nom.toLowerCase()))
    return showToast("Ce produit existe déjà","error");
  const payload={id:genId(),nom,icone,actif:true};
  try{
    await sbInsert("produits",payload);
    produits.push(payload); saveLocal();
    closeModal(); renderListeProduits();
    showToast("✓ Produit ajouté");
  }catch(e){showToast("Erreur : "+e.message,"error");}
}

async function toggleProduitActif(id,actif){
  try{
    await sbUpdate("produits",id,{actif:!actif});
    produits=produits.map(p=>p.id===id?{...p,actif:!actif}:p);
    saveLocal(); renderListeProduits();
    showToast(actif?"Produit désactivé":"Produit activé");
  }catch(e){showToast("Erreur : "+e.message,"error");}
}

async function supprimerProduit(id){
  const p=produits.find(x=>x.id===id);
  if(!confirm(`Supprimer "${p?.nom}" ?`)) return;
  try{
    await sbDelete("produits",id);
    produits=produits.filter(x=>x.id!==id);
    saveLocal(); renderListeProduits();
    showToast("Produit supprimé");
  }catch(e){showToast("Erreur : "+e.message,"error");}
}

const SB_STORAGE_PUBLIC = SB_URL+"/storage/v1/object/public/chat-images";

// ── Supabase helpers chat ─────────────────────────────────────────────────────
async function sbGetMessages(since) {
  let url = "/rest/v1/messages?order=created_at.asc&limit=200";
  if (since) url += "&created_at=gt."+encodeURIComponent(since);
  const r = await sbFetch(url);
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}

async function sbSendMessage(payload) {
  const r = await sbFetch("/rest/v1/messages", { method:"POST", body:JSON.stringify(payload) });
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}

async function sbDeleteMessage(id) {
  const r = await sbFetch("/rest/v1/messages?id=eq."+id, { method:"DELETE" });
  if (!r.ok) throw new Error(await r.text());
}

async function sbReactMessage(id, reactions) {
  const r = await sbFetch("/rest/v1/messages?id=eq."+id, { method:"PATCH", body:JSON.stringify({reactions}) });
  if (!r.ok) throw new Error(await r.text());
}

async function uploadChatImage(file) {
  const ext = file.name.split(".").pop().toLowerCase();
  const path = genId()+"."+ext;
  const h = sbStorageHeaders(file.type);
  const r = await fetch(SB_STORAGE+"/"+path, { method:"POST", headers:h, body:file });
  if (!r.ok) throw new Error(await r.text());
  return SB_STORAGE_PUBLIC+"/"+path;
}

            '<button onclick="insertEmoji(\''+e+'\')" style="background:none;border:none;cursor:pointer;font-size:20px;padding:2px 4px;border-radius:6px;transition:background .15s;" onmouseover="this.style.background=\'#f0fdf4\'" onmouseout="this.style.background=\'none\'">'+e+'</button>'

    if (currentTab === "chat") loadMessages(false);
  }, 8000);
}

// ── Chargement messages ───────────────────────────────────────────────────────
async function loadMessages(full) {
  try {
    const since = (!full && chatLastId && chatMessages.length) ? chatMessages[chatMessages.length-1].created_at : null;
    const msgs = await sbGetMessages(since);

    if (full) {
      chatMessages = msgs;
    } else {
      if (msgs.length) {
        const newMsgs = msgs.filter(m => !chatMessages.find(x => x.id === m.id));
        if (newMsgs.length) {
          chatMessages.push(...newMsgs);
          // Badge si pas sur le chat
          if (currentTab !== "chat") {
            chatUnreadCount += newMsgs.filter(m => m.auteur !== chatAuteur).length;
            updateChatBadge(chatUnreadCount);
          }
        } else return; // rien de nouveau
      } else return;
    }

    renderMessages();
  } catch(e) {
    const el = document.getElementById("chatMessages");
    if (el) el.innerHTML = '<div style="text-align:center;color:#dc2626;font-size:12px;padding:20px;">Erreur : '+e.message+'</div>';
  }
}

// ── Rendu messages ────────────────────────────────────────────────────────────
function renderMessages(filterText) {
  const el = document.getElementById("chatMessages");
  if (!el) return;

  const msgs = filterText
    ? chatMessages.filter(m => (m.contenu||"").toLowerCase().includes(filterText.toLowerCase()) || (m.auteur||"").toLowerCase().includes(filterText.toLowerCase()))
    : chatMessages;

  if (!msgs.length) {
    el.innerHTML = filterText
      ? '<div style="text-align:center;color:#6b8c7a;font-size:12px;padding:30px;">Aucun résultat pour "'+filterText+'"</div>'
      : '<div style="text-align:center;padding:40px 20px;"><div style="font-size:40px;margin-bottom:12px;">💬</div><div style="color:#6b8c7a;font-size:13px;">Aucun message.<br>Sois le premier à écrire !</div></div>';
    return;
  }

  let html = "";
  let lastDate = "";
  let lastAuteur = "";

  // Regrouper les membres actifs
  const membres = [...new Set(chatMessages.map(m => m.auteur))];

  msgs.forEach(m => {
    const isMe = m.auteur === chatAuteur;
    const d = new Date(m.created_at);
    const dateStr = d.toLocaleDateString("fr-CI",{day:"numeric",month:"long"});
    const timeStr = d.toLocaleTimeString("fr-CI",{hour:"2-digit",minute:"2-digit"});
    const isGrouped = lastAuteur === m.auteur && lastDate === dateStr;

    // Séparateur de date
    if (dateStr !== lastDate) {
      const isToday = dateStr === new Date().toLocaleDateString("fr-CI",{day:"numeric",month:"long"});
      html += '<div style="text-align:center;margin:12px 0 8px;"><span style="background:#e2ece7;color:#3d5c48;font-size:10px;font-weight:700;padding:4px 14px;border-radius:999px;">'+(isToday?"Aujourd'hui":dateStr)+'</span></div>';
      lastDate = dateStr;
    }
    lastAuteur = m.auteur;

    const reactions = m.reactions ? JSON.parse(m.reactions) : {};
    const reactHtml = Object.entries(reactions).filter(([,v])=>v>0).map(([k,v])=>
      '<button onclick="toggleReaction(\''+m.id+'\',\''+k+'\')" style="background:#f0fdf4;border:1px solid #bbf7d0;border-radius:999px;padding:2px 8px;cursor:pointer;font-size:12px;margin-right:3px;font-family:inherit;">'+k+' '+v+'</button>'
    ).join("");

    const replyHtml = m.reply_to ? (()=>{
      const orig = chatMessages.find(x=>x.id===m.reply_to);
      if (!orig) return "";
      return '<div style="background:rgba(0,0,0,.06);border-left:2px solid rgba(0,0,0,.2);border-radius:6px;padding:4px 8px;margin-bottom:4px;font-size:10px;opacity:.75;cursor:pointer;" onclick="scrollToMsg(\''+orig.id+'\')">↩ '+orig.auteur+' : '+(orig.contenu||"[image]").slice(0,50)+'</div>';
    })() : "";

    // Avatar couleur par auteur
    const avatarColors = ["#f47820","#0369a1","#166534","#7c3aed","#dc2626","#0891b2","#65a30d"];
    const avatarColor = avatarColors[membres.indexOf(m.auteur) % avatarColors.length];

    const deleteBtn = (isMe || isAdmin) ? '<button onclick="supprimerMsg(\''+m.id+'\')" style="background:none;border:none;cursor:pointer;font-size:10px;color:#dc2626;opacity:.5;padding:0 2px;margin-left:2px;" title="Supprimer">🗑</button>' : "";
    const replyBtn = '<button onclick="setReply(\''+m.id+'\',\''+escAttr(m.auteur)+'\',\''+escAttr((m.contenu||"[image]").slice(0,40))+'\')" style="background:none;border:none;cursor:pointer;font-size:10px;color:#0369a1;opacity:.6;padding:0 2px;" title="Répondre">↩</button>';
    const reactBtn = '<button onclick="showReactionPicker(\''+m.id+'\')" style="background:none;border:none;cursor:pointer;font-size:10px;opacity:.5;padding:0 2px;" title="Réagir">😊</button>';

    const isMention = !isMe && m.contenu && m.contenu.includes("@"+chatAuteur);
    const bg = isMe ? "linear-gradient(135deg,#0d3d1a,#166534)" : isMention ? "#fffbeb" : "#fff";
    const txtCol = isMe ? "#fff" : "#0f1f16";
    const shadow = isMe ? "0 2px 8px rgba(13,61,26,.2)" : isMention ? "0 2px 8px rgba(244,120,32,.1)" : "0 1px 4px rgba(0,0,0,.06)";
    const mentionBorder = isMention ? "border-left:3px solid #f47820;" : "";

    html += '<div id="msg-'+m.id+'" style="display:flex;justify-content:'+(isMe?"flex-end":"flex-start")+';margin-bottom:'+(isGrouped?"2px":"8px")+';">';

    // Avatar (côté gauche, seulement si pas groupé)
    if (!isMe) {
      html += '<div style="width:30px;margin-right:8px;flex-shrink:0;margin-top:auto;">';
      if (!isGrouped) {
        html += '<div style="width:30px;height:30px;background:'+avatarColor+';border-radius:999px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:900;color:#fff;">'+m.auteur.charAt(0).toUpperCase()+'</div>';
      }
      html += '</div>';
    }

    html += '<div style="max-width:78%;min-width:60px;">';
    if (!isMe && !isGrouped) html += '<div style="font-size:10px;font-weight:700;color:'+avatarColor+';margin-bottom:3px;padding-left:2px;">'+m.auteur+'</div>';

    html += '<div style="background:'+bg+';border-radius:'+(isMe?"14px 2px 14px 14px":"2px 14px 14px 14px")+';padding:'+(m.image_url&&!m.contenu?"4px":"9px 12px")+';box-shadow:'+shadow+';'+mentionBorder+'">';
    if (replyHtml) html += replyHtml;
    if (m.image_url) html += '<img src="'+m.image_url+'" style="max-width:220px;max-height:220px;border-radius:8px;display:block;cursor:pointer;" onclick="window.open(\''+m.image_url+'\',\'_blank\')"/>';
    if (m.contenu) {
      // Mettre en évidence les mentions
      const highlighted = m.contenu.replace(/@(\w+)/g, '<span style="background:rgba(244,120,32,.15);color:'+( isMe?"#fbbf24":"#c2410c")+';font-weight:700;border-radius:4px;padding:0 3px;">@$1</span>');
      html += '<div style="color:'+txtCol+';font-size:13px;line-height:1.5;'+(m.image_url?"margin-top:6px;":"")+'word-break:break-word;">'+highlighted+'</div>';
    }
    html += '<div style="display:flex;align-items:center;gap:2px;margin-top:3px;justify-content:flex-end;">';
    html += '<span style="font-size:9px;color:'+(isMe?"rgba(255,255,255,.55)":"#9cb8a8")+';margin-right:2px;">'+timeStr+'</span>';
    html += reactBtn+replyBtn+deleteBtn;
    html += '</div></div>';

    if (reactHtml) html += '<div style="margin-top:4px;padding:0 4px;">'+reactHtml+'</div>';
    html += '</div></div>';
  });

  const wasAtBottom = el.scrollHeight - el.scrollTop - el.clientHeight < 80;
  el.innerHTML = html;
  if (wasAtBottom || filterText === undefined) {
    requestAnimationFrame(() => { el.scrollTop = el.scrollHeight; });
  }
}

function escAttr(s) {
  return String(s||"").replace(/'/g,"&#x27;").replace(/"/g,"&quot;");
}

// ── Envoi message ─────────────────────────────────────────────────────────────
async function envoyerMessage() {
  const ta = document.getElementById("chatTexte");
  const texte = ta?.value.trim();
  if (!texte && !chatImageFile) return;
  if (!chatAuteur) return showToast("Entre ton prénom d'abord","error");

  const btn = document.getElementById("chatSendBtn");
  btn.disabled = true;
  btn.style.transform = "scale(.9)";

  try {
    let imageUrl = null;
    if (chatImageFile) {
      imageUrl = await uploadChatImage(chatImageFile);
      clearChatImg();
    }
    const payload = {
      id: genId(),
      auteur: chatAuteur,
      contenu: texte || null,
      image_url: imageUrl || null,
      reply_to: chatReplyTo ? chatReplyTo.id : null,
      reactions: null
    };
    const res = await sbSendMessage(payload);
    const msg = Array.isArray(res) ? res[0] : res;
    if (msg) chatMessages.push(msg);
    ta.value = "";
    ta.style.height = "38px";
    cancelReply();
    renderMessages();
  } catch(e) { showToast("Erreur : "+e.message,"error"); }

  btn.disabled = false;
  btn.style.transform = "";
}

// ── Réponse à un message ──────────────────────────────────────────────────────
function setReply(id, auteur, contenu) {
  chatReplyTo = {id, auteur, contenu};
  const preview = document.getElementById("chatReplyPreview");
  if (preview) {
    preview.style.display = "flex";
    document.getElementById("chatReplyText").textContent = "↩ "+auteur+" : "+contenu;
    document.getElementById("chatTexte")?.focus();
  }
}
function cancelReply() {
  chatReplyTo = null;
  const el = document.getElementById("chatReplyPreview");
  if (el) el.style.display = "none";
}

// ── Réactions emoji ───────────────────────────────────────────────────────────
function showReactionPicker(msgId) {
  const emojis = ["👍","❤️","😂","😮","😢","🙏","✅","🔥"];
  showModal(
    '<div style="font-size:14px;font-weight:700;color:#0f1f16;margin-bottom:12px;">Réagir au message</div>'+
    '<div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center;">'+
    emojis.map(e=>'<button onclick="toggleReaction(\''+msgId+'\',\''+e+'\');closeModal();" style="font-size:28px;background:#f0f5f1;border:1.5px solid #d4edda;border-radius:12px;padding:8px 14px;cursor:pointer;transition:transform .15s;" onmouseover="this.style.transform=\'scale(1.2)\'" onmouseout="this.style.transform=\'\'">'+e+'</button>').join("")+
    '</div>'
  );
}

async function toggleReaction(msgId, emoji) {
  const msg = chatMessages.find(m => m.id === msgId);
  if (!msg) return;
  const reactions = msg.reactions ? JSON.parse(msg.reactions) : {};
  reactions[emoji] = (reactions[emoji] || 0) + 1;
  msg.reactions = JSON.stringify(reactions);
  renderMessages();
  try { await sbReactMessage(msgId, msg.reactions); } catch(e) { /* pas bloquant */ }
}

// ── Scroll vers message ───────────────────────────────────────────────────────
function scrollToMsg(id) {
  const el = document.getElementById("msg-"+id);
  if (el) { el.scrollIntoView({behavior:"smooth",block:"center"}); el.style.background="#fffbeb"; setTimeout(()=>{el.style.background="";},2000); }
}

// ── Recherche ─────────────────────────────────────────────────────────────────
function chatSearchMode() {
  const bar = document.getElementById("chatSearchBar");
  if (!bar) return;
  const visible = bar.style.display !== "none";
  bar.style.display = visible ? "none" : "block";
  if (!visible) document.getElementById("chatSearchInput")?.focus();
  else { renderMessages(); }
}
function chatSearch(val) {
  renderMessages(val || undefined);
}

// ── Membres actifs ────────────────────────────────────────────────────────────
function chatShowMembers() {
  const membres = [...new Set(chatMessages.map(m => m.auteur))];
  const avatarColors = ["#f47820","#0369a1","#166534","#7c3aed","#dc2626","#0891b2","#65a30d"];
  showModal(
    '<div style="font-size:17px;font-weight:800;color:#0f1f16;margin-bottom:16px;">👥 Membres actifs ('+membres.length+')</div>'+
    members_html(membres, avatarColors)+
    '<button onclick="closeModal()" style="width:100%;margin-top:16px;padding:12px;background:#f0f5f1;border:none;border-radius:12px;cursor:pointer;font-family:inherit;font-weight:600;color:#3d5c48;">Fermer</button>'
  );
}
function members_html(membres, colors) {
  return '<div style="display:flex;flex-direction:column;gap:8px;">'+
    membres.map((m,i) => {
      const count = chatMessages.filter(x=>x.auteur===m).length;
      const last = chatMessages.filter(x=>x.auteur===m).pop();
      const lastTime = last ? new Date(last.created_at).toLocaleDateString("fr-CI",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}) : "";
      const isCurrentUser = m === chatAuteur;
      return '<div style="display:flex;align-items:center;gap:12px;padding:10px;background:#f8faf8;border-radius:12px;">'+
        '<div style="width:40px;height:40px;background:'+colors[i%colors.length]+';border-radius:999px;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:900;color:#fff;flex-shrink:0;">'+m.charAt(0).toUpperCase()+'</div>'+
        '<div style="flex:1;"><div style="font-weight:700;color:#0f1f16;font-size:13px;">'+m+(isCurrentUser?' <span style="font-size:10px;background:#f0fdf4;color:#166534;padding:2px 8px;border-radius:999px;font-weight:700;">Vous</span>':'')+
        '</div><div style="font-size:11px;color:#6b8c7a;">'+count+' message'+(count>1?'s':'')+(lastTime?' · '+lastTime:'')+'</div></div></div>';
    }).join('')+
  '</div>';
}

// ── Emoji panel ───────────────────────────────────────────────────────────────
function toggleEmojiPanel() {
  const p = document.getElementById("emojiPanel");
  if (!p) return;
  p.style.display = p.style.display === "none" ? "flex" : "none";
}
function insertEmoji(e) {
  const ta = document.getElementById("chatTexte");
  if (!ta) return;
  const pos = ta.selectionStart;
  ta.value = ta.value.slice(0,pos)+e+ta.value.slice(pos);
  ta.selectionStart = ta.selectionEnd = pos+e.length;
  ta.focus();
}

// ── Raccourcis rapides ────────────────────────────────────────────────────────
function insertQuick(text) {
  const ta = document.getElementById("chatTexte");
  if (!ta) return;
  ta.value = text+" ";
  ta.focus();
  chatOnInput(ta);
}

// ── Saisie dynamique ──────────────────────────────────────────────────────────
function chatOnInput(el) {
  autoResize(el);
  // Autocomplete mention @
  const val = el.value;
  const lastAt = val.lastIndexOf("@");
  if (lastAt >= 0) {
    const query = val.slice(lastAt+1).toLowerCase();
    const membres = [...new Set(chatMessages.map(m=>m.auteur))].filter(m=>m!==chatAuteur);
    const matches = membres.filter(m=>m.toLowerCase().startsWith(query));
    showMentionSuggestions(matches, lastAt, el);
  } else {
    closeMentionSuggestions();
  }
}

let mentionStart = -1;
function showMentionSuggestions(matches, atPos, ta) {
  let el = document.getElementById("mentionSuggestions");
  if (!matches.length) { if (el) el.style.display="none"; return; }
  if (!el) {
    el = document.createElement("div");
    el.id = "mentionSuggestions";
    el.style.cssText = "position:absolute;background:#fff;border:1.5px solid #e2ece7;border-radius:10px;box-shadow:0 4px 16px rgba(0,0,0,.1);z-index:999;max-height:120px;overflow-y:auto;";
    document.getElementById("chatWrap")?.appendChild(el);
  }
  mentionStart = atPos;
  el.innerHTML = matches.map(m=>'<div onclick="completeMention(\''+m+'\')" style="padding:8px 14px;cursor:pointer;font-size:13px;font-weight:600;color:#0f1f16;" onmouseover="this.style.background=\'#f0fdf4\'" onmouseout="this.style.background=\'\'">@'+m+'</div>').join("");
  el.style.display = "block";
}
function closeMentionSuggestions() {
  const el = document.getElementById("mentionSuggestions");
  if (el) el.style.display="none";
}
function completeMention(nom) {
  const ta = document.getElementById("chatTexte");
  if (!ta || mentionStart < 0) return;
  const before = ta.value.slice(0, mentionStart);
  const after = ta.value.slice(ta.selectionStart);
  ta.value = before+"@"+nom+" "+after;
  ta.focus();
  closeMentionSuggestions();
}

// ── Suppression message ───────────────────────────────────────────────────────
async function supprimerMsg(id) {
  if (!confirm("Supprimer ce message ?")) return;
  try {
    await sbDeleteMessage(id);
    chatMessages = chatMessages.filter(m => m.id !== id);
    renderMessages();
    showToast("Message supprimé");
  } catch(e) { showToast("Erreur : "+e.message,"error"); }
}

// ── Helpers ───────────────────────────────────────────────────────────────────
function previewChatImg(input) {
  const file = input.files[0];
  if (!file) return;
  chatImageFile = file;
  const url = URL.createObjectURL(file);
  const prev = document.getElementById("chatImgPreview");
  const img = document.getElementById("chatImgPreviewSrc");
  if (prev && img) { img.src = url; prev.style.display = "block"; }
}
function clearChatImg() {
  chatImageFile = null;
  const inp = document.getElementById("chatImgInput");
  const prev = document.getElementById("chatImgPreview");
  if (inp) inp.value = "";
  if (prev) prev.style.display = "none";
}
function setChatNom() {
  const val = document.getElementById("chatNomInput")?.value.trim();
  if (!val) return showToast("Entre un prénom","error");
  chatAuteur = val;
  localStorage.setItem("va_chat_nom", val);
  initChat();
}
function changerNom() {
  if (!confirm("Changer de prénom ? Tes anciens messages garderont l'ancien nom.")) return;
  chatAuteur = "";
  localStorage.removeItem("va_chat_nom");
  if (chatPolling) { clearInterval(chatPolling); chatPolling = null; }
  initChat();
}
function chatKeydown(e) {
  if (e.key==="Enter"&&!e.shiftKey) { e.preventDefault(); envoyerMessage(); }
  if (e.key==="Escape") { cancelReply(); closeMentionSuggestions(); }
}
function autoResize(el) {
  el.style.height = "38px";
  el.style.height = Math.min(el.scrollHeight,120)+"px";
}
function saveWaLink() {

function downloadCSV(filename, rows, headers){
  const escape = v => {
    if(v===null||v===undefined) return "";
    const s = String(v);
    return s.includes(",") || s.includes('"') || s.includes("\n") ? `"${s.replace(/"/g,'""')}"` : s;
  };
  const lines = [headers.map(escape).join(","), ...rows.map(r=>r.map(escape).join(","))];
  const blob = new Blob(["﻿"+lines.join("\n")], {type:"text/csv;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
  URL.revokeObjectURL(a.href);
}

 * "Compte de résultat" du bilan.

/**
 * Interprète une valeur numérique selon une grille de seuils décroissante.
 * @param {number} valeur
 * @param {Array} grille - [{min, label, color}], du meilleur au pire,
 *   évaluée par valeur >= min. Pour les ratios "plus c'est bas, mieux c'est"
 *   (ex. taux de perte), passer inverse=true et une grille en max.
 * @param {boolean} inverse - si true, compare valeur <= max
 */
function interpreterRatio(valeur, grille, inverse){
  for(const niveau of grille){
    if(inverse ? valeur <= niveau.seuil : valeur >= niveau.seuil){
      return niveau;
    }
  }
  return grille[grille.length-1];
}

async function enregistrerBudget(annee, mois){
  const msg = document.getElementById("bg_msg");
  const payload = {
    id: genId(),
    annee, mois,
    ca_objectif: parseFloat(document.getElementById("bg_ca")?.value)||0,
    marge_brute_objectif: parseFloat(document.getElementById("bg_mb")?.value)||0,
    resultat_net_objectif: parseFloat(document.getElementById("bg_rn")?.value)||0,
    charges_fixes_mensuelles: parseFloat(document.getElementById("bg_cf")?.value)||0,
    enregistre_par: currentUser?.nom || "Admin",
  };

  msg.style.cssText="display:block;color:#166534;"; msg.textContent="Enregistrement…";

  try {
    const existant = budgetsMensuels.find(b=>b.annee===annee && b.mois===mois);
    if(existant){
      payload.id = existant.id;
      await sbUpdate("budgets_mensuels", existant.id, payload);
      budgetsMensuels = budgetsMensuels.map(b=>b.id===existant.id?payload:b);
    } else {
      await sbInsert("budgets_mensuels", payload);
      budgetsMensuels.unshift(payload);
    }
    saveBudgetsMensuels();
    logAdminAction("BUDGET_MENSUEL", annee+"-"+mois+" mis à jour");
    showToast("✓ Budget enregistré");
    bilanFinancier("budget");
  } catch(e) {
    msg.style.cssText="display:block;color:#dc2626;"; msg.textContent="Erreur : "+e.message;
  }
}
