<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');

:root{
  /* ── Marque ── */
  --green-900:#0a2e12;--green-800:#0d3d1a;--green-700:#166534;
  --green-600:#1d7a3e;--green-500:#2d8c3e;--green-400:#5cc96e;
  --green-100:#e8f4ec;--green-50:#f3f9f5;
  --orange:#f47820;--orange-light:#f9a45c;--orange-dark:#c45e10;
  --amber:#f47820;--red:#dc2626;--blue:#2563eb;

  /* ── Neutres (sobre & corporate : beaucoup de blanc, gris froids) ── */
  --white:#ffffff;
  --gray-50:#fafbfb;      /* fond le plus clair */
  --gray-100:#f7f9f8;     /* fond général de l'app */
  --gray-150:#f1f4f2;     /* surfaces secondaires */
  --gray-200:#e8ede9;     /* bordures hairline */
  --gray-300:#d4ddd7;     /* bordures marquées */
  --gray-400:#7c8a82;     /* texte tertiaire / placeholders (assombri) */
  --gray-500:#4a5a51;     /* texte secondaire (assombri pour lisibilité) */
  --gray-600:#33413a;     /* texte fort secondaire */
  --text:#0f1f16;         /* texte principal */

  /* ── Ombres douces neutres (signature fintech) ── */
  --shadow-xs:0 1px 2px rgba(15,30,25,.04);
  --shadow:0 1px 3px rgba(15,30,25,.05), 0 1px 2px rgba(15,30,25,.04);
  --shadow-md:0 4px 16px rgba(15,30,25,.06), 0 2px 6px rgba(15,30,25,.04);
  --shadow-lg:0 12px 32px rgba(15,30,25,.10), 0 4px 12px rgba(15,30,25,.05);

  /* ── Rayons harmonisés ── */
  --r-sm:8px; --r:12px; --r-lg:16px; --r-xl:20px; --r-pill:999px;

  /* ── Espacements ── */
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:20px; --sp-6:24px;

  --sidebar-w:220px;
  --topbar-h:96px;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0;}
body{font-family:'Inter',sans-serif;background:var(--gray-100);color:var(--text);overscroll-behavior:none;min-height:100vh;}

/* ── INPUTS ── */
input,select,textarea{
  background:var(--white);border:1.5px solid var(--gray-200);color:var(--text);
  border-radius:var(--r);padding:10px 12px;font-size:13px;width:100%;
  outline:none;font-family:inherit;-webkit-appearance:none;
  box-shadow:var(--shadow-xs);transition:border .18s ease, box-shadow .18s ease;
}
input:focus,select:focus,textarea:focus{border-color:var(--green-600);box-shadow:0 0 0 3px rgba(29,122,62,.10);}
input::placeholder,textarea::placeholder{color:var(--gray-400);}
select option{background:var(--white);color:var(--text);}

/* ── TOPBAR (mobile + desktop) ── */
#topbar{
  background:linear-gradient(180deg,#0d3d1a 0%,#0a2e12 100%);
  border-bottom:1px solid rgba(244,120,32,.25);
  position:fixed;top:0;left:0;right:0;z-index:50;
  height:var(--topbar-h);
  display:flex;align-items:center;
  padding:0 16px;
  box-shadow:0 1px 12px rgba(10,46,18,.25);
}
#topbar-inner{display:flex;align-items:center;justify-content:space-between;width:100%;max-width:1400px;margin:0 auto;}

/* ── SIDEBAR (desktop only) ── */
#sidebar{
  display:none;
  position:fixed;top:var(--topbar-h);left:0;bottom:0;width:var(--sidebar-w);
  background:linear-gradient(180deg,#0a2e12 0%,#061a0b 100%);
  border-right:1px solid rgba(244,120,32,.15);
  z-index:40;overflow-y:auto;padding:16px 0;
}
.nav-item{
  display:flex;align-items:center;gap:10px;
  padding:11px 20px;cursor:pointer;
  font-size:13px;font-weight:600;color:rgba(255,255,255,.55);
  transition:all .2s;border-left:3px solid transparent;
  border:none;background:none;width:100%;font-family:inherit;text-align:left;
}
.nav-item:hover{background:rgba(255,255,255,.06);color:rgba(255,255,255,.85);}
.nav-item.active{background:rgba(244,120,32,.15);color:#f4a050;border-left:3px solid #f47820;font-weight:700;}
.nav-icon{font-size:16px;width:20px;text-align:center;flex-shrink:0;}

/* ── BOTTOM NAV (mobile only) ── */
#bottomnav{
  position:fixed;bottom:0;left:0;right:0;z-index:50;
  background:linear-gradient(135deg,#0d2e15,#1a1a2e);
  border-top:1px solid rgba(255,255,255,.08);
  display:flex;height:56px;
  box-shadow:0 -2px 16px rgba(0,0,0,.2);
}
.bnav-item{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:2px;cursor:pointer;border:none;background:none;font-family:inherit;
  color:rgba(255,255,255,.4);font-size:9px;font-weight:600;transition:all .2s;
  padding:4px 0;
}
.bnav-item.active{color:#f47820;}
.bnav-item .bnav-icon{font-size:18px;line-height:1;}

/* ── MAIN CONTENT ── */
#main{
  margin-top:var(--topbar-h);
  padding:20px 16px 72px;
  max-width:700px;margin-left:auto;margin-right:auto;
}

/* ── DESKTOP LAYOUT ── */
@media(min-width:768px){
  #sidebar{display:block;}
  #bottomnav{display:none;}
  #main{
    margin-left:var(--sidebar-w);
    max-width:none;
    padding:28px 32px 40px;
    margin-top:var(--topbar-h);
    margin-right:0;
  }
  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  .grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;}
  .grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;}
  .dash-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px;}
  .dash-row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;margin-bottom:16px;}
  .form-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}
  #topbar-inner{padding-left:calc(var(--sidebar-w) + 16px);}
}
@media(max-width:767px){
  .grid-2,.grid-3,.grid-4{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .dash-row,.dash-row-3{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;}
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
}

/* ── CARDS ── */
.card{background:var(--white);border:1px solid var(--gray-200);border-radius:var(--r-lg);padding:16px;margin-bottom:12px;box-shadow:var(--shadow);}
@media(min-width:768px){.card{padding:20px;}}

/* ── KPI CARDS ── */
.kpi-card{border-radius:16px;padding:16px;box-shadow:0 3px 16px rgba(0,0,0,.15);margin-bottom:0;}
@media(min-width:768px){.kpi-card{padding:20px;border-radius:18px;}}

/* ── BADGES ── */
.badge{border-radius:999px;padding:3px 9px;font-size:10px;font-weight:700;white-space:nowrap;}
.b-lime{background:#e8f5ea;color:#1a5c2a;border:1px solid #a8d5b0;}
.b-amber{background:#fef9c3;color:#a16207;border:1px solid #fde68a;}
.b-sky{background:#e0f2fe;color:#0369a1;border:1px solid #bae6fd;}
.b-stone{background:var(--gray-100);color:var(--gray-600);border:1px solid var(--gray-200);}
.b-red{background:#fee2e2;color:#dc2626;border:1px solid #fecaca;}
.b-orange{background:#fff7ed;color:#c2410c;border:1px solid #fed7aa;}
.b-purple{background:#f3e8ff;color:#7c3aed;border:1px solid #ddd6fe;}

/* ── LABELS ── */
.label{font-size:10px;font-weight:700;color:var(--gray-500);text-transform:uppercase;letter-spacing:.08em;display:block;margin-bottom:5px;}

/* ── SECTION TITLE ── */
.section-title{font-size:16px;font-weight:800;color:var(--text);margin-bottom:14px;display:flex;align-items:center;gap:8px;letter-spacing:-.01em;}
@media(min-width:768px){.section-title{font-size:18px;margin-bottom:18px;}}

/* ── TOAST ── */
.toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);z-index:999;padding:12px 24px;border-radius:var(--r);font-weight:700;font-size:13px;text-align:center;display:none;box-shadow:var(--shadow-lg);white-space:nowrap;}

/* ── SPINNER ── */
.spinner{width:15px;height:15px;border:2px solid rgba(255,255,255,.2);border-top:2px solid #f47820;border-radius:50%;animation:spin .7s linear infinite;display:inline-block;flex-shrink:0;}
@keyframes spin{to{transform:rotate(360deg);}}

/* ── BUTTONS ── */
.btn{padding:11px 16px;border-radius:var(--r);border:none;cursor:pointer;font-family:inherit;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;transition:all .18s ease;}
.btn-green{background:var(--green-800);color:#fff;box-shadow:var(--shadow-xs);}
.btn-green:hover{background:var(--green-700);box-shadow:var(--shadow);}
.btn-green:active{transform:translateY(1px);}
.btn-ghost{background:var(--gray-100);color:var(--green-800);border:1.5px solid var(--gray-200);}
.btn-ghost:hover{background:var(--gray-150);border-color:var(--gray-300);}
.btn-red{background:#fef2f2;color:#dc2626;border:1.5px solid #fecaca;}
.btn-red:hover{background:#fee2e2;}
.btn:disabled{opacity:.5;cursor:not-allowed;}

button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid rgba(244,120,32,.45);outline-offset:2px;}
.quick-actions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:0 0 14px;}
.quick-action{background:var(--white);border:1px solid var(--gray-200);border-left:3px solid var(--green-600);border-radius:var(--r);padding:12px;text-align:left;cursor:pointer;font-family:inherit;box-shadow:var(--shadow-xs);}
.quick-action:hover{border-color:var(--green-400);box-shadow:var(--shadow);}
.quick-action-title{font-size:13px;font-weight:800;color:var(--text);}
.quick-action-sub{font-size:10.5px;color:var(--gray-500);margin-top:3px;line-height:1.35;}
.form-block{background:var(--gray-50);border:1px solid var(--gray-200);border-radius:var(--r);padding:12px;margin-bottom:10px;}
.form-block-title{font-size:11px;font-weight:800;color:var(--gray-600);text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px;}
.form-summary{position:sticky;bottom:0;background:var(--white);border:1.5px solid var(--gray-200);box-shadow:var(--shadow-md);border-radius:var(--r);padding:12px;margin:12px 0;}
.helper-alert{font-size:11px;font-weight:700;border-radius:10px;padding:8px 10px;margin-top:8px;}
@media(max-width:767px){.quick-actions{grid-template-columns:1fr;}.form-grid{grid-template-columns:1fr;}.modal{padding:18px;}}

/* ── FILTERS ── */
.filter-btn{padding:6px 14px;border-radius:var(--r-pill);font-size:11px;font-weight:700;border:none;cursor:pointer;font-family:inherit;transition:all .18s ease;}
.f-active{background:var(--green-800);color:#fff;box-shadow:var(--shadow-xs);}
.f-inactive{background:var(--white);color:var(--gray-500);border:1px solid var(--gray-200);}
.f-inactive:hover{border-color:var(--gray-300);}

/* ── ICON BUTTONS ── */
.icon-btn{background:var(--white);border:1.5px solid var(--gray-200);color:var(--gray-500);padding:7px 10px;border-radius:var(--r-sm);cursor:pointer;font-size:13px;line-height:1;transition:all .18s ease;}
.icon-btn:hover{background:var(--gray-100);border-color:var(--gray-300);}
.icon-btn-green{background:var(--green-50);border:1.5px solid #bbf7d0;color:#15803d;padding:7px 10px;border-radius:var(--r-sm);cursor:pointer;font-size:13px;line-height:1;}
.icon-btn-orange{background:#fff7ed;border:1.5px solid #fed7aa;color:#c2410c;padding:7px 10px;border-radius:var(--r-sm);cursor:pointer;font-size:13px;line-height:1;}

/* ── CARTES & UTILITAIRES (design system sobre) ── */
.card{background:var(--white);border:1px solid var(--gray-200);border-radius:var(--r-lg);padding:var(--sp-4);box-shadow:var(--shadow);}
.card-flat{background:var(--white);border:1px solid var(--gray-200);border-radius:var(--r-lg);padding:var(--sp-4);}
.eyebrow{font-size:10px;font-weight:700;color:var(--gray-400);text-transform:uppercase;letter-spacing:.08em;}
.kpi{background:var(--white);border:1px solid var(--gray-200);border-radius:var(--r);padding:var(--sp-3);text-align:center;box-shadow:var(--shadow-xs);}
.kpi-value{font-size:18px;font-weight:800;color:var(--text);letter-spacing:-.01em;}
.kpi-label{font-size:10px;color:var(--gray-500);font-weight:600;margin-top:2px;}

/* KPI cards du dashboard (style bancaire : blanc, accent latéral) */
.kpi-card{background:var(--white);border:1px solid var(--gray-200);border-radius:var(--r-lg);padding:14px 16px;box-shadow:var(--shadow);}
.kpi-card-label{font-size:10px;font-weight:700;color:var(--gray-400);text-transform:uppercase;letter-spacing:.07em;}
.kpi-card-value{font-size:19px;font-weight:800;color:var(--text);margin-top:5px;line-height:1.1;letter-spacing:-.01em;}
.kpi-card-sub{font-size:10.5px;color:var(--gray-500);margin-top:4px;}
/* ── MODAL ── */
.modal-overlay{position:fixed;inset:0;background:rgba(15,30,25,.45);backdrop-filter:blur(3px);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px;}
.modal{background:var(--white);border:1px solid var(--gray-200);border-radius:var(--r-xl);padding:22px;width:100%;max-width:520px;max-height:90vh;overflow-y:auto;box-shadow:var(--shadow-lg);}

/* ── TABLE ── */
.data-table{width:100%;border-collapse:collapse;font-size:13px;}
.data-table th{background:var(--gray-100);color:#1a2e22;font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.06em;padding:10px 12px;text-align:left;border-bottom:1.5px solid var(--gray-200);}
.data-table td{padding:10px 12px;border-bottom:1px solid var(--gray-100);vertical-align:middle;}
.data-table tr:last-child td{border-bottom:none;}
.data-table tr:hover td{background:var(--gray-50);}

/* ── NOTIF DOT ── */
.notif-dot{width:7px;height:7px;background:#ef4444;border-radius:50%;display:inline-block;margin-left:3px;vertical-align:middle;}

/* ── SCROLLBAR ── */
::-webkit-scrollbar{width:4px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--gray-300);border-radius:4px;}
</style>
</head>

// ── Session (localStorage) ───────────────────────────────────────────────────
function saveSession(token, expiresInSec, user) {
  const exp = Date.now() + expiresInSec * 1000;
  localStorage.setItem(SESSION_KEY, JSON.stringify({ token, exp, user }));
}

function loadSession() {
  try {
    const raw = localStorage.getItem(SESSION_KEY);
    if (!raw) return null;
    const s = JSON.parse(raw);
    if (!s.token || !s.exp || Date.now() > s.exp) {
      localStorage.removeItem(SESSION_KEY);
      return null;
    }
    return s;
  } catch {
    localStorage.removeItem(SESSION_KEY);
    return null;
  }
}

function clearSession() {
  localStorage.removeItem(SESSION_KEY);
  currentUser = null;
}

function getToken() {
  const s = loadSession();
  return s ? s.token : null;
}

// ── Fetch authentifié vers PostgREST ─────────────────────────────────────────
// Remplace l'ancien HDR. Utilise le JWT custom comme Authorization si présent,
// sinon retombe sur la clé anon (utilisée seulement pour les lectures publiques
// avant connexion, ex: liste des produits sur l'écran de login).
function sbHeaders(extra = {}) {
  const token = getToken();
  return {
    "apikey": SB_KEY,
    "Authorization": "Bearer " + (token || SB_KEY),
    "Content-Type": "application/json",
    "Prefer": "return=representation",
    ...extra,
  };
}

async function sbFetch(path, options = {}) {
  const headers = { ...sbHeaders(), ...(options.headers || {}) };
  const r = await fetch(SB_URL + path, { ...options, headers });
  if (r.status === 401) {
    // JWT expiré / invalide -> forcer reconnexion
    clearSession();
    showToast("⏱ Session expirée — reconnectez-vous", "warn");
    showLoginScreen();
  }
  return r;
}

function sbStorageHeaders(contentType) {
  const token = getToken();
  return {
    "apikey": SB_KEY,
    "Authorization": "Bearer " + (token || SB_KEY),
    "Content-Type": contentType,
  };
}

// ── escapeHtml : protection XSS pour toute donnée utilisateur injectée via innerHTML ──
function escapeHtml(str) {
  if (str === null || str === undefined) return "";
  return String(str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

// ── hashPin : SHA-256(pin + sel), identique à l'algorithme de l'Edge Function /login.
//    Utilisé uniquement côté admin pour hasher un nouveau PIN avant stockage
//    (jamais pour la vérification — celle-ci se fait côté serveur).
async function hashPin(pin){
  const enc = new TextEncoder().encode(pin + "verdapp_salt_ci_2026");
  const buf = await crypto.subtle.digest("SHA-256", enc);
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("");
}

// ─── SÉCURITÉ : Sanitization XSS ────────────────────────────────────────────
function sanitize(str){
  if(str===null||str===undefined) return "";
  const s=String(str);
  const map={"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#x27;"};
  return s.replace(/[&<>"']/g,function(ch){return map[ch]||ch;});
}

// Sanitize objet entier (shallow)
function sanitizeObj(obj){
  if(!obj||typeof obj!=="object") return obj;
  const r={};
  for(const k in obj){
    r[k]=typeof obj[k]==="string"?sanitize(obj[k]):obj[k];
  }
  return r;
}

// ─── Erreur Supabase lisible ──────────────────────────────────────────────────
function errMsg(e) {
  const m = (e && e.message) || String(e);
  if (m.includes("Failed to fetch") || m.includes("NetworkError") || m.includes("fetch")) {
    return "Connexion impossible à la base de données.\nVérifiez votre connexion internet.";
  }
  if (m.includes("JWT") || m.includes("permission") || m.includes("policy") || m.includes("42501")) {
    return "Accès refusé.\nExécutez le SQL de configuration RLS dans Supabase.";
  }
  if (m.includes("duplicate") || m.includes("23505")) {
    return "Cet enregistrement existe déjà.";
  }
  return m;
}

// MOTEUR DE MARGE FIFO
// Calcule la marge en suivant quel lot a été consommé pour chaque vente
// ════════════════════════════════════════════════════════════════════════════

/**
 * Calcule le coût FIFO d'une quantité vendue d'un produit
 * à une date donnée, en simulant la consommation des lots.
 *
 * @param {string} produit
 * @param {number} qteVendue
 * @param {string} dateVente
 * @param {Array}  ventesAvant - ventes déjà passées (pour calculer ce qui reste)
 * @returns {number} coût total FIFO de cette vente
 */
/**
 * Retourne le coût FIFO d'une vente, décomposé en :
 *  - coutMarchandise : prix d'achat pur (sans frais)
 *  - coutAvecFrais   : prix d'achat + frais terrain proportionnels
 */
function coutFIFOVente(produit, qteVendue, dateVente, ventesAvant) {
  const lots = achats
    .filter(a => a.produit === produit && a.statut === "recu"
              && (a.date_reception||a.date) <= dateVente)
    .sort((a,b) => new Date(a.date_reception||a.date) - new Date(b.date_reception||b.date));

  if(!lots.length) return 0;

  const qteDejaVendue = (ventesAvant||[])
    .filter(v => v.produit === produit)
    .reduce((s,v) => s+v.quantite, 0);

  let aConsommer = qteDejaVendue;
  const lotsRestants = lots.map(lot => {
    const consomme = Math.min(aConsommer, lot.quantite);
    aConsommer = Math.max(0, aConsommer - lot.quantite);
    const fraisTotaux = (lot.droit_terre||0)+(lot.transport||0)+(lot.droit_vente||0)+(lot.charrette||0);
    return {
      ...lot,
      qteRestante: lot.quantite - consomme,
      prixAchatUnitaire: lot.prix_unitaire,                          // prix pur
      fraisUnitaires: lot.quantite ? fraisTotaux/lot.quantite : 0,   // frais ramenés à l'unité
      coutRevientUnitaire: lot.quantite
        ? (lot.quantite*lot.prix_unitaire + fraisTotaux) / lot.quantite
        : lot.prix_unitaire
    };
  }).filter(l => l.qteRestante > 0);

  let coutMarchandise = 0; // prix d'achat pur (pour marge BRUTE)
  let coutAvecFrais   = 0; // prix + frais (pour marge NETTE)
  let aVendre = qteVendue;

  for(const lot of lotsRestants) {
    if(aVendre <= 0) break;
    const pris = Math.min(aVendre, lot.qteRestante);
    coutMarchandise += pris * lot.prixAchatUnitaire;
    coutAvecFrais   += pris * lot.coutRevientUnitaire;
    aVendre -= pris;
  }

  // Fallback si stock insuffisant
  if(aVendre > 0 && lotsRestants.length) {
    const dernier = lotsRestants[lotsRestants.length-1];
    coutMarchandise += aVendre * dernier.prixAchatUnitaire;
    coutAvecFrais   += aVendre * dernier.coutRevientUnitaire;
  }

  return coutAvecFrais; // retourne le coût complet (prix + frais)
}

/**
 * Version décomposée : retourne séparément coût marchandise et frais.
 * Utilisée pour afficher marge brute ET marge nette distinctement.
 */
function coutFIFOVenteDetail(produit, qteVendue, dateVente, ventesAvant) {
  const lots = achats
    .filter(a => a.produit === produit && a.statut === "recu"
              && (a.date_reception||a.date) <= dateVente)
    .sort((a,b) => new Date(a.date_reception||a.date) - new Date(b.date_reception||b.date));

  if(!lots.length) return {coutMarchandise:0, coutFrais:0, coutTotal:0};

  const qteDejaVendue = (ventesAvant||[])
    .filter(v => v.produit === produit)
    .reduce((s,v) => s+v.quantite, 0);

  let aConsommer = qteDejaVendue;
  const lotsRestants = lots.map(lot => {
    const consomme = Math.min(aConsommer, lot.quantite);
    aConsommer = Math.max(0, aConsommer - lot.quantite);
    const fraisTotaux = (lot.droit_terre||0)+(lot.transport||0)+(lot.droit_vente||0)+(lot.charrette||0);
    return {
      ...lot,
      qteRestante: lot.quantite - consomme,
      prixAchatUnitaire: lot.prix_unitaire,
      fraisUnitaires: lot.quantite ? fraisTotaux/lot.quantite : 0
    };
  }).filter(l => l.qteRestante > 0);

  let coutMarchandise = 0;
  let coutFrais = 0;
  let aVendre = qteVendue;

  for(const lot of lotsRestants) {
    if(aVendre <= 0) break;
    const pris = Math.min(aVendre, lot.qteRestante);
    coutMarchandise += pris * lot.prixAchatUnitaire;
    coutFrais       += pris * lot.fraisUnitaires;
    aVendre -= pris;
  }

  if(aVendre > 0 && lotsRestants.length) {
    const dernier = lotsRestants[lotsRestants.length-1];
    coutMarchandise += aVendre * dernier.prixAchatUnitaire;
    coutFrais       += aVendre * dernier.fraisUnitaires;
  }

  return {coutMarchandise, coutFrais, coutTotal: coutMarchandise+coutFrais};
}

/**
 * Calcule la marge brute FIFO d'un tableau de ventes.
 * Trie les ventes par date pour respecter la séquence FIFO.
 * @param {Array} ventesArr - tableau de ventes (défaut: global ventes)
 * @returns {number} marge brute FIFO
 */
/**
 * MARGE BRUTE FIFO = CA − Coût d'achat marchandise pur (sans frais terrain)
 * Mesure la marge sur le négoce pur.
 */
function margebrute(ventesArr) {
  const arr = (ventesArr || ventes).slice().sort((a,b)=>new Date(a.date)-new Date(b.date));
  let margeTotal = 0;
  const ventesPassees = {};
  arr.forEach(v => {
    if(!ventesPassees[v.produit]) ventesPassees[v.produit] = [];
    const {coutMarchandise} = coutFIFOVenteDetail(v.produit, v.quantite, v.date, ventesPassees[v.produit]);
    margeTotal += v.quantite*v.prix_vente - coutMarchandise;
    ventesPassees[v.produit].push(v);
  });
  return margeTotal;
}

/**
 * MARGE NETTE FIFO = CA − Coût total (marchandise + frais terrain)
 * Ce qu'il reste après TOUS les coûts d'achat.
 */
function margenette(ventesArr) {
  const arr = (ventesArr || ventes).slice().sort((a,b)=>new Date(a.date)-new Date(b.date));
  let margeTotal = 0;
  const ventesPassees = {};
  arr.forEach(v => {
    if(!ventesPassees[v.produit]) ventesPassees[v.produit] = [];
    const {coutTotal} = coutFIFOVenteDetail(v.produit, v.quantite, v.date, ventesPassees[v.produit]);
    margeTotal += v.quantite*v.prix_vente - coutTotal;
    ventesPassees[v.produit].push(v);
  });
  return margeTotal;
}

/**
 * Marge brute FIFO par vente individuelle (pour l'affichage dans la liste ventes).
 * @param {object} vente
 * @param {Array} ventesAvant - ventes précédentes du même produit
 * @returns {{ca, cout, marge, taux}}
 */
function margeVenteFIFO(vente, ventesAvant) {
  const ca = vente.quantite * vente.prix_vente;
  const {coutMarchandise, coutFrais, coutTotal} = coutFIFOVenteDetail(
    vente.produit, vente.quantite, vente.date, ventesAvant||[]
  );
  const margeB = ca - coutMarchandise;           // marge BRUTE (sans frais)
  const margeN = ca - coutTotal;                 // marge NETTE (avec frais)
  const tauxB  = ca ? Math.round(margeB/ca*100) : 0;
  const tauxN  = ca ? Math.round(margeN/ca*100) : 0;
  return {
    ca, coutMarchandise, coutFrais, coutTotal,
    marge: margeN,   // compatibilité avec le code existant → utilise nette
    margeB, margeN, tauxB, tauxN,
    taux: tauxN
  };
}

// margenette() est définie dans le bloc FIFO ci-dessus

/**
 * Valeur totale des pertes constatées (toutes, table pertes_lots).
 */
function totalPertesValeur(){
  return pertesLots.reduce((s,p)=>s+(p.valeur_perte||0), 0);
}

/**
 * Total des commissions dues (montant_du) sur la période, tous utilisateurs
 * confondus (vue admin) ou pour l'utilisateur courant uniquement (RLS s'en
 * charge déjà côté serveur pour les non-admin, donc on additionne tel quel
 * ce qui a été chargé). Utilisé pour la marge nette commerciale du dashboard.
 */
function totalCommissionsDues(){
  // Source de vérité UNIQUE : calculerCommissionParSemaine (la même que les
  // vues commission utilisateur et admin). Garantit que le dashboard, le SIG
  // et les rapports affichent EXACTEMENT le même total de commissions que
  // l'écran Commissions, sans divergence d'arrondi ou de méthode.
  const noms = [...new Set(achats.map(a=>a.enregistre_par||a.auteur).filter(Boolean))];
  // Dédoublonnage insensible à la casse pour ne pas compter deux fois un même
  // utilisateur écrit différemment (ex: "Salifou" / "SALIFOU").
  const nomsUniques = [];
  noms.forEach(n=>{ if(!nomsUniques.some(x=>sameName(x,n))) nomsUniques.push(n); });
  return nomsUniques.reduce((s,nom)=>{
    return s + calculerCommissionParSemaine(nom).totalCommission;
  }, 0);
}

/**
 * Version filtrée : marge FIFO sur une période (jour/mois/année).
 * @param {Array} ventesF - ventes filtrées sur la période
 * @param {Array} achatsF - achats filtrés (pour les frais)
 */
function calculerMargeFIFO(ventesF, achatsF) {
  const ca     = ventesF.reduce((s,v)=>s+v.quantite*v.prix_vente, 0);
  const margeB = margebrute(ventesF);   // CA − coût marchandise pur
  const margeN = margenette(ventesF);   // CA − (marchandise + frais terrain)
  const frais  = margeB - margeN;       // frais terrain imputés aux ventes
  const tauxB  = ca ? Math.round(margeB/ca*100) : 0;
  const tauxN  = ca ? Math.round(margeN/ca*100) : 0;
  // coutAch = coût marchandise seul (pour décomposition)
  const coutAch = ca - margeB;
  return {ca, coutAch, frais, margeB, margeN, tauxB, tauxN};
}

// Alias pour compatibilité avec l'ancien calculerMarge
function calculerMarge(ventesF, achatsF) {
  return calculerMargeFIFO(ventesF, achatsF||[]);
}

// UUID v4 — requis pour les comptes utilisateur (l'authentification crée un
// compte auth.users qui exige un identifiant au format UUID v4).
const genUUID=()=>{
  if(typeof crypto!=="undefined" && crypto.randomUUID) return crypto.randomUUID();
  // Fallback RFC 4122 v4 si crypto.randomUUID indisponible
  return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g,c=>{
    const r=Math.random()*16|0, v=c==="x"?r:(r&0x3|0x8);
    return v.toString(16);
  });
};
const fmt=n=>new Intl.NumberFormat("fr-CI").format(Math.round(n||0))+" F";
const today=()=>new Date().toISOString().slice(0,10);
// Comparaison de noms d'utilisateur insensible à la casse et aux accents/espaces.
// Évite qu'un lot enregistré sous "Salifou" ne soit pas reconnu pour le compte "SALIFOU".
const normNom=(s)=>(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").trim().toLowerCase();
const sameName=(a,b)=>normNom(a)===normNom(b);

// ─── SEMAINE ISO 8601 (lundi → dimanche) ─────────────────────────────────────
// Le lundi est le 1er jour ; la semaine appartient à l'année de son jeudi.
// Utilisé pour regrouper les commissions par semaine calendaire.
function lundiDeLaSemaine(dateStr){
  const d = new Date(dateStr+"T00:00:00");
  const jour = (d.getDay()+6)%7; // 0=lundi … 6=dimanche
  d.setDate(d.getDate()-jour);
  d.setHours(0,0,0,0);
  return d;
}
function dimancheDeLaSemaine(dateStr){
  const lundi = lundiDeLaSemaine(dateStr);
  const dim = new Date(lundi);
  dim.setDate(lundi.getDate()+6);
  return dim;
}
// Numéro de semaine ISO + année ISO → clé triable "YYYY-Www"
function cleSemaineISO(dateStr){
  const d = new Date(dateStr+"T00:00:00");
  const target = new Date(d);
  const jour = (d.getDay()+6)%7;
  target.setDate(d.getDate()-jour+3); // jeudi de la semaine
  const premierJanvier = new Date(target.getFullYear(),0,1);
  const semaine = 1 + Math.round(((target-premierJanvier)/86400000 - 3 + ((premierJanvier.getDay()+6)%7))/7);
  const anneeISO = target.getFullYear();
  return anneeISO+"-W"+String(semaine).padStart(2,"0");
}
// Libellé lisible d'une semaine à partir d'une date quelconque de la semaine
function libelleSemaine(dateStr){
  const lundi = lundiDeLaSemaine(dateStr);
  const dim = dimancheDeLaSemaine(dateStr);
  const optMois = {day:"numeric",month:"long"};
  const l = lundi.toLocaleDateString("fr-CI",optMois);
  const dm = dim.toLocaleDateString("fr-CI",optMois);
  return "Semaine du "+l+" au "+dm;
}

/**
 * Attribue le prochain numéro séquentiel de document via la fonction RPC
 * Supabase prochain_numero_document (atomique, anti-doublon).
 * prefixe : 'FAC' (ventes) ou 'BR' (bons de réception achats).
 * Retourne ex. "FAC-2026-0001". En cas d'échec réseau, retourne null
 * (l'opération principale ne doit pas être bloquée par la numérotation).
 */
async function obtenirNumeroDocument(prefixe, date){
  try {
    const annee = (date||new Date().toISOString().slice(0,10)).slice(0,4);
    const r = await sbFetch(`/rest/v1/rpc/prochain_numero_document`, {
      method:"POST",
      body: JSON.stringify({p_prefixe:prefixe, p_annee:+annee})
    });
    if(!r.ok) return null;
    const data = await r.json();
    return typeof data==="string" ? data.replace(/^"|"$/g,"") : data;
  } catch(e) {
    console.warn("Numérotation document indisponible:", e.message);
    return null;
  }
}
async function sbDelete(table,id){
  const r=await sbFetch(`/rest/v1/${table}?id=eq.${id}`,{method:"DELETE"});
  if(!r.ok) throw new Error(await r.text());
}
async function sbUpsert(table,data){
  const r=await sbFetch(`/rest/v1/${table}`,{method:"POST",headers:{"Prefer":"resolution=merge-duplicates,return=representation"},body:JSON.stringify(data)});
  if(!r.ok) throw new Error(await r.text());
}

// ─── FORMULAIRE ACHAT (réutilisable pour ajout et modification) ──────────────
function calcAchat(){
  const q=+document.getElementById("af_qte")?.value||0;
  const p=+document.getElementById("af_prix")?.value||0;
  const av=+document.getElementById("af_avance")?.value||0;
  const dt=+document.getElementById("af_droit_terre")?.value||0;
  const tr=+document.getElementById("af_transport")?.value||0;
  const dv=+document.getElementById("af_droit_vente")?.value||0;
  const ch=+document.getElementById("af_charrette")?.value||0;
  const box=document.getElementById("af_calc");
  if(!box) return;
  if(q&&p){
    box.style.display="grid";
    const totalAchat=q*p;
    const totalFrais=dt+tr+dv+ch;
    const totalRevient=totalAchat+totalFrais;
    const coutUnitaire=q?totalRevient/q:0;
    const solde=totalAchat-av;
    document.getElementById("af_calcTotal").textContent=fmt(totalAchat);
    const es=document.getElementById("af_calcSolde");
    es.textContent=fmt(solde); es.style.color=solde>0?"#f87171":"#bef264";
    const cr=document.getElementById("af_calcRevient");
    if(cr){cr.textContent=fmt(totalRevient);}
    const cu=document.getElementById("af_calcUnitaire");
    if(cu){cu.textContent=fmt(coutUnitaire)+"/u";}
  } else { box.style.display="none"; }
}

function calcVente(){
  const q=+document.getElementById("vf_qte")?.value||0;
  const p=+document.getElementById("vf_prix")?.value||0;
  const prod=document.getElementById("vf_produit")?.value||"";
  const stock=stockDisponibleProduit(prod);
  const stockEl=document.getElementById("vf_stockInfo");
  if(stockEl){
    const manque=q>stock;
    stockEl.className="helper-alert";
    stockEl.style.background=manque?"#fef2f2":"#f0fdf4";
    stockEl.style.color=manque?"#dc2626":"#166534";
    stockEl.style.border=manque?"1px solid #fecaca":"1px solid #bbf7d0";
    stockEl.textContent=prod ? (manque ? "Stock insuffisant : "+stock+" disponible(s)" : "Stock disponible : "+stock+" unité(s)") : "Choisis un produit pour voir le stock disponible";
  }
  const box=document.getElementById("vf_calc");
  if(!box) return;
  if(q&&p){
    box.style.display="grid";
    document.getElementById("vf_calcTotal").textContent=fmt(q*p);
    const cm=coutMoyen(prod);
    const marge=cm?(p-cm)*q:null;
    const el=document.getElementById("vf_calcMarge");
    if(marge!==null){el.textContent=fmt(marge);el.style.color=marge>=0?"#15803d":"#dc2626";}
    else{el.textContent="N/A";el.style.color="#78716c";}
  } else { box.style.display="none"; }
}

function attachCalcEvents(){
  ["af_qte","af_prix","af_avance","af_droit_terre","af_transport","af_droit_vente","af_charrette"].forEach(id=>{

    const el=document.getElementById(id);

  });

}

let financeNavOuvert = false;

function renderFinanceSubnav(){
  const actifTab = FINANCE_SUBTABS.find(t=>t.id===financeSubTab) || FINANCE_SUBTABS[0];

  const ligne = (t, estActif, estEntete)=>{
    return '<button onclick="'+(estEntete?'toggleFinanceNav()':'switchFinanceSub(\''+t.id+'\')')+'" '
      +'style="display:flex;align-items:center;gap:12px;width:100%;text-align:left;'
      +'padding:13px 16px;border:none;cursor:pointer;font-family:inherit;font-size:13.5px;'
      +'font-weight:'+(estActif?'700':'600')+';'
      +(estEntete?'':'border-top:1px solid var(--gray-200);')
      +'transition:all .15s ease;'
      +(estActif
        ? 'background:var(--green-800);color:#fff;'
        : 'background:var(--white);color:var(--gray-600);')+'">'
      +'<span style="font-size:16px;width:24px;text-align:center;flex-shrink:0;'
        +'color:'+(estActif?'var(--orange)':'var(--gray-400)')+';">'+t.icon+'</span>'

function switchTab(tab){
  const autorise = tabsAutorisés();
  if(!autorise.includes(tab)){
    showToast("Accès réservé à l'administrateur","error");
    tab="commercial";
  }
  currentTab=tab;
  ["dashboard","commercial","chat","finance","params"].forEach(t=>{
    const page=document.getElementById("page-"+t);
    if(page) page.style.display=t===tab?"block":"none";
    const nav=document.getElementById("nav-"+t);
    if(nav) nav.className="nav-item"+(t===tab?" active":"");
    const bnav=document.getElementById("bnav-"+t);
    if(bnav) bnav.className="bnav-item"+(t===tab?" active":"");
  });
  if(tab==="chat") initChat();
  if(tab==="commercial"){ renderCommercialSubnav(); switchCommercialSub(commercialSubTab); }
  if(tab==="finance"){ renderFinanceSubnav(); renderFinanceContent(); }

  window.scrollTo(0,0);

// ─── RENDER ───────────────────────────────────────────────────────────────────
function render(){
  if(currentTab==="dashboard") renderDashboard();
  else if(currentTab==="commercial"){
    if(commercialSubTab==="achats") renderAchats();
    else if(commercialSubTab==="ventes") renderVentes();
    else if(commercialSubTab==="stock") renderStock();
    else if(commercialSubTab==="demandes") renderDemandes();
    else if(commercialSubTab==="catalogue") renderCatalogue();
  }
  else if(currentTab==="finance") renderFinanceContent();
  else if(currentTab==="params") renderParams();
  // chat géré séparément via initChat
}

function stockDisponibleProduit(produit){
  return calculerFIFO(produit).qteDispo || 0;
}

function coutMoyen(produit){
  const lots=achats.filter(a=>a.produit===produit&&a.statut==="recu");
  const tv=lots.reduce((s,a)=>{
    const frais=(a.droit_terre||0)+(a.transport||0)+(a.droit_vente||0)+(a.charrette||0);
    return s+a.quantite*a.prix_unitaire+frais;
  },0);
  const tq=lots.reduce((s,a)=>s+a.quantite,0);
  return tq?tv/tq:0;
}

// MODULE COMMISSION — 10% marge nette par lot enregistré
// ════════════════════════════════════════════════════════════════════════════

/**
 * Calcule la commission d'un utilisateur sur ses lots enregistrés.
 * Commission = 10% de la marge nette de chaque lot vendu.
 * Un lot = un achat marqué "reçu" enregistré par cet utilisateur.
 */
function calculerCommission(nomUtilisateur) {
  // Lots enregistrés par cet utilisateur
  const lotsUser = achats.filter(a =>
    a.statut === "recu" &&
    (sameName(a.enregistre_par, nomUtilisateur) || sameName(a.auteur, nomUtilisateur))
  );

  if(!lotsUser.length) return {lots:[], totalCommission:0, totalMargeNette:0};

  const resultats = lotsUser.map(lot => {
    // Ventes de ce produit depuis ce lot (FIFO)
    const fifo = calculerFIFO(lot.produit);
    const lotFifo = fifo.lots.find(l=>l.id===lot.id);
    if(!lotFifo) return {lot, qteVendue:0, margeNette:0, commission:0};

    const qteVendue = lotFifo.qteConsommee;
    if(!qteVendue) return {lot, qteVendue:0, margeNette:0, commission:0};

    // Marge nette de ce lot = (prix_vente_moy - coût_revient) × qte_vendue
    // On utilise les ventes réelles filtrées par ordre FIFO
    const ventesLot = [];
    let aConsommer = 0;
    // Calculer combien de ventes correspondent à ce lot
    const lotsAvant = fifo.lots.filter(l=>fifo.lots.indexOf(l) < fifo.lots.indexOf(lotFifo));
    const qteAvant = lotsAvant.reduce((s,l)=>s+l.qteInitiale, 0);
    const ventesTriees = ventes
      .filter(v=>v.produit===lot.produit)
      .sort((a,b)=>new Date(a.date)-new Date(b.date));

    let aSkip = qteAvant;
    let aPrendre = qteVendue;
    const ventesImputees = [];
    for(const v of ventesTriees) {
      if(aPrendre <= 0) break;
      if(aSkip >= v.quantite) { aSkip -= v.quantite; continue; }
      const skip = aSkip;
      aSkip = 0;
      const pris = Math.min(aPrendre, v.quantite - skip);
      aPrendre -= pris;
      // Créer une vente virtuelle pour la portion imputée à ce lot
      ventesImputees.push({...v, quantite: pris});
    }

    // ── Marge nette du lot = CA proportionnel des ventes imputées
    //    − coût d'achat réel du lot (qteConsommee × prix unitaire)
    //    − frais accessoires réels du lot (qteConsommee × frais unitaires)
    // (Même correction que dans voirCommissionAdmin : évite le recalcul
    //  via margenette(ventesImputees), incohérent avec l'historique réel.)
    const caImpute = ventesImputees.reduce((s,v)=>s+v.quantite*v.prix_vente, 0);
    const fraisTotauxLot = (lot.droit_terre||0)+(lot.transport||0)+(lot.droit_vente||0)+(lot.charrette||0);
    const fraisUnitairesLot = lot.quantite ? fraisTotauxLot/lot.quantite : 0;
    const coutLot = qteVendue * (lot.prix_unitaire + fraisUnitairesLot);
    const margeNetteL = caImpute - coutLot;
    const commission = Math.max(0, margeNetteL * 0.10);

    return {
      lot,
      produit: lot.produit,
      fournisseur: lot.fournisseur,
      date: lot.date_reception||lot.date,
      qteInitiale: lot.quantite,
      qteVendue,
      margeNette: margeNetteL,
      commission
    };
  });

  const totalMargeNette = resultats.reduce((s,r)=>s+r.margeNette, 0);
  const totalCommission = resultats.reduce((s,r)=>s+r.commission, 0);

  return {lots: resultats, totalMargeNette, totalCommission};
}

// ── CALCUL CENTRALISÉ : commissions d'un utilisateur, regroupées par semaine ISO ──
// Fonction PURE réutilisée par la vue utilisateur ET la vue admin, pour garantir
// que les deux affichent EXACTEMENT le même montant et la même logique.
// Retourne : { semaines:[{cle,dateRef,ventesCount,lots:[{...,qteVendue,mn,comm,datesVente[]}],
//              commission,margeNette}], totalCommission, totalMargeNette, nbLots }
function calculerCommissionParSemaine(nom){
  const lotsUser = achats.filter(a => a.statut==="recu" && sameName(a.enregistre_par, nom));
  if(!lotsUser.length) return {semaines:[], totalCommission:0, totalMargeNette:0, nbLots:0};

  const produitsUser = [...new Set(lotsUser.map(l=>l.produit))];

  // Grouper les ventes par semaine ISO
  const parSemaine = {};
  ventes
    .filter(v => produitsUser.includes(v.produit))
    .sort((a,b) => new Date(a.date)-new Date(b.date))
    .forEach(v => {
      const j = (v.date||"").slice(0,10);
      if(!j) return;
      const cle = cleSemaineISO(j);
      if(!parSemaine[cle]) parSemaine[cle] = {ventes:[], dateRef:j};
      parSemaine[cle].ventes.push(v);
    });

  const clesSemaine = Object.keys(parSemaine).sort().reverse();
  let totalCommission = 0, totalMargeNette = 0;

  const semaines = clesSemaine.map(cle => {
    const ventesS = parSemaine[cle].ventes;
    const dateRef = parSemaine[cle].dateRef;
    let commissionS = 0, margeNetteS = 0;
    const lotsImputes = [];

    ventesS.forEach(v => {
      const ventesAvant = ventes
        .filter(x => x.produit===v.produit && new Date(x.date)<new Date(v.date))
        .sort((a,b)=>new Date(a.date)-new Date(b.date));
      let qteDejaVendue = ventesAvant.reduce((s,x)=>s+x.quantite,0);
      const lotsRecu = achats
        .filter(a=>a.produit===v.produit&&a.statut==="recu")
        .sort((a,b)=>new Date(a.date_reception||a.date)-new Date(b.date_reception||b.date));

      let aConsommer = qteDejaVendue;
      const etatLots = lotsRecu.map(lot => {
        const consomme = Math.min(aConsommer, lot.quantite);
        aConsommer = Math.max(0, aConsommer - lot.quantite);
        return { ...lot, qteRestante: lot.quantite - consomme };
      }).filter(l=>l.qteRestante>0);

      let aVendre = v.quantite;
      etatLots.forEach(lot => {
        if(aVendre<=0) return;
        const pris = Math.min(aVendre, lot.qteRestante);
        aVendre -= pris;
        if(sameName(lot.enregistre_par, nom) && pris>0) {
          const fraisTotauxLot = (lot.droit_terre||0)+(lot.transport||0)+(lot.droit_vente||0)+(lot.charrette||0);
          const fraisUnitairesLot = lot.quantite ? fraisTotauxLot/lot.quantite : 0;
          const caPortion = pris * v.prix_vente;
          const coutPortion = pris * (lot.prix_unitaire + fraisUnitairesLot);
          const mn = caPortion - coutPortion;
          margeNetteS += mn;
          commissionS += Math.max(0, mn * 0.10);
          if(!lotsImputes.find(l=>l.id===lot.id)) {
            lotsImputes.push({...lot, qteVendue:0, mn:0, comm:0, datesVente:new Set()});
          }
          const li = lotsImputes.find(l=>l.id===lot.id);
          if(li){
            li.qteVendue+=pris; li.mn+=mn; li.comm+=Math.max(0,mn*0.10);
            li.datesVente.add((v.date||"").slice(0,10));
          }
        }
      });
    });

    totalCommission += commissionS;
    totalMargeNette += margeNetteS;
    if(commissionS<=0 && margeNetteS===0) return null;

    // Convertir datesVente (Set) en tableau trié pour chaque lot
    lotsImputes.forEach(l=>{ l.datesVente = [...l.datesVente].sort(); });

    return {
      cle, dateRef,
      ventesCount: ventesS.length,
      lots: lotsImputes,
      commission: commissionS,
      margeNette: margeNetteS
    };
  }).filter(Boolean);

  return {semaines, totalCommission, totalMargeNette, nbLots: lotsUser.length};
}

  )];

  // vue utilisateur (calculerCommissionParSemaine) pour garantir des montants
  // et un découpage par semaine ISO strictement identiques entre les deux vues.
  const usersHtml = usersAvecLots.map(nom => {
    const calc = calculerCommissionParSemaine(nom);

    const dejaPaye = commissionsPaiements.filter(c=>sameName(c.utilisateur,nom)).reduce((s,c)=>s+(c.montant||0),0);
    const reste = Math.max(0, totalCommUser - dejaPaye);
    const tropPercu = Math.max(0, dejaPaye - totalCommUser);
    const estSolde = dejaPaye>0 && reste<=0;
    return '<div style="background:#fff;border:1.5px solid #e4ede7;border-radius:14px;padding:14px;margin-bottom:10px;">'
      +'<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">'

          +'<div style="width:36px;height:36px;background:'+col+';border-radius:999px;display:flex;align-items:center;justify-content:center;font-weight:900;color:#fff;font-size:16px;">'+nom.charAt(0).toUpperCase()+'</div>'
          +'<div><div style="font-weight:800;color:#0f1f16;font-size:14px;">'+nom+'</div>'
          +'<div style="font-size:10px;color:#6b8c7a;">'+calc.nbLots+' lot'+(calc.nbLots>1?'s':'')+'</div></div>'
        +'</div>'
        +'<div style="background:linear-gradient(135deg,#0d3d1a,#166534);border-radius:10px;padding:8px 14px;text-align:center;">'
          +'<div style="font-size:14px;font-weight:900;color:#fff;">'+fmt(totalCommUser)+'</div>'
          +'<div style="font-size:9px;color:#86efac;">Commission due</div>'
        +'</div>'
      +'</div>'
      +'<div style="display:flex;gap:8px;margin-bottom:8px;font-size:11px;">'
        +'<div style="flex:1;background:#f0fdf4;border:1px solid #bbf7d0;border-radius:8px;padding:6px 10px;text-align:center;"><div style="font-weight:900;color:#166534;">'+fmt(dejaPaye)+'</div><div style="font-size:9px;color:#3d5c48;">Déjà payé</div></div>'
        +(estSolde
          ? '<div style="flex:1;background:#f0fdf4;border:1px solid #bbf7d0;border-radius:8px;padding:6px 10px;text-align:center;"><div style="font-weight:900;color:#166534;">✓ Soldé</div><div style="font-size:9px;color:#3d5c48;">Tout payé</div></div>'
          : '<div style="flex:1;background:'+(reste>0?'#fff7ed':'#f0fdf4')+';border:1px solid '+(reste>0?'#fed7aa':'#bbf7d0')+';border-radius:8px;padding:6px 10px;text-align:center;"><div style="font-weight:900;color:'+(reste>0?'#c2410c':'#166534')+';">'+fmt(reste)+'</div><div style="font-size:9px;color:#3d5c48;">Reste à payer</div></div>')
      +'</div>'

        : '')

function updatePaiementCalc(montantDu, dejaPaye) {
  const montant = parseFloat(document.getElementById("pc_montant")?.value)||0;
  const elStatut = document.getElementById("pc_statut");
  const elEcart = document.getElementById("pc_ecart");
  if(!elStatut||!elEcart) return;

  const totalApres = dejaPaye + montant;
  const ecart = totalApres - montantDu;

  let statutLabel, statutColor;
  if(totalApres >= montantDu){ statutLabel="✓ Payé"; statutColor="#166534"; }
  else if(totalApres > 0){ statutLabel="◐ Partiel"; statutColor="#c2410c"; }
  else { statutLabel="○ Non payé"; statutColor="#6b8c7a"; }

  elStatut.textContent = statutLabel;
  elStatut.style.color = statutColor;

  if(ecart > 0){
    elEcart.textContent = "+"+fmt(ecart)+" (trop-perçu)";
    elEcart.style.color = "#0369a1";
  } else if(ecart < 0){
    elEcart.textContent = fmt(ecart)+" (reliquat dû)";
    elEcart.style.color = "#dc2626";
  } else {
    elEcart.textContent = "0 F";
    elEcart.style.color = "#3d5c48";
  }
}

async function enregistrerPaiementCommission(nom, montantDu) {
  const montantEl = document.getElementById("pc_montant");
  const modeEl = document.getElementById("pc_mode");
  const dateEl = document.getElementById("pc_date");
  const noteEl = document.getElementById("pc_note");
  const msg = document.getElementById("pc_msg");

  const montant = parseFloat(montantEl?.value)||0;
  if(montant<=0){ msg.style.cssText="display:block;color:#dc2626;"; msg.textContent="Saisissez un montant supérieur à 0."; return; }

  const u = usersCache.find(x=>x.nom===nom);
  const semaine = (() => {
    const d = new Date(dateEl?.value || Date.now());
    const onejan = new Date(d.getFullYear(),0,1);
    return Math.ceil((((d - onejan) / 86400000) + onejan.getDay()+1)/7);
  })();

  // Statut calculé sur le cumul (déjà payé + ce paiement) vs montant dû global
  const dejaPaye = commissionsPaiements.filter(c=>c.utilisateur===nom).reduce((s,c)=>s+(c.montant||0),0);
  const totalApres = dejaPaye + montant;
  const statut = totalApres >= montantDu ? "paye" : (totalApres>0 ? "partiel" : "non_paye");

  const payload = {
    id: genId(),
    utilisateur: nom,
    utilisateur_id: u?.id || null,
    montant_du: montantDu,
    montant: montant,
    statut,
    mode_paiement: modeEl?.value || "autre",
    note: noteEl?.value.trim() || "",
    date: dateEl?.value || new Date().toISOString().slice(0,10),
    semaine,
    enregistre_par: currentUser?.nom || "Admin"
  };

  msg.style.cssText="display:block;color:#166534;"; msg.textContent="Enregistrement…";

  try {
    await sbInsert("commissions_paiements", payload);
    commissionsPaiements.unshift(payload);
    localStorage.setItem("va_commissions_paiements", JSON.stringify(commissionsPaiements));

    logAdminAction("PAIEMENT_COMMISSION", nom+" · "+fmt(montant)+"F ("+statut+")");
    showToast("✓ Paiement enregistré : "+fmt(montant));
    closeModal();
    voirCommissionAdmin();
    render();
  } catch(e) {
    msg.style.cssText="display:block;color:#dc2626;"; msg.textContent="Erreur : "+e.message;
  }
}

/**

function voirHistoriquePaiementsCommission(nom) {
  const paiements = commissionsPaiements

  const totalPaye = paiements.reduce((s,c)=>s+(c.montant||0),0);

    const statutLabel = c.statut==="paye"?"✓ Payé":c.statut==="partiel"?"◐ Partiel":"○ Non payé";
    const statutColor = c.statut==="paye"?"#166534":c.statut==="partiel"?"#c2410c":"#6b8c7a";
    const ecart = (c.montant||0) - (c.montant_du||0);

        +'<div style="text-align:right;flex-shrink:0;">'
          +'<div style="font-size:13px;font-weight:900;color:#166534;">'+fmt(c.montant)+'</div>'
          +'<div style="font-size:9px;font-weight:700;color:'+statutColor+';">'+statutLabel+'</div>'
          +(ecart!==0?'<div style="font-size:9px;color:'+(ecart>0?"#0369a1":"#dc2626")+';">'+(ecart>0?"+":"")+fmt(ecart)+'</div>':'')
        +'</div>'

  }).join('');

  showModal(
    '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">'
    +'<div>'
      +'<div style="font-size:17px;font-weight:800;color:#0f1f16;">📋 Historique des paiements</div>'
      +'<div style="font-size:11px;color:#3d5c48;margin-top:2px;">'+nom+' · '+paiements.length+' paiement'+(paiements.length>1?'s':'')+' · Total : '+fmt(totalPaye)+' F</div>'
    +'</div>'
    +'<button onclick="closeModal()" style="background:#f1f5f2;border:none;border-radius:999px;width:32px;height:32px;cursor:pointer;font-size:16px;">✕</button>'
    +'</div>'

  );

/**
 * Génère un PDF simple (facture client ou bon de réception fournisseur)
 * à partir d'une vente ou d'un achat reçu, via jsPDF (chargé en CDN).
 * Le document porte le numéro séquentiel attribué (numero_document).
 */
function pdfCleanText(value){
  return String(value ?? "")
    .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
    .replace(/[’‘]/g,"'").replace(/[“”]/g,'"')
    .replace(/[–—]/g,"-")
    .replace(/[✓✕⚠●○◐]/g,"")
    .replace(/[\u{1F300}-\u{1FAFF}]/gu,"")
    .replace(/[^\x20-\x7E]/g," ")
    .replace(/\s+/g," ")
    .trim();
}
function pdfMoney(value){
  const n = Number(value)||0;
  return n.toLocaleString("fr-FR").replace(/\u202f|\u00a0/g," ") + " F";
}
function pdfText(doc, value, x, y, options){
  doc.text(pdfCleanText(value), x, y, options || {});
}
function genererDocumentPDF(type, item){
  if(typeof window.jspdf==="undefined"){ showToast("Génération PDF indisponible (hors-ligne)","error"); return; }
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({unit:"mm", format:"a4"});
  const numero = item.numero_document || "—";
  const isVente = type==="vente";
  const titre = isVente ? "FACTURE" : "BON DE RÉCEPTION";

  // En-tête
  doc.setFillColor(13,61,26); // vert VerdApp
  doc.rect(0,0,210,28,"F");
  doc.setTextColor(255,255,255);
  doc.setFontSize(18); doc.setFont(undefined,"bold");
  pdfText(doc,"VerdApp CI", 14, 17);
  doc.setFontSize(9); doc.setFont(undefined,"normal");
  pdfText(doc,"Gestion Grossiste Legumes - Cote d'Ivoire", 14, 23);

  doc.setTextColor(20,20,20);
  doc.setFontSize(14); doc.setFont(undefined,"bold");
  pdfText(doc,titre, 196, 17, {align:"right"});
  doc.setFontSize(11); doc.setFont(undefined,"normal");
  pdfText(doc,numero, 196, 23, {align:"right"});

  let y = 40;
  doc.setFontSize(10);
  pdfText(doc,"Date : "+(item.date||""), 14, y);
  if(isVente){
    pdfText(doc,"Client : "+(item.client||"-"), 14, y+6);
  } else {
    pdfText(doc,"Fournisseur : "+(item.fournisseur||"-"), 14, y+6);
    if(item.lieu) pdfText(doc,"Lieu : "+item.lieu, 14, y+12);
  }

  y += isVente ? 16 : 22;

  // Tableau : produit / quantité / prix unitaire / total
  const prixUnit = isVente ? (item.prix_vente||0) : (item.prix_unitaire||0);
  const total = (item.quantite||0)*prixUnit;

  doc.setFillColor(240,244,240);
  doc.rect(14,y,182,8,"F");
  doc.setFont(undefined,"bold"); doc.setFontSize(9);
  pdfText(doc,"Produit",17,y+5.5);
  pdfText(doc,"Quantite",110,y+5.5,{align:"right"});
  pdfText(doc,"Prix unitaire",150,y+5.5,{align:"right"});
  pdfText(doc,"Total",193,y+5.5,{align:"right"});

  y+=8;
  doc.setFont(undefined,"normal");
  pdfText(doc,(item.produit||""),17,y+5.5);
  pdfText(doc,String(item.quantite||0)+" "+(item.unite||""),110,y+5.5,{align:"right"});
  pdfText(doc,pdfMoney(prixUnit),150,y+5.5,{align:"right"});
  pdfText(doc,pdfMoney(total),193,y+5.5,{align:"right"});

  y+=12;
  doc.setDrawColor(220,220,220); doc.line(14,y,196,y);
  y+=8;

  // Frais accessoires (achats uniquement)
  if(!isVente){
    const frais = fraisAchat(item);
    if(frais>0){
      doc.setFontSize(9);
      pdfText(doc,"Frais accessoires (transport, droit de terre, charrette) : "+pdfMoney(frais), 14, y);
      y+=6;
    }
    if(item.avance_paye>0){
      pdfText(doc,"Avance versee : "+pdfMoney(item.avance_paye), 14, y);
      y+=6;
    }
  }

  // Total
  doc.setFontSize(12); doc.setFont(undefined,"bold");
  pdfText(doc,"TOTAL : "+pdfMoney(total), 196, y+4, {align:"right"});

  // Pied de page
  doc.setFontSize(8); doc.setFont(undefined,"normal"); doc.setTextColor(120,120,120);
  pdfText(doc,"Document genere par VerdApp CI - "+new Date().toLocaleString("fr-FR"), 14, 285);
  if(isVente){
    pdfText(doc,"Numerotation sequentielle conforme aux exigences OHADA (Acte uniforme - droit commercial general).", 14, 290);
  }

  const filename = pdfCleanText(numero!=="—"?numero:(isVente?"facture":"bon_reception")) + ".pdf";
  doc.save(filename);
}

// MODULE JOURNAL COMPTABLE — Plan de comptes SYSCOHADA (OHADA révisé)
// ════════════════════════════════════════════════════════════════════════════
//
// Chaque opération métier (achat reçu, vente, perte, paiement de commission)
// génère automatiquement une ou plusieurs écritures comptables (débit/crédit)
// dans la table journal_comptable. Réservé à l'admin/super-admin (RLS).
//
// Plan de comptes retenu pour VerdApp CI :
//   101  Capital
//   311  Marchandises en stock (valorisées FIFO)
//   401  Fournisseurs
//   411  Clients
//   421  Personnel — rémunérations dues (commissions)
//   571  Caisse / Mobile Money
//   601  Achats de marchandises
//   6011 Frais accessoires d'achat (transport, droit de terre, charrette)
//   641  Commissions versées au personnel terrain
//   658  Charges diverses — pertes sur stocks
//   701  Ventes de marchandises

const PLAN_COMPTES = {
  "101":  "Capital",
  "311":  "Marchandises en stock",
  "401":  "Fournisseurs",
  "411":  "Clients",
  "421":  "Personnel — rémunérations dues",
  "571":  "Caisse / Mobile Money",
  "601":  "Achats de marchandises",
  "6011": "Frais accessoires d'achat",
  "641":  "Commissions versées",
  "658":  "Pertes sur stocks",
  "701":  "Ventes de marchandises",
};

let journalComptable = JSON.parse(localStorage.getItem("va_journal_comptable")||"[]");
let budgetsMensuels = JSON.parse(localStorage.getItem("va_budgets_mensuels")||"[]");
let mouvementsCaisse = JSON.parse(localStorage.getItem("va_mouvements_caisse")||"[]");
let investissements = JSON.parse(localStorage.getItem("va_investissements")||"[]");

}

/**
 * Crée une écriture comptable (objet) prêt à insérer.
 */
function ecriture(date, typeOperation, reference, libelle, compteDebit, compteCredit, montant){
  return {
    id: genId(),
    date,
    type_operation: typeOperation,
    reference: reference||null,
    libelle,
    compte_debit: compteDebit,
    compte_debit_libelle: PLAN_COMPTES[compteDebit]||compteDebit,
    compte_credit: compteCredit,
    compte_credit_libelle: PLAN_COMPTES[compteCredit]||compteCredit,
    montant: Math.round(montant*100)/100,
    enregistre_par: currentUser?.nom || "Système",
  };
}

/**
 * Écriture(s) pour un achat reçu :
 *  - 601/6011 Achats (+frais accessoires) au débit, 401 Fournisseurs au crédit,
 *    pour la part non encore réglée (avance_paye déduite)
 *  - si avance payée : 601 au débit, 571 Caisse au crédit, pour l'avance
 */
function ecrituresAchat(a){
  const ecr = [];
  const date = a.date_reception || a.date;
  const montantHT = montantAchat(a);
  const frais = fraisAchat(a);
  const avance = a.avance_paye||0;
  const libelleBase = a.produit+' — '+a.fournisseur+' ('+a.quantite+' u.)';

  if(montantHT>0){
    const detteFournisseur = Math.max(0, montantHT - avance);
    if(detteFournisseur>0){
      ecr.push(ecriture(date,"achat",a.id,"Achat "+libelleBase+" (à crédit)","601","401",detteFournisseur));
    }
    if(avance>0){
      const avanceMarchandise = Math.min(avance, montantHT);
      ecr.push(ecriture(date,"achat",a.id,"Achat "+libelleBase+" (avance versée)","601","571",avanceMarchandise));
    }
  }
  if(frais>0){
    ecr.push(ecriture(date,"achat",a.id,"Frais accessoires — "+libelleBase,"6011","571",frais));
  }
  return ecr;
}

/**
 * Écriture pour une vente :
 *  701 Ventes au crédit, 411 Clients (ou 571 Caisse si encaissée — non distingué
 *  pour l'instant, l'app ne suit pas le mode de règlement client) au débit.
 */
function ecrituresVente(v){
  const montant = montantVente(v);
  if(montant<=0) return [];
  const libelle = "Vente "+v.produit+" ("+v.quantite+" u.) — "+v.date;
  return [ecriture(v.date,"vente",v.id,libelle,"411","701",montant)];
}

/**
 * Écriture pour une perte constatée :
 *  658 Pertes sur stocks au débit, 311 Stocks au crédit.
 */
function ecrituresPerte(p){
  if(!p.valeur_perte) return [];
  const libelle = "Perte "+p.produit+" — "+p.qte_perte+" u. ("+(p.fournisseur||"")+")";
  return [ecriture(p.date,"perte",p.id,libelle,"658","311",p.valeur_perte)];
}

/**
 * Écriture(s) pour un paiement de commission :
 *  - constatation de la charge due : 641 Commissions au débit, 421 Personnel au crédit
 *  - paiement effectif : 421 Personnel au débit, 571 Caisse au crédit
 * Les deux écritures sont générées ensemble car l'app n'enregistre que le paiement
 * (pas la charge à payer séparément) — simplification documentée.
 */
function ecrituresCommission(c){
  if(!c.montant) return [];
  const libelle = "Commission "+(c.utilisateur||"")+" — "+(c.date||"");
  const montantDu = c.montant_du||c.montant;
  const ecr = [];
  if(montantDu>0){
    ecr.push(ecriture(c.date,"commission",c.id,"Charge commission due — "+libelle,"641","421",montantDu));
  }
  ecr.push(ecriture(c.date,"commission",c.id,"Paiement commission — "+libelle,"421","571",c.montant));
  return ecr;
}

/**
 * Écriture d'ouverture du capital (101 Capital / 571 Caisse), à générer une
 * seule fois lors de la régénération rétroactive.
 */
function ecritureOuvertureCapital(montant, date){
  return [ecriture(date,"ouverture",null,"Apport initial — fond de commerce","571","101",montant)];
}

/**
 * Régénère intégralement le journal comptable à partir des données actuelles
 * (achats reçus, ventes, pertes, paiements de commission) + écriture
 * d'ouverture du capital. Remplace le journal existant (idempotent).
 *
 * Appelée depuis l'écran Journal comptable par l'admin.
 */
async function regenererJournalComptable(capitalOuverture){
  const nouvelles = [];

  // Date d'ouverture = date du plus ancien achat (ou aujourd'hui si aucun)
  const toutesDates = [
    ...achats.map(a=>a.date_reception||a.date),
    ...ventes.map(v=>v.date),
  ].filter(Boolean).sort();
  const dateOuverture = toutesDates[0] || new Date().toISOString().slice(0,10);

  if(capitalOuverture>0){
    nouvelles.push(...ecritureOuvertureCapital(capitalOuverture, dateOuverture));
  }

  achats.filter(a=>a.statut==="recu").forEach(a=>{
    nouvelles.push(...ecrituresAchat(a));
  });

  ventes.forEach(v=>{
    nouvelles.push(...ecrituresVente(v));
  });

  pertesLots.forEach(p=>{
    nouvelles.push(...ecrituresPerte(p));
  });

  commissionsPaiements.forEach(c=>{
    nouvelles.push(...ecrituresCommission(c));
  });

  // Tri chronologique
  nouvelles.sort((x,y)=> (x.date||"").localeCompare(y.date||""));

  // Remplacement local immédiat
  journalComptable = nouvelles;
  saveJournalComptable();

  // Synchronisation Supabase : on vide la table puis on réinsère.
  try {
    // Supprime toutes les écritures existantes (id non vide → toujours vrai)
    await sbFetch(`/rest/v1/journal_comptable?id=neq.__none__`, {method:"DELETE"});
    // Insertion par lots de 200 pour éviter les requêtes trop grosses
    const CHUNK=200;
    for(let i=0;i<nouvelles.length;i+=CHUNK){
      await sbFetch(`/rest/v1/journal_comptable`, {
        method:"POST",
        body: JSON.stringify(nouvelles.slice(i,i+CHUNK))
      });
    }
  } catch(e) {
    console.warn("Sync journal_comptable a échoué, conservé en local seulement:", e.message);
  }

  return nouvelles.length;
}

// MODULE TRÉSORERIE (Pôle Financier — Lot 1)
// ════════════════════════════════════════════════════════════════════════════
//
// Suit les entrées et sorties de caisse, calcule le solde courant et un
// historique. Les ventes (table ventes) et achats réglés (avances) restent
// la source du chiffre d'affaires / décaissements fournisseurs ; ce module
// permet d'enregistrer en plus les flux de trésorerie non capturés ailleurs
// (apports, emprunts, salaires, loyers, impôts, charges sociales, divers).
//
// Catégories d'entrée : vente_directe, paiement_client, apport_associe,
//   emprunt, revenu_divers, solde_initial
// Catégories de sortie : achat, salaire, charge_sociale, impot, loyer,
//   investissement, depense_diverse

const CAISSE_CATEGORIES = {
  entree: [
    {id:"solde_initial",   label:"Solde initial de caisse"},
    {id:"vente_directe",   label:"Vente (encaissement direct)"},
    {id:"paiement_client", label:"Paiement client (créance)"},
    {id:"apport_associe",  label:"Apport associé"},
    {id:"emprunt",         label:"Emprunt reçu"},
    {id:"revenu_divers",   label:"Revenu divers"},
  ],
  sortie: [
    {id:"achat",           label:"Achat marchandise"},
    {id:"salaire",         label:"Salaire"},
    {id:"charge_sociale",  label:"Charge sociale"},
    {id:"impot",           label:"Impôt / taxe"},
    {id:"loyer",           label:"Loyer"},
    {id:"investissement",  label:"Investissement"},
    {id:"depense_diverse", label:"Dépense diverse"},
  ],
};

function libelleCategorieCaisse(sens, id){
  const found = (CAISSE_CATEGORIES[sens]||[]).find(c=>c.id===id);
  return found ? found.label : id;
}

/**
 * Flux de trésorerie AUTOMATIQUES dérivés des données métier existantes :
 *  - Entrées : chaque vente (encaissement présumé au comptant)
 *  - Sorties : chaque achat reçu (coût marchandise + frais accessoires)
 * Ces flux sont des objets de même forme que les mouvements manuels, avec
 * un flag `auto:true` (non modifiables/supprimables, non stockés en base).
 */
function fluxCaisseAuto(){
  const flux = [];
  ventes.forEach(v=>{
    const montant = (v.quantite||0)*(v.prix_vente||0);
    if(montant>0) flux.push({
      id:"auto_v_"+v.id, date:v.date, sens:"entree", categorie:"vente_directe",
      montant, mode_paiement:v.mode_paiement||"", note:"Vente "+(v.produit||"")+" — "+(v.client||""),
      auto:true
    });
  });
  achats.filter(a=>a.statut==="recu").forEach(a=>{
    const frais=(a.droit_terre||0)+(a.transport||0)+(a.droit_vente||0)+(a.charrette||0);
    const montant=(a.quantite||0)*(a.prix_unitaire||0)+frais;
    if(montant>0) flux.push({
      id:"auto_a_"+a.id, date:a.date_reception||a.date, sens:"sortie", categorie:"achat",
      montant, mode_paiement:"", note:"Achat "+(a.produit||"")+" — "+(a.fournisseur||""),
      auto:true
    });
  });
  return flux;
}

/**
 * Ensemble complet des mouvements = flux auto (ventes/achats) + mouvements
 * manuels saisis. Utilisé pour tous les calculs et l'affichage.
 */
function tousMouvementsCaisse(){
  return fluxCaisseAuto().concat(mouvementsCaisse);
}

function totalEntreesCaisse(arr){ return (arr||tousMouvementsCaisse()).filter(m=>m.sens==="entree").reduce((s,m)=>s+(+m.montant||0),0); }
function totalSortiesCaisse(arr){ return (arr||tousMouvementsCaisse()).filter(m=>m.sens==="sortie").reduce((s,m)=>s+(+m.montant||0),0); }
function soldeCaisse(arr){ const a=arr||tousMouvementsCaisse(); return totalEntreesCaisse(a) - totalSortiesCaisse(a); }

/**
 * Seuil minimum de trésorerie (alerte si solde en dessous).
 * Stocké en localStorage, configurable par l'admin.
 */
function seuilTresorerie(){
  return parseFloat(localStorage.getItem("va_seuil_tresorerie")) || 0;
}
function configurerSeuilTresorerie(){
  if(!isAdmin){ showToast("Réservé à l'administrateur","error"); return; }
  const actuel = seuilTresorerie();
  const saisie = prompt("Seuil minimum de trésorerie (F)\nUne alerte s'affichera si le solde passe en dessous :", actuel);
  if(saisie===null) return;
  const val = parseFloat(saisie)||0;
  localStorage.setItem("va_seuil_tresorerie", val);
  showToast("✓ Seuil fixé à "+fmt(val));
  render();
}

 * Écran Trésorerie (rendu inline dans Finance & Gestion).
 */

  const target = document.getElementById("tresorerieInline");
  if(!target) return;

  const now = new Date();
  const moisCourant = now.toISOString().slice(0,7);
  const tous = tousMouvementsCaisse();

  const solde = soldeCaisse(tous);
  const entreesMois = totalEntreesCaisse(mvtsMois);

  // Historique trié par date décroissante
  const historique = tous.slice().sort((a,b)=>(b.date||"").localeCompare(a.date||"")||(b.created_at||"").localeCompare(a.created_at||""));

    return '<div style="display:flex;justify-content:space-between;align-items:center;padding:9px 12px;background:#fff;border:1px solid #e4ede7;border-radius:10px;margin-bottom:5px;">'
      +'<div style="flex:1;min-width:0;">'
        +'<div style="font-weight:700;color:#0f1f16;font-size:12px;">'+libelleCategorieCaisse(m.sens,m.categorie)

        +'<div style="font-size:10px;color:#6b8c7a;">'+m.date+(m.mode_paiement?' · '+m.mode_paiement:'')+(m.note?' · '+m.note:'')+'</div>'

  }).join('');

  target.innerHTML =
    '<div style="font-size:11px;font-weight:700;color:#0f1f16;text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px;">💵 Trésorerie</div>'

      ? '<div style="background:#fef2f2;border:1.5px solid #fecaca;border-radius:10px;padding:10px 12px;margin-bottom:10px;color:#dc2626;font-weight:700;font-size:12px;">⚠ Risque de tension de trésorerie — solde '+fmt(solde)+' sous le seuil de '+fmt(seuilTresorerie())+'</div>'
      : '')
    +'<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;">'
      +carte("Solde de caisse", solde, solde>=0?'#166534':'#dc2626', solde>=0?'#f0fdf4':'#fef2f2', solde>=0?'#bbf7d0':'#fecaca')
      +carte("Entrées du mois", entreesMois, '#166534', '#f0fdf4', '#bbf7d0')
      +carte("Sorties du mois", sortiesMois, '#dc2626', '#fef2f2', '#fecaca')
    +'</div>'

    +'<div style="font-size:10px;color:#6b8c7a;margin-bottom:12px;">Les ventes et achats reçus alimentent automatiquement la trésorerie (mention <b>AUTO</b>). Ajoutez les autres flux réels (apports, salaires, loyers, etc.) manuellement.</div>'

    +'<div style="display:flex;gap:8px;margin-bottom:14px;">'

}

    +'<div style="display:flex;gap:10px;">'
      +'<button onclick="enregistrerMouvementCaisse(\''+sens+'\')" style="flex:1;padding:13px;background:'+couleur+';color:#fff;border:none;border-radius:12px;font-weight:800;font-size:14px;cursor:pointer;font-family:inherit;">Enregistrer</button>'
      +'<button onclick="closeModal()" style="padding:13px 18px;background:#f1f5f2;border:none;border-radius:12px;cursor:pointer;font-family:inherit;font-weight:600;color:#3d5c48;">Annuler</button>'
    +'</div>'
  );
  setTimeout(()=>document.getElementById("mc_montant")?.focus(), 150);
}

async function enregistrerMouvementCaisse(sens){
  const msg = document.getElementById("mc_msg");
  const montant = parseFloat(document.getElementById("mc_montant")?.value)||0;
  if(montant<=0){ msg.style.cssText="display:block;color:#dc2626;"; msg.textContent="Saisissez un montant valide."; return; }

  const payload = {
    id: genId(),
    date: document.getElementById("mc_date")?.value || new Date().toISOString().slice(0,10),
    sens,
    categorie: document.getElementById("mc_cat")?.value || (sens==="entree"?"revenu_divers":"depense_diverse"),
    montant,
    mode_paiement: document.getElementById("mc_mode")?.value || "Espèces",
    note: document.getElementById("mc_note")?.value.trim() || "",
    enregistre_par: currentUser?.nom || "Admin",
  };

  msg.style.cssText="display:block;color:#166534;"; msg.textContent="Enregistrement…";
  try {
    await sbInsert("mouvements_caisse", payload);
    mouvementsCaisse.unshift(payload);
    saveMouvementsCaisse();
    logAdminAction("MOUVEMENT_CAISSE", sens+" "+payload.categorie+" "+fmt(montant));
    showToast("✓ Mouvement enregistré");
    closeModal();
    renderTresorerie();
  } catch(e) {
    msg.style.cssText="display:block;color:#dc2626;"; msg.textContent="Erreur : "+e.message;
  }
}

async function supprimerMouvementCaisse(id){
  if(!isAdmin){ showToast("Réservé à l'administrateur","error"); return; }
  const m = mouvementsCaisse.find(x=>x.id===id);
  if(!m) return;
  if(!confirm("Supprimer ce mouvement de "+fmt(m.montant)+" ?")) return;
  try {
    await sbDelete("mouvements_caisse", id);
    mouvementsCaisse = mouvementsCaisse.filter(x=>x.id!==id);
    saveMouvementsCaisse();
    logAdminAction("SUPPR_MOUVEMENT_CAISSE", m.sens+" "+fmt(m.montant));
    showToast("✓ Mouvement supprimé");
    renderTresorerie();
  } catch(e) {
    showToast("Erreur : "+e.message,"error");
  }
}

// ════════════════════════════════════════════════════════════════════════════
// MODULE ANALYSE DES COÛTS (Pôle Financier — Lot 3)
// ════════════════════════════════════════════════════════════════════════════
//
// Ventile les charges en coûts FIXES vs VARIABLES, identifie le top 10 des
// postes de dépense et affiche un camembert (SVG, sans dépendance externe).
//
// Sources : sorties de mouvements_caisse (manuelles) + flux auto (achats +
// frais terrain). Classement fixe/variable par catégorie :
//   VARIABLES : achat marchandise, frais terrain (varient avec le volume)
//   FIXES : salaire, loyer, charge sociale, impôt, dépense diverse
//   (investissement traité à part, hors charges courantes)

const COUT_NATURE = {
  achat:          "variable",
  frais_terrain:  "variable",
  salaire:        "fixe",
  charge_sociale: "fixe",
  impot:          "fixe",
  loyer:          "fixe",
  depense_diverse:"fixe",
  investissement: "investissement",
};

/**
 * Agrège toutes les charges par poste, avec leur nature (fixe/variable).
 * Décompose les achats en marchandise (variable) + frais terrain (variable).
 */
function agregerCouts(){
  const postes = {}; // categorie -> {label, montant, nature}
  const add = (cat, label, montant, nature) => {
    if(montant<=0) return;
    if(!postes[cat]) postes[cat] = {label, montant:0, nature};
    postes[cat].montant += montant;
  };

  // Achats reçus : marchandise + frais terrain (deux postes distincts)
  achats.filter(a=>a.statut==="recu").forEach(a=>{
    add("achat", "Achat marchandise", (a.quantite||0)*(a.prix_unitaire||0), "variable");
    const frais=(a.droit_terre||0)+(a.transport||0)+(a.droit_vente||0)+(a.charrette||0);
    add("frais_terrain", "Frais terrain (transport, droits…)", frais, "variable");
  });

  // Commissions versées (variable, liées au volume vendu)
  const commiss = totalCommissionsDues();
  if(commiss>0) add("commission", "Commissions terrain", commiss, "variable");

  // Pertes sur stock (variable)
  const pertesV = totalPertesValeur();
  if(pertesV>0) add("perte", "Pertes sur stock", pertesV, "variable");

  // Sorties de caisse manuelles
  mouvementsCaisse.filter(m=>m.sens==="sortie" && m.categorie!=="achat").forEach(m=>{
    const nature = COUT_NATURE[m.categorie] || "fixe";
    add(m.categorie, libelleCategorieCaisse("sortie", m.categorie), +m.montant||0, nature);
  });

  return postes;
}

function renderCouts(){
  const target = document.getElementById("coutsInline");
  if(!target) return;

  const postes = agregerCouts();
  const liste = Object.values(postes);

  if(!liste.length){
    target.innerHTML = '<div style="font-size:11px;font-weight:700;color:#0f1f16;text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px;">📉 Analyse des coûts</div>'
      +'<div style="text-align:center;padding:20px;color:#6b8c7a;font-size:12px;background:#f8faf8;border-radius:10px;">Aucune charge enregistrée.</div>';
    return;
  }

  const totalFixe = liste.filter(p=>p.nature==="fixe").reduce((s,p)=>s+p.montant,0);
  const totalVariable = liste.filter(p=>p.nature==="variable").reduce((s,p)=>s+p.montant,0);
  const totalInvest = liste.filter(p=>p.nature==="investissement").reduce((s,p)=>s+p.montant,0);
  const totalCharges = totalFixe + totalVariable; // hors investissement
  const ca = totalVentes();
  const tauxCharges = ca ? Math.round(totalCharges/ca*100) : 0;

  // Top 10 postes par montant (hors investissement)
  const top = liste.slice().sort((a,b)=>b.montant-a.montant).slice(0,10);

  // ── Camembert SVG fixe vs variable ──
  const pieData = [
    {label:"Coûts variables", val:totalVariable, color:"#0369a1"},
    {label:"Coûts fixes", val:totalFixe, color:"#f47820"},
  ].filter(d=>d.val>0);
  const pieTotal = pieData.reduce((s,d)=>s+d.val,0)||1;
  let angle = -90;
  const R=70, CX=80, CY=80;
  const arcs = pieData.map(d=>{
    const frac = d.val/pieTotal;
    const a0 = angle, a1 = angle + frac*360;
    angle = a1;
    const rad = x=>(x*Math.PI/180);
    const x0=CX+R*Math.cos(rad(a0)), y0=CY+R*Math.sin(rad(a0));
    const x1=CX+R*Math.cos(rad(a1)), y1=CY+R*Math.sin(rad(a1));
    const large = frac>0.5?1:0;
    // cas 100% : dessiner un cercle complet
    if(frac>=0.999) return '<circle cx="'+CX+'" cy="'+CY+'" r="'+R+'" fill="'+d.color+'"/>';
    return '<path d="M'+CX+','+CY+' L'+x0.toFixed(2)+','+y0.toFixed(2)+' A'+R+','+R+' 0 '+large+',1 '+x1.toFixed(2)+','+y1.toFixed(2)+' Z" fill="'+d.color+'"/>';
  }).join('');
  const legende = pieData.map(d=>
    '<div style="display:flex;align-items:center;gap:6px;font-size:11px;margin-bottom:4px;">'
    +'<span style="width:12px;height:12px;border-radius:3px;background:'+d.color+';display:inline-block;"></span>'
    +'<span style="color:#3d5c48;">'+d.label+'</span>'
    +'<span style="margin-left:auto;font-weight:800;color:#0f1f16;">'+fmt(d.val)+' ('+Math.round(d.val/pieTotal*100)+'%)</span>'
    +'</div>'
  ).join('');

  const maxTop = top.length?top[0].montant:1;
  const barres = top.map(p=>{
    const couleur = p.nature==="variable"?"#0369a1":p.nature==="investissement"?"#7c3aed":"#f47820";
    const pct = Math.round(p.montant/maxTop*100);
    return '<div style="margin-bottom:7px;">'
      +'<div style="display:flex;justify-content:space-between;font-size:11px;margin-bottom:2px;">'
        +'<span style="color:#0f1f16;font-weight:600;">'+p.label+' <span style="font-size:9px;color:#6b8c7a;">('+(p.nature==="variable"?"variable":p.nature==="investissement"?"invest.":"fixe")+')</span></span>'
        +'<span style="font-weight:800;color:#0f1f16;">'+fmt(p.montant)+'</span>'
      +'</div>'
      +'<div style="height:8px;background:#f1f5f2;border-radius:999px;overflow:hidden;"><div style="height:100%;width:'+pct+'%;background:'+couleur+';border-radius:999px;"></div></div>'
    +'</div>';
  }).join('');

  const carte = (titre, valeur, couleur, sub) =>
    '<div style="flex:1;min-width:130px;background:#fff;border:1.5px solid #e4ede7;border-radius:12px;padding:12px;">'
      +'<div style="font-size:9px;font-weight:700;color:#6b8c7a;text-transform:uppercase;letter-spacing:.06em;">'+titre+'</div>'
      +'<div style="font-size:17px;font-weight:900;color:'+couleur+';margin-top:4px;">'+fmt(valeur)+'</div>'
      +(sub?'<div style="font-size:9px;color:#6b8c7a;margin-top:2px;">'+sub+'</div>':'')
    +'</div>';

  target.innerHTML =
    '<div style="font-size:11px;font-weight:700;color:#0f1f16;text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px;">📉 Analyse des coûts</div>'
    +'<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;">'
      +carte("Coûts variables", totalVariable, "#0369a1", "Varient avec le volume")
      +carte("Coûts fixes", totalFixe, "#f47820", "Indépendants du volume")
      +carte("Total charges", totalCharges, "#0f1f16", "Taux : "+tauxCharges+"% du CA")
    +'</div>'
    +(totalInvest>0?'<div style="font-size:10px;color:#6b8c7a;margin-bottom:12px;">Investissements (hors charges courantes) : <b>'+fmt(totalInvest)+'</b></div>':'')

    +'<div style="background:#fff;border:1.5px solid #e4ede7;border-radius:12px;padding:14px;margin-bottom:14px;">'
      +'<div style="font-size:11px;font-weight:700;color:#0f1f16;margin-bottom:10px;">Répartition fixe / variable</div>'
      +'<div style="display:flex;align-items:center;gap:16px;flex-wrap:wrap;">'
        +'<svg width="160" height="160" viewBox="0 0 160 160" style="flex-shrink:0;">'+arcs+'</svg>'
        +'<div style="flex:1;min-width:160px;">'+legende+'</div>'
      +'</div>'
    +'</div>'

    +'<div style="background:#fff;border:1.5px solid #e4ede7;border-radius:12px;padding:14px;">'
      +'<div style="font-size:11px;font-weight:700;color:#0f1f16;margin-bottom:10px;">Top '+top.length+' postes de dépense</div>'
      +barres
    +'</div>';
}
