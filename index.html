const AVATAR_COLORS=["#f47820","#0369a1","#166534","#7c3aed","#dc2626","#0891b2","#65a30d","#c2410c","#0f766e","#9333ea"];
function avatarColor(nom){ return AVATAR_COLORS[(nom||"A").charCodeAt(0)%AVATAR_COLORS.length]; }

// ── Session utilisateur ───────────────────────────────────────────────────────
let loginSelectedUser = null;
let usersCache = [];

function getSessionUser() {
  try { return JSON.parse(sessionStorage.getItem("va_session_user")||"null"); } catch(e){ return null; }
}
function setSessionUser(u) {
  if(u) sessionStorage.setItem("va_session_user", JSON.stringify(u));
  else sessionStorage.removeItem("va_session_user");
}

// ── Démarrage app — vérifier session ─────────────────────────────────────────
async function demarrerApp() {
  // Afficher le logo sur l'écran login
  // Partager le src du logo topbar → sidebar et login (évite duplication base64)
  const topbarLogo = getEl("topbarLogo");
  const logoSrc = topbarLogo?.src || "";
  const logoImg = document.querySelector('#loginScreen img#loginLogo');
  const sidebarLogo = getEl("sidebarLogo");
  if(sidebarLogo && logoSrc) sidebarLogo.src = logoSrc;
  if(logoImg && logoSrc) logoImg.src = logoSrc;

  const session = getSessionUser();
  if(session && session.id) {
    // Vérifier que l'utilisateur est toujours actif
    try {
      const users = await sbGetUsers();
      const u = users.find(x => x.id === session.id);
      if(u && u.actif) {
        currentUser = u;
        afficherApp();
        return;
      }
    } catch(e) { /* réseau indispo, utiliser session cache */ }
    currentUser = session;
    afficherApp();
    return;
  }
  // Pas de session — afficher l'écran de connexion
  afficherEcranLogin();
}

async function afficherEcranLogin() {
  document.getElementById("loginScreen").style.display = "flex";
  document.getElementById("main").style.display = "none";
  document.getElementById("sidebar") && (document.getElementById("sidebar").style.display = "none");
  document.getElementById("bottomnav") && (document.getElementById("bottomnav").style.display = "none");
  document.getElementById("topbar") && (document.getElementById("topbar").style.display = "none");
  await chargerListeUtilisateurs();
}

function afficherApp() {
  document.getElementById("loginScreen").style.display = "none";
  document.getElementById("main").style.display = "";
  document.getElementById("sidebar") && (document.getElementById("sidebar").style.display = "");
  document.getElementById("bottomnav") && (document.getElementById("bottomnav").style.display = "");
  document.getElementById("topbar") && (document.getElementById("topbar").style.display = "");

  // Mettre à jour le topbar avec l'utilisateur connecté
  const label = getEl("modeLabel");
  const logoutBtn = getEl("logoutBtn");
  if(label && currentUser) {
    label.textContent = currentUser.nom + (currentUser.role==="admin" ? " · Admin" : "");
    label.style.color = currentUser.role==="admin" ? "#f47820" : "rgba(255,255,255,.6)";
  }
  if(logoutBtn) logoutBtn.style.display = "inline-flex";
  const ds = getEl("dataStatus");
  if(ds){ ds.style.display = "inline"; ds.textContent = "● Cache"; ds.style.color = "rgba(255,255,255,.4)"; }

  // Appliquer les restrictions d'accès selon le rôle
  appliquerRestrictionsRole();

  // Cacher/montrer bouton admin selon le rôle
  const adminBtn = getEl("adminBtn");
  if(adminBtn) {
    if(currentUser?.role === "admin") {
      // Admin connecté = déjà admin, cacher le bouton de bascule
      adminBtn.style.display = "none";
      isAdmin = true;
    } else {
      adminBtn.style.display = "inline-flex";
      isAdmin = false;
    }
  }
}

async function chargerListeUtilisateurs() {
  const container = document.getElementById("userList");
  if(!container) return;
  container.innerHTML = '<div style="text-align:center;padding:20px;color:rgba(255,255,255,.4);font-size:12px;">Chargement...</div>';
  try {
    usersCache = await sbGetUsers();
    const actifs = usersCache.filter(u => u.actif);
    if(!actifs.length) {
      afficherModeAdminDirect("Aucun utilisateur configuré. Connectez-vous en tant qu'admin pour créer des accès.");
      return;
    }
    container.innerHTML = actifs.map(function(u) {
      const col = avatarColor(u.nom);
      const roleLabel = u.role === "admin" ? "Administrateur" : "Utilisateur";
      const safeId = u.id.replace(/["']/g,"");
      return '<button onclick="loginSelectUser(\'' + safeId + '\')" '
        + 'style="display:flex;align-items:center;gap:12px;padding:12px 14px;'
        + 'background:rgba(255,255,255,.06);border:1.5px solid rgba(255,255,255,.1);'
        + 'border-radius:14px;cursor:pointer;text-align:left;font-family:inherit;width:100%;">'
        + '<div style="width:40px;height:40px;border-radius:999px;background:' + col + ';'
        + 'display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:900;color:#fff;flex-shrink:0;">'
        + u.nom.charAt(0).toUpperCase() + '</div>'
        + '<div>'
        + '<div style="font-weight:700;color:#fff;font-size:14px;">' + u.nom + '</div>'
        + '<div style="font-size:11px;color:rgba(255,255,255,.4);">' + roleLabel + '</div>'
        + '</div>'
        + '<div style="margin-left:auto;color:rgba(255,255,255,.3);font-size:18px;">›</div>'
        + '</button>';
    }).join("");
  } catch(e) {
    // Erreur réseau ou RLS Supabase → fallback mode PIN admin direct
    afficherModeAdminDirect(null);
  }
}

async function loginConfirmerPin() {
  if(!loginSelectedUser) return;
  const pin = document.getElementById("loginPinInput").value;
  if(!pin) return;

  if(secIsLocked()) {
    const restant = Math.ceil((SEC.lockedUntil-Date.now())/60000);
    document.getElementById("loginPinError").textContent = "🔒 Trop de tentatives. Réessayez dans "+restant+" min.";
    document.getElementById("loginPinError").style.display = "block";
    return;
  }

  let ok = false;

  if(loginSelectedUser.id === "_admin_direct") {
    // Mode secours : vérifier contre le PIN admin local
    const pinBrut = localStorage.getItem("va_admin_pin");
    const pinRef = pinBrut || await hashPin(ADMIN_PIN_DEFAULT);
    const h = await hashPin(pin);
    ok = (pinRef.length===64) ? h===pinRef : pin===pinRef;
  } else {
    const stored = loginSelectedUser.pin_hash;
    if(!stored) { ok = false; }
    else {
      const h = await hashPin(pin);
      ok = (stored.length===64) ? h===stored : pin===stored;
    }
  }

  if(ok) {
    secRecordSuccess();
    currentUser = loginSelectedUser;
    setSessionUser(currentUser);
    logAdminAction("USER_LOGIN","Connexion : "+currentUser.nom);
    afficherApp();
    render();
  } else {
    const bloque = secRecordFail();
    const restants = SEC.MAX_ATTEMPTS - SEC.attempts;
    document.getElementById("loginPinError").textContent = bloque
      ? "🔒 Compte bloqué 5 min."
      : "Code incorrect · "+restants+" essai"+(restants>1?"s":"")+" restant"+(restants>1?"s":"");
    document.getElementById("loginPinError").style.display = "block";
    document.getElementById("loginPinInput").value = "";
  }
}

async function sauvegarderUtilisateur() {
  const id   = document.getElementById("edit-uid").value;
  const nom  = document.getElementById("edit-unom").value.trim();
  const role = document.getElementById("edit-urole").value;
  const pin  = document.getElementById("edit-upin").value;
  const msg  = document.getElementById("user-form-msg");

  if(!nom) { msg.style.display="block"; msg.style.color="#dc2626"; msg.textContent="Le nom est obligatoire."; return; }
  if(!id && !pin) { msg.style.display="block"; msg.style.color="#dc2626"; msg.textContent="Le PIN est obligatoire pour un nouvel utilisateur."; return; }
  if(pin && (pin.length < 4 || !/^\d+$/.test(pin))) { msg.style.display="block"; msg.style.color="#dc2626"; msg.textContent="Le PIN doit contenir au moins 4 chiffres."; return; }

  msg.style.display="block"; msg.style.color="#166534"; msg.textContent="Sauvegarde...";

  try {
    if(id) {
      const data = {nom, role};
      if(pin) data.pin_hash = await hashPin(pin);
      await sbUpdateUser(id, data);
      logAdminAction("USER_EDIT","Modification : "+nom);
      showToast("✓ Utilisateur modifié");
    } else {
      const pin_hash = await hashPin(pin);
      await sbCreateUser({id:genId(), nom, role, pin_hash, actif:true});
      logAdminAction("USER_CREATE","Création : "+nom+" ("+role+")");
      showToast("✓ Utilisateur créé");
    }
    await renderGestionUtilisateurs();
  } catch(e) {
    msg.style.color="#dc2626";
    msg.textContent = errMsg(e);
  }
}

async function toggleUserActif(id, actif) {
  try {
    await sbUpdateUser(id, {actif: !actif});
    logAdminAction("USER_TOGGLE","Statut utilisateur ID:"+id+" → "+(actif?"inactif":"actif"));
    showToast(actif ? "Utilisateur désactivé" : "Utilisateur activé");
    renderGestionUtilisateurs();
  } catch(e) { showToast("Erreur : "+e.message,"error"); }
}

async function supprimerUtilisateur(id, nom) {
  if(!confirm("Supprimer l'utilisateur "+nom+" ? Cette action est irréversible.")) return;
  try {
    await sbDeleteUser(id);
    logAdminAction("USER_DELETE","Suppression : "+nom);
    showToast("Utilisateur supprimé");
    renderGestionUtilisateurs();
  } catch(e) { showToast(errMsg(e),"error"); }
}
